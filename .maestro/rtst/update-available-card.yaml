# Slice 217: a config that names a newer release (but no minimum) shows the quiet "A new version is ready" card above the text box (mock R15); its cross hides it, and it stays hidden for that version.
# The config is the Debug test hook `update-test mode=soft` (a built-in test config for this platform): the flow never reads or changes the live config file.
# Hiding it for good is proved by clearing the test config and setting it again: the same latestVersion must not bring the card back.
# expect-log: UPDATE_CARD shown
# expect-log: UPDATE_CARD hidden
# expect-log: UPDATE state=Available card=False
appId: uk.sirous.readthestupidtext
name: Update available card
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books, and the remembered closed card); fine here: the flow needs no pack and starts with the card not yet closed.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 20000
- launchApp:
    stopApp: false
    arguments:
      cmd: update-test
      mode: soft
- extendedWaitUntil:
    visible:
      id: UpdateCard
    timeout: 10000
- assertVisible:
    id: UpdateGetButton
- tapOn:
    id: UpdateCloseButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible:
      id: UpdateCard
    timeout: 10000
- launchApp:
    stopApp: false
    arguments:
      cmd: update-test
      mode: clear
- launchApp:
    stopApp: false
    arguments:
      cmd: update-test
      mode: soft
- assertNotVisible:
    id: UpdateCard
- assertVisible:
    id: SettingsButton
