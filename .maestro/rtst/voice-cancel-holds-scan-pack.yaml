# Slice 186: Cancel on the voice download notification must not start the scan (OCR) pack by itself.
# The marker proves the hold branch ran; run-flows has no negative log check, so "no download" and the restart case are covered by unit tests.
# The UI is Farsi (lang: fa). The pack status label has AutomationId PackStatusLabel (Slice 215): the flow matches that id plus the fa strings PackStatus_Downloading / PackStatus_Stopped for the state, so the id pins the element and the text pins the state.
# Android only. The notification's Cancel is fired by the Debug test hook `cancel-pack-downloads` (the service is not exported and Maestro has no shade command); it runs the same PackDownloadHost cancel path. On a build without the hold the marker never appears and the flow fails.
# expect-log: OCRPACK held-voice-cancelled fa
appId: uk.sirous.readthestupidtext
name: Voice cancel holds the scan pack
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow starts the voice download itself and needs the packs missing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: fa
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 20000
# Slice 183: the "keep downloading when the phone is locked?" sheet covers the screen; answer Not now by its Android button id (button2 = the cancel button, any language).
# Optional here on purpose (Slice 215): cancelled-voice-pack-stays-cancelled.yaml asserts the sheet and its dismissal; this flow only needs it out of the way.
- extendedWaitUntil:
    visible:
      id: "android:id/button2"
    timeout: 15000
    optional: true
- tapOn:
    id: "android:id/button2"
    optional: true
# Why waiting for Downloading is safe (Slice 215): this flow's clearState removed the pack, so the download always starts. A flow that keeps the pack must wait for Downloading OR the ready state.
# The download must be running before the cancel, and the cancel must have taken effect before the state hook.
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "در حال دانلود صداهای طبیعی.*"
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: cancel-pack-downloads
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "دانلود متوقف شد.*"
    timeout: 30000
# launchApp-restart: the scan pack decides at app start whether the user-cancelled voice pack holds it, so a cold start is what writes the OCRPACK marker.
- launchApp:
    arguments:
      cmd: state
- waitForAnimationToEnd:
    timeout: 8000
