# Slice 162: a fresh install shows the language page; the skip-first-run hook hands over to the reader.
# expect-log: HOOK skip-first-run ok
appId: uk.sirous.readthestupidtext
name: First run and language
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: the flow tests the first-run language page of a fresh install.
    clearState: true
- extendedWaitUntil:
    visible:
      id: LanguageList
    timeout: 20000
- assertVisible:
    id: LanguageContinue
- launchApp:
    # launchApp-restart: skip-first-run changes what the app reads at startup, so it needs a fresh start from the language page.
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 20000
- assertVisible:
    id: PlayButton
