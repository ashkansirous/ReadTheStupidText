# Slice 190: the highlight moves one sentence at a time inside a multi-sentence chunk. The Debug marker SENTENCE_MOVED
# is written once, the first time the highlight moves past the first sentence of any chunk that is still playing,
# so it appearing before READ_END proves the move whatever the chunker does (Slice 361). Android emulator, English only
# (Maestro's inputText does not type Farsi reliably; the Farsi/RTL spans are unit-tested).
# expect-log: READ_START
# expect-log: SENTENCE_MOVED
# expect-log: READ_END
appId: uk.sirous.readthestupidtext
name: Highlight moves one sentence at a time
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), so the read uses whatever voice a fresh install has; fine here because the flow checks only the highlight markers and needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: EditLink
    timeout: 20000
- tapOn:
    id: EditLink
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReviewEditor
    timeout: 10000
- tapOn:
    id: ReviewEditor
    waitToSettleTimeoutMs: 300
- inputText: "The sun came up. The second sentence follows right after it and is a little longer. The third sentence closes the first paragraph of this test. The fourth sentence adds more words to keep the reader busy. The fifth ends it."
- hideKeyboard
- tapOn:
    id: ReviewRead
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReadingText
    timeout: 15000
