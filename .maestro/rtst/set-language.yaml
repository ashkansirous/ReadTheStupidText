# Slice 209: the set-language hook runs the Settings Language row's path (settings, culture, the editor draft's before-rebuild, ShowMain), so a flow switches the app language
# without tapping the action sheet: en -> fa -> sv -> en, each time landing on a rebuilt main page (the Slice 202 path).
# expect-log: HOOK set-language ok fa
# expect-log: HOOK set-language ok sv
# expect-log: HOOK set-language ok en
# expect-log: STATE language=en
appId: uk.sirous.readthestupidtext
name: Switch language by hook
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only switches the UI language and reads nothing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 20000
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: fa
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 15000
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: sv
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 15000
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: en
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 15000
- launchApp:
    stopApp: false
    arguments:
      cmd: state
