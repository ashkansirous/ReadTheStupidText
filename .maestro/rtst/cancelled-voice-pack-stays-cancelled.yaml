# Slice 204: a voice pack the user cancelled stays cancelled after a force-stop and relaunch; only a Download tap restarts it.
# The marker proves the held branch ran on relaunch (a build without the hold never writes it, so the flow fails).
# run-flows has no negative log check: after the run, read the log and confirm no `PACKDL start pack=piper-*` line follows the relaunch
# for 30 s (the wait below), and that one follows the tap. The visible "Download stopped" text proves the Stopped state.
# The UI is Farsi (lang: fa). The pack status label has AutomationId PackStatusLabel (Slice 215): the flow matches that id plus the fa strings PackStatus_Downloading / PackStatus_Stopped for the state, so the id pins the element and the text pins the state.
# Android only. The notification's Cancel is fired by the Debug test hook `cancel-pack-downloads`.
# expect-log: VOICEPACK held-user-cancelled fa
appId: uk.sirous.readthestupidtext
name: Cancelled voice pack stays cancelled
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow starts the voice pack download itself and needs the pack missing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: fa
- extendedWaitUntil:
    visible:
      id: SettingsButton
    timeout: 20000
# Slice 183: the "keep downloading when the phone is locked?" sheet covers the screen; answer Not now by its Android button id (button2 = the cancel button, any language).
# Slice 215: optional (the sheet may not show when an answer is remembered); the wait for Downloading below still fails the flow if the sheet blocks it, and the assertNotVisible fails if it re-shows.
- extendedWaitUntil:
    visible:
      id: "android:id/button2"
    timeout: 15000
    optional: true
- tapOn:
    id: "android:id/button2"
    optional: true
- assertNotVisible:
    id: "android:id/button2"
# Why waiting for Downloading is safe (Slice 215): this flow's clearState removed the pack, so the download always starts. A flow that keeps the pack must wait for Downloading OR the ready state.
# The download must be running before the cancel.
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "در حال دانلود صداهای طبیعی.*"
    timeout: 60000
# stopApp: false (Slice 212): the hook goes to the running app as a new intent; a restart would kill it before HOOKS installed.
- launchApp:
    stopApp: false
    arguments:
      cmd: cancel-pack-downloads
# The cancel was saved and Stopped published; only then is it safe to stop the app.
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "دانلود متوقف شد.*"
    timeout: 30000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "دانلود متوقف شد.*"
    timeout: 20000
# Real 30 s wait with the app in front (Slice 204): nothing with this id ever shows, so this times out after 30000 ms and
# optional: true lets the flow go on. A held pack must not start by itself, so it must not show Downloading meanwhile.
- extendedWaitUntil:
    visible:
      id: HeldPackNeverShown
    timeout: 30000
    optional: true
- assertNotVisible:
    id: PackStatusLabel
    text: "در حال دانلود صداهای طبیعی.*"
- assertVisible:
    id: PackStatusLabel
    text: "دانلود متوقف شد.*"
# the user's tap starts it again
- tapOn:
    id: PackStatusLabel
    text: "دانلود متوقف شد.*"
- extendedWaitUntil:
    visible:
      id: PackStatusLabel
      text: "در حال دانلود صداهای طبیعی.*"
    timeout: 20000
