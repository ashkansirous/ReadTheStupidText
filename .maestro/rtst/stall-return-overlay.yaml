# Slice 320 item 7 (L16, Slice 314): a read whose next chunk is late shows "Still getting the voice ready" with Cancel; leaving the reader for Settings and coming back shows it again.
# Slice 345: the hook holds the read's SECOND chunk wait (chunk 0's wait is the "Preparing the voice" overlay, which owns the overlay), so the typed text is over 200 characters (SpeechTextChunker keeps shorter text whole; StallHookTests pins that this text splits).
# The Debug hook stall-read holds the next chunk wait for up to 90 s (StallHook), so the stall is real for the page (the reader's StallChanged and IsStalled) without a slow voice.
# Precondition: a neural voice pack is installed (the system voice has no chunk wait): run `tools/phone/run-checks.ps1 -Prepare` style setup or any flow that downloaded it first; no clearState keeps it.
# Without it no chunk wait is held and "STALL hold begins" is never written, so the flow fails instead of passing on the system voice.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK set-language ok en
# expect-log: HOOK stall-read ok
# expect-log: STALL hold begins
# expect-log: STALL hold released
appId: uk.sirous.readthestupidtext
name: The stall overlay comes back when the person returns to the reader
---
- launchApp:
    # No clearState: the voice pack must stay (see the header).
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: EditLink
    timeout: 20000
# skip-first-run keeps a stored UI language, so an earlier flow's Farsi would make the overlay line Farsi and the read a translation: put English back by hook (a no-op when it already is).
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: en
- extendedWaitUntil:
    visible:
      id: EditLink
    timeout: 15000
- tapOn:
    id: EditLink
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReviewEditor
    timeout: 10000
- tapOn:
    id: ReviewEditor
    waitToSettleTimeoutMs: 300
- inputText: "The quick brown fox jumps over the lazy dog today while the sun shines on the quiet green hill. Then the fox walks slowly home through the tall grass, and it curls up by the warm fire to sleep until the morning comes again. The end."
- hideKeyboard
- launchApp:
    stopApp: false
    arguments:
      cmd: stall-read
- tapOn:
    id: ReviewRead
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReadingText
    timeout: 15000
# The overlay shows after 500 ms of waiting; its line is the stalled text and its Cancel is there.
- extendedWaitUntil:
    visible:
      id: WaitLine
      text: "Still getting the voice ready.*"
    timeout: 15000
- assertVisible:
    id: WaitCancel
# Leave the reader for Settings and come back with the system Back key (Slice 314: OnAppearing restores the overlay from the reader's IsStalled).
- tapOn:
    id: SettingsButton
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: ReadingText
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: ReadingText
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: WaitLine
      text: "Still getting the voice ready.*"
    timeout: 10000
- assertVisible:
    id: WaitCancel
# Cancel ends the held wait ("STALL hold released") and the overlay goes.
- tapOn:
    id: WaitCancel
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible:
      id: WaitLine
    timeout: 10000
