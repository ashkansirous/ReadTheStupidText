# Slice 433 (iOS part of Slice 291 item 5, now six shots): App Store shot 5 of 6 of Dino Reader, "shelf": the kids' shelf, 12 books. English.
# One of six stand-alone flows (see store-shot-ios-1-picture.yaml for how they are run): it relaunches keeping the app's data (no clearState; skip-first-run and the microphone permission are passed again, and it needs shot 1's full shelf, so it runs after shot 1), sets its own language and leaves nothing behind.
# Mid-flow hooks go to the running app as openLink on the dino-test:// URL; each openLink is followed by the guarded "Open in" tap ("Open in <app>?" is tapped only while that prompt's own text is on screen).
appId: uk.sirous.dinoreader.dbg
name: Store screenshot 5 of 6, shelf, Dino Reader, iOS
---
- launchApp:
    # No clearState: the relaunch keeps the data and leaves grown-up mode (CreateWindow, App.xaml.cs:68), so this is the kids' shelf.
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Slice 404 (review pass: shots 2-5 do not run the shelf hook): shot 1 puts 12 books on the shelf and the data survives the relaunch (no clearState), so this only asserts the shelf is already full, by the book the hook lands last (FullShelfPlan.LastBookTitle). Run it after shot 1.
# English, set explicitly (a previous flow may have left Farsi; voice=0 starts no voice pack). Wait for a string only the English shelf shows, not StoryTile.
- openLink: "dino-test://set-language?lang=en&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible: ".*(My stories|Stories|For grown-ups).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# After the English reset: shot 4 leaves the app in Spanish (it was German, run 44419048246), so the full-shelf check waits for the English title only now.
- extendedWaitUntil:
    visible: ".*Jack and the Beanstalk.*"
    timeout: 30000
# No wait for Three Little Pigs: on the 12-book shelf (Slice 404, Decision 3) the test books sit below the fold (run 44429604107); Jack landing last already shows the shelf is full.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-5-shelf
