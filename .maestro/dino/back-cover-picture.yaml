# Slice 359: the back cover is the book's drawn picture with the credit lines over its middle (Three Little Pigs has back-cover.jpg), never voiced, in every reading mode and in landscape.
# The log marker says which page was drawn: picture=drawn is the picture page, picture=live would be Slice 237's page without a picture (a failing run shows that line instead).
# Nothing is played (no play=1). The credits are found by their English text, so this runs in English; the pictures are taken for the by-eye check of the centred lines on the drawing.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK open-book opened page=16
# expect-log: BACKCOVER shown lines=4 picture=drawn
appId: uk.sirous.dinoreader.dbg
name: Back cover picture with the credits over it
# Runs after the flow pass or fail, so a failure never leaves the phone sideways for the flows after it.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow opens a starter book and speaks nothing, so it needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: three-little-pigs
      page: "16"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
- assertNotVisible:
    id: BackCover
# Picture only first: the credits still show on the back cover (it is a picture with words over it, not a story page).
- tapOn:
    text: 'Picture only'
    waitToSettleTimeoutMs: 300
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: BackCover
    timeout: 10000
- assertVisible: "A traditional tale"
- assertVisible: "Retold for young readers by Ashkan Sirous"
- assertVisible: "Illustration: Ashkan Sirous"
- assertVisible: "October 2026"
- takeScreenshot: back-cover-picture-portrait
# Sideways: the picture and the credits are laid out again on the same page.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: BackCover
    timeout: 10000
- assertVisible: "A traditional tale"
- assertVisible: "October 2026"
- takeScreenshot: back-cover-picture-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: BackCover
    timeout: 10000
# Text only: swipe back to page 16, pick the mode there, and come forward again.
- swipe:
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: ReadingModes
    timeout: 10000
- tapOn:
    text: 'Text only'
    waitToSettleTimeoutMs: 300
- waitForAnimationToEnd:
    timeout: 3000
# Text only has fewer pages than the pictures (page 16 of the pictures lands near page 10 of the text), so swipe on until the back cover shows.
- repeat:
    times: 12
    while:
      notVisible:
        id: BackCover
    commands:
      - swipe:
          direction: LEFT
      - waitForAnimationToEnd:
          timeout: 2000
- assertVisible:
    id: BackCover
- assertVisible: "Illustration: Ashkan Sirous"
- takeScreenshot: back-cover-picture-text-only
