# Slice 232 part E: the intro wizard held sideways splits (picture left, copy right, Skip and the main button in one row), and rotating keeps the step. Uses Maestro's setOrientation;
# tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# The wizard is opened as a replay from Settings > About ("Show the intro again"), so no first run or voice download is needed.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# A layout line is written whenever the shape changes or a step is built: first card sideways, then upright (same step), then sideways again (same step), then the next step.
# expect-log: [Landscape] intro split=True step=places
# expect-log: [Landscape] intro split=False step=places
appId: uk.sirous.dinoreader.dbg
name: Intro in landscape splits the picture and copy, rotating keeps the step
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the replayed intro, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends: dismiss it only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# Sideways the Settings list pane shows only the first rows, so scroll "About & updates" into view inside the left list column (about 15% across).
- repeat:
    times: 6
    while:
      notVisible: "About & updates"
    commands:
      - swipe:
          start: 15%, 80%
          end: 15%, 30%
- tapOn:
    text: "About & updates"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Show the intro again"
    timeout: 10000
- tapOn:
    text: "Show the intro again"
    waitToSettleTimeoutMs: 300
# First card, sideways: the two places and its Next button.
- extendedWaitUntil:
    visible: Dino has two places
    timeout: 20000
- assertVisible:
    id: IntroNext
- assertVisible: Kids’ shelf
# Upright: the same step (the first card), nothing restarted.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Dino has two places
    timeout: 15000
- assertVisible:
    id: IntroNext
# Back sideways: still the first card.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: Dino has two places
    timeout: 15000
# Next moves to the second step, which has Skip beside its main button.
- tapOn:
    id: IntroNext
- extendedWaitUntil:
    visible: Skip
    timeout: 15000
- assertNotVisible: Dino has two places
# Skip all ends the replay back on Settings.
- tapOn: "Skip all"
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 15000
