# Slice 234 part B (mock Batch 45 frame 137): on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) the grown-up gate is a centred white card, min(800 - 80, 520) = 520 dp wide, with 80 dp answers
# and a 160 dp hold ring; rotating sideways gives Slice 232's split, and rotating back brings the card back on the same step. The 3 s hold itself is not driven (grown-ups-button.yaml covers the chain).
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. Tablet emulator only: a phone never logs card=True.
# expect-log: HOOK skip-first-run ok
# The layout line is written only when the shape changes: the card upright, the split sideways, the card again.
# expect-log: [Landscape] gate split=False step=hold card=True cardWidth=520 key=80 ring=160
# expect-log: [Landscape] gate split=True step=hold card=False
appId: uk.sirous.dinoreader.dbg
name: Gate on a tablet held upright is a centred card with a big hold ring
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the gate from the starter shelf and backs out.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- tapOn:
    id: GalleryGrownUps
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Press and hold for 3 seconds.
    timeout: 15000
- assertVisible: For grown-ups
- assertVisible: Back to the story
# Sideways: the split; upright again: the card, still on the hold step.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: Press and hold for 3 seconds.
    timeout: 15000
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Press and hold for 3 seconds.
    timeout: 15000
- assertVisible: For grown-ups
# Back to the story closes the gate and leaves the kids' shelf.
- tapOn: "Back to the story"
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 15000
