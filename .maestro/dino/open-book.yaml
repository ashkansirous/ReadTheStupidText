# Slice 162: open the first book on the shelf, turn a page, and come back to the gallery.
# expect-log: HOOK skip-first-run ok
# expect-log: PAGE 1
appId: uk.sirous.dinoreader
name: Open a book and turn a page
---
- launchApp:
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- tapOn:
    id: StoryTile
    waitToSettleTimeoutMs: 300
    index: 0
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 20000
- assertVisible:
    id: ReadingTransport
- swipe:
    direction: LEFT
- assertVisible:
    id: ReadingSurface
- tapOn:
    id: ReadingBack
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryTitle
    timeout: 15000
