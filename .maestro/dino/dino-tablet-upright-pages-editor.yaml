# Slice 234 part C (mock Batch 45 frame 145): the page text editor on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) writes its tablet line (the field at 26 sp; the picture band, 440 dp or a 120 dp strip with the keyboard up, only shows for a scanned page with regions, which this flow does not have)
# and keeps the text typed so far. Reaches the editor through Add a book > "Type or paste", as dino-landscape-editor does. Tablet emulator only: a phone never logs [TabletUpright].
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [TabletUpright] editor picture=0 strip=False
appId: uk.sirous.dinoreader.dbg
name: Page text editor on a tablet held upright keeps the typed text
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow types one unsaved page and leaves without saving it.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GalleryAddBook
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Type or paste"
    timeout: 20000
- tapOn:
    text: "Type or paste"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GrownUpDone
    timeout: 15000
- tapOn:
    point: "50%,40%"
    waitToSettleTimeoutMs: 300
- inputText: "The sea came in and filled the moat."
- hideKeyboard
- assertVisible: ".*filled the moat.*"
- assertVisible:
    id: GrownUpDone
# A rotation keeps the text, as on a phone.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: ".*filled the moat.*"
    timeout: 15000
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: ".*filled the moat.*"
    timeout: 15000
