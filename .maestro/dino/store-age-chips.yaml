# Slice 394: the store's age chips come from the data. A band with no book has no chip ("9-12" is gone), each book sits under one band (Freddy under "5 & under", Jack under "6-8"),
# and tapping the chips back and forth never crashes (the 9-12 tap crashed Android 1.129.2). The list loads from the live store server, so this flow needs the re-uploaded meta.json ranges (Slice 394 item 6);
# against the old ranges Jack also shows under "5 & under" and the "Jack" assert below fails.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [AgeChips] visible=True bands=2 selected=0
appId: uk.sirous.dinoreader.dbg
name: Store age chips show only bands with books and switching never crashes
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only reads the store list, downloads nothing and needs no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "5 & under"
    timeout: 30000
- assertVisible: "All ages"
- assertVisible: "6–8"
- assertNotVisible: "9–12"
- tapOn: "5 & under"
# The rows sit below the subscription card, so scroll to them before asserting.
- scrollUntilVisible:
    element: "Freddy and the Slipper"
    timeout: 30000
- assertNotVisible: "Jack and the Beanstalk"
- scrollUntilVisible:
    element: "5 & under"
    direction: UP
    timeout: 30000
- tapOn: "6–8"
- scrollUntilVisible:
    element: "Jack and the Beanstalk"
    timeout: 30000
- assertNotVisible: "Freddy and the Slipper"
- scrollUntilVisible:
    element: "All ages"
    direction: UP
    timeout: 30000
- tapOn: "All ages"
- extendedWaitUntil:
    visible: "5 & under"
    timeout: 10000
