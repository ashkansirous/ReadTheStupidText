# Slice 234 part C (mock Batch 45 frames 144, 146): on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) Backup has its two cards side by side (Slice 278 part B: the Cast screen is gone).
# The page logs its tablet-upright line once its layout is applied. Tablet emulator only: a phone never logs [TabletUpright]. Slice 279 redrew the Record screen as one centred column (mock Batch 48 frames 180 to 184),
# so its tablet-upright layout (frame 142) and this flow's Record part are gone.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# run-flows matches whole tokens, so each line is listed by its first tokens; the numbers that depend on the book are left out.
# expect-log: [TabletUpright] backup sideBySide=True
appId: uk.sirous.dinoreader.dbg
name: Backup uses the tablet-upright layout
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the Backup page, and records, saves and restores nothing.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# Backup (146): the two cards are both on screen upright.
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- repeat:
    times: 6
    while:
      notVisible: "Backup"
    commands:
      - swipe:
          start: 60%, 80%
          end: 60%, 30%
- tapOn:
    text: "Backup"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Save a backup
    timeout: 10000
- assertVisible: Restore from a backup
