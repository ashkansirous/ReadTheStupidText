# Slice 196: a book whose pictures carry its words (Good Enough) opens in Picture only, any other picture book in Picture + text, and a view the reader picks is kept.
# The segment labels come from ModeSwitch (SemanticProperties description = label, hint "Selected" on the active one); the device stage confirms how Maestro sees the pair
# on Android, and shows the first assertion failing against the old behaviour (Good Enough used to open in Picture + text).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK open-book opened page=1
appId: uk.sirous.dinoreader.dbg
name: Default view per book
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow opens only starter books, speaks nothing, and sets its own view choices from a clean state.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Good Enough: Picture only is the active segment, Picture + text is not.
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: good-enough
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: "Picture only.*Selected"
- assertNotVisible:
    text: 'Picture \+ text.*Selected'
# Pick Picture + text, leave, reopen: the pick is kept.
- tapOn:
    text: 'Picture \+ text'
    waitToSettleTimeoutMs: 300
# The mode save is fire-and-forget; give it time to reach story.json before launchApp force-stops the app.
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible:
      text: 'Picture \+ text.*Selected'
    timeout: 5000
- launchApp:
    # launchApp-restart: the flow proves the saved view survives a restart of the app.
    arguments:
      cmd: open-book
      id: good-enough
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: 'Picture \+ text.*Selected'
# Another starter opens in Picture + text.
- launchApp:
    # launchApp-restart: a fresh start from the shelf, so the second book opens with no book left open.
    arguments:
      cmd: open-book
      id: three-little-pigs
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: 'Picture \+ text.*Selected'
