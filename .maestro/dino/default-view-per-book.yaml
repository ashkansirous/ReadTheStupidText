# Slice 196 (fixed by Slice 386): a picture book opens in Picture + text, a view the reader picks is kept per book, and another book is unaffected.
# The segment labels come from ModeSwitch (SemanticProperties description = label, hint "Selected" on the active one); the device stage confirms how Maestro sees the pair
# on Android. Good Enough has opened in Picture + text since Slice 350, so that is the asserted default here.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK open-book opened page=1
appId: uk.sirous.dinoreader.dbg
name: Default view per book
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow opens only starter books, speaks nothing, and sets its own view choices from a clean state.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Good Enough has had text-free pictures since Slice 350 (textInPictures dropped from its book.json and the test-store asset), so it opens in Picture + text like any picture book (Slice 386);
# a book that opens in Picture only is covered by the Story.Mode unit tests, since no test-store book carries the flag.
# Good Enough: Picture + text is the active segment, Picture only is not.
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: good-enough
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: 'Picture \+ text.*Selected'
- assertNotVisible:
    text: "Picture only.*Selected"
# Pick Picture only, leave, reopen: the pick is kept.
- tapOn:
    text: 'Picture only'
    waitToSettleTimeoutMs: 300
# The mode save is fire-and-forget; give it time to reach story.json before launchApp force-stops the app.
- waitForAnimationToEnd:
    timeout: 2000
- extendedWaitUntil:
    visible:
      text: "Picture only.*Selected"
    timeout: 5000
- launchApp:
    # launchApp-restart: the flow proves the saved view survives a restart of the app.
    arguments:
      cmd: open-book
      id: good-enough
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: "Picture only.*Selected"
# Another starter opens in Picture + text (the pick above belongs to Good Enough only).
- launchApp:
    # launchApp-restart: a fresh start from the shelf, so the second book opens with no book left open.
    arguments:
      cmd: open-book
      id: three-little-pigs
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: 'Picture \+ text.*Selected'
