# Slice 162: a fresh install shows the first-run language page; the skip-first-run hook hands over to the gallery.
# expect-log: HOOK skip-first-run ok
appId: uk.sirous.dinoreader.dbg
name: First run
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: the flow tests the first-run language page of a fresh install.
    clearState: true
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    # launchApp-restart: skip-first-run changes what the app reads at startup, so it needs a fresh start from the language page.
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: GalleryTitle
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
