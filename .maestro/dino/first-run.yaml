# Slice 162: a fresh install shows the first-run language page; the skip-first-run hook hands over to the gallery.
# expect-log: HOOK skip-first-run ok
appId: uk.sirous.dinoreader
name: First run
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: GalleryTitle
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
