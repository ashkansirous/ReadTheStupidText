# Slice 228: the grown-ups' corner names itself (one line), has the sticky "back to the shelf" button, and a book's sheet starts with Read now, which leaves the corner and opens the reader.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [GrownUps] read-now leaves the corner
appId: uk.sirous.dinoreader
name: Corner line, sticky way back and Read now
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow uses the starter shelf only and opens a book without playing it, so it needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- assertVisible:
    id: GalleryGrownUps
- assertNotVisible:
    id: GalleryCornerLine
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- assertVisible:
    id: GalleryCornerLine
- assertNotVisible:
    id: GalleryGrownUps
# The one-time "Storyteller voices are ready" note can cover the corner once the background pack download ends: dismiss it by its OK, only when it is on screen (a point tap would hit "Back to my child's shelf").
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReadNow
    timeout: 10000
- tapOn:
    id: BookSheetReadNow
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
# Back from the reader lands on the kids' shelf, not the corner.
- tapOn:
    id: ReadingBack
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryGrownUps
    timeout: 10000
- assertNotVisible:
    id: GalleryDone
- assertNotVisible:
    id: GalleryCornerLine
