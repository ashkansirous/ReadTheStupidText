# Slice 228: the grown-ups' corner names itself (one line), has the sticky "back to the shelf" button, and a book's sheet starts with Read now, which opens the reader and leaves the shelf unlocked.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [GrownUps] read-now opens
appId: uk.sirous.dinoreader.dbg
name: Corner line, sticky way back and Read now
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow uses the starter shelf only and opens a book without playing it, so it needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- assertVisible:
    id: GalleryLock
- assertNotVisible:
    id: LockChip
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- assertVisible:
    id: LockChip
- assertVisible:
    id: LockChip
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReadNow
    timeout: 10000
- tapOn:
    id: BookSheetReadNow
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
# Back from the reader lands on the same unlocked shelf (Slice 418 decision 6: reading neither resets nor locks).
- tapOn:
    id: ReadingBack
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 10000
