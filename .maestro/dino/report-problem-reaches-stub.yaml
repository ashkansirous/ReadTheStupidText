# Slice 249: Settings > Report a problem > Send posts a user report (the app's rolling-log tail, a code, no text) to a local stub and shows the code to quote.
# Precondition (the host, before the run): `node .maestro/dino/report-problem-stub.mjs` is listening on port 8787 (code K7QX2MRD); the emulator reaches it as http://10.0.2.2:8787.
# The stub answers 204 only for a user_report whose message is `user report K7QX2MRD`, with no stack and the app's "page shown" trace lines in the log tail, and 400 for anything
# else, so the CRASH_REPORT marker below proves that report arrived whole. Debug builds never report on their own: the `crash-stub` hook is what lets this one through, and it points
# at the local stub, never at production. `report-code` fixes the code so the screen can be checked against the log.
# Fails against a build without the row: no SettingsReportProblemRow, no code on screen, no markers.
# The gate (hold, then a sum) is tapped through by hand: the enter-grown-up hook stands in for a passed gate.
# Android only (the hooks arrive as intent extras and the stub is reached as 10.0.2.2).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK crash-stub ok
# expect-log: HOOK report-code ok
# expect-log: HOOK enter-grown-up ok
# expect-log: CRASH_REPORT user report sent (status 204), code K7QX2MRD
# expect-log: REPORT_PROBLEM code-shown K7QX-2MRD
appId: uk.sirous.dinoreader.dbg
name: Report a problem sends a user report to the local stub and shows its code (Dino)
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books, pending crash reports); fine here: the flow needs only the starter shelf, the Settings list and an empty pending-report folder.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: crash-stub
      url: http://10.0.2.2:8787
- launchApp:
    stopApp: false
    arguments:
      cmd: report-code
      code: K7QX2MRD
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# The row sits under About, which can be below the fold on a small screen.
- scrollUntilVisible:
    element:
      id: SettingsReportProblemRow
    timeout: 20000
- tapOn:
    id: SettingsReportProblemRow
- extendedWaitUntil:
    visible:
      id: ReportProblemSend
    timeout: 10000
- assertNotVisible:
    id: ReportProblemCode
- tapOn:
    id: ReportProblemSend
# The code is on screen as the person sees it (two groups of four), with the Copy button and the "Sent." line.
- extendedWaitUntil:
    visible:
      id: ReportProblemCode
    timeout: 30000
- assertVisible:
    id: ReportProblemSent
- assertVisible: K7QX-2MRD
- assertVisible:
    id: ReportProblemCopy
- assertNotVisible:
    id: ReportProblemFailed
