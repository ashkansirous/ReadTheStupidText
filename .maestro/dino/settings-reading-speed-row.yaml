# Slice 226: the Reading speed row on the Settings list is found by its title and opens its page (Android and iOS; Slice 205 high 9 never opened it).
# The gate (hold, then a sum) is tapped through by hand: the enter-grown-up hook stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader
name: Settings, Reading speed row opens its page
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends: dismiss it only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# The row is found by its AutomationId (the row button has no text; its accessible name is "Reading speed, 1.0x"), then opens the page whose helper line is "Slower is easier for little ones".
- tapOn:
    id: SettingsReadingSpeedRow
- extendedWaitUntil:
    visible: Slower is easier for little ones
    timeout: 10000
# Back returns to the Settings list, where the row is still there.
- back
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
