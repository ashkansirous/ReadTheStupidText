# Slice 291 item 5 (iOS part): App Store shot 3 of 5 of Dino Reader, "language": the same page as shot 1 (page 6 of Three Little Pigs) in Farsi, on the four test books.
# One of five stand-alone flows (see store-shot-ios-1-reading.yaml for how they are run): it relaunches keeping the app's data (no clearState; skip-first-run and the microphone permission are passed again, so it also works when shot 1 was never taken), sets its own language (Farsi) and leaves nothing the next one needs: every other flow sets English itself.
# Mid-flow hooks go to the running app as openLink on the dino-test:// URL; each openLink is followed by the guarded "Open in" tap ("Open in <app>?" is tapped only while that prompt's own text is on screen).
appId: uk.sirous.dinoreader.dbg
name: Store screenshot 3 of 5, language, Dino Reader, iOS
---
- launchApp:
    # No clearState: the relaunch keeps the data. A relaunch builds a new window, and CreateWindow leaves grown-up mode (App.xaml.cs:68), so this starts on the kids' shelf: set-language rebuilds the root but GrownUpMode survives it (run 43733772461: from the record intro the link timed out, code=60, and the Farsi wait failed on a corner shelf).
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# set-language switches the screens (skip-first-run lang=fa does not); voice=0 starts no voice pack.
- openLink: "dino-test://set-language?lang=fa&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
# Wait for a string only the Farsi shelf shows (Gallery_Title "داستان‌های من", Gallery_ShelfTitleShort "داستان‌ها" or the grown-ups pill Gallery_GrownUpsPill "بزرگ‌ترها" in AppResources.fa.resx; Gallery_ForGrownUps is the gate page's text, not the shelf's), not StoryTile: the English shelf has it too.
- extendedWaitUntil:
    visible: ".*(داستان|بزرگ).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# The shelf starts the Farsi audio fetch: let its bar appear (bounded, optional: a fast run may need no fetch), then wait until the bar and Cancel are gone so no banner covers the shot.
- extendedWaitUntil:
    visible:
      id: ShelfAudioCancel-fa
    timeout: 10000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: ShelfAudioCancel-fa
    timeout: 60000
- openLink: "dino-test://open-book?id=three-little-pigs&page=6"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 3000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 60000
# The sound-line pill can come after the reading surface: let it appear (bounded, optional), then wait until it is gone.
- extendedWaitUntil:
    visible:
      id: ReadingAudioStatus
    timeout: 10000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: ReadingAudioStatus
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-3-language
