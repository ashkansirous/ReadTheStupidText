# Slice 320 item 6 (L209, L346): Settings held sideways in Arabic (right to left). The English flow dino-landscape-settings.yaml taps "Animal sounds" and waits on English text, so its Arabic copy proved nothing about the layout; this one
# uses only AutomationIds (SettingsTitle, SettingsReadingSpeedRow, GrownUpDoneReadingSpeedPage, GrownUpDoneSettingsPage). It checks the two panes appear, survive a turn upright and back, and Done closes Settings; the shot is for the
# by-eye check that the list and Done are mirrored as designed (L209: Done stays top right was measured by rtl-probe in the 2026-11-08 run). A second row has no AutomationId yet (only Reading speed and Report a problem have one), so the
# pane swap stays in the English flow. The set-language hook switches the screens (voice=0: no voice-pack start); the last step puts English back.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK set-language ok ar
# expect-log: HOOK enter-grown-up ok
# expect-log: [Landscape] settings panes=2 selected=ReadingSpeed
# expect-log: [Landscape] settings panes=1 selected=ReadingSpeed
appId: uk.sirous.dinoreader.dbg
name: Settings in landscape in Arabic has two panes, rotation keeps them, Done closes (by id)
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways or in Arabic.
onFlowComplete:
  - setOrientation: PORTRAIT
  - launchApp:
      stopApp: false
      arguments:
        cmd: set-language
        lang: en
        voice: "0"
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: ar
      voice: "0"
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- assertVisible:
    id: SettingsReadingSpeedRow
- assertVisible:
    id: GrownUpDoneReadingSpeedPage
- takeScreenshot: settings-landscape-ar
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GrownUpDoneSettingsPage
    timeout: 15000
- assertVisible:
    id: SettingsReadingSpeedRow
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: GrownUpDoneReadingSpeedPage
    timeout: 15000
- tapOn:
    id: GrownUpDoneReadingSpeedPage
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
