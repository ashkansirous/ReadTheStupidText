# Slice 272: Lion and Mouse in Farsi is read with its REAL pre-made pack from the piece after the lion's roar on, not by the device voice. The old Farsi pack counted the sound word (the roar) as a spoken
# piece, so from piece 19 on every clip's hash missed and the device voice read the rest. The fetch-audio-pack hook (Debug only) installs the live store's Farsi pack through the pack store, so this needs the
# network and the re-aligned pack published (the merge's dino-store.yml run, v2 or higher). The Debug shelf holds only four test books, so the fetch-audio-pack hook first downloads the book itself from
# The listing keys books by their 32-hex id (content/dino/lion-and-mouse/book.json), not the slug, so every hook here is given the id.
# the live listing when the shelf lacks it (EnsureOnShelfAsync in DinoTestCommands.cs), then installs its pack; open-book waits for both.
# It fails against the old pack: "(sentence 16)" is the highlight sentence of piece 19, the first piece the old pack missed, so with the old pack that line is never written (the device voice reads it).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK set-language ok fa
# expect-log: HOOK fetch-audio-pack ok 1ca50c6936cc44788b992726784e8132 fa
# expect-log: 1ca50c6936cc44788b992726784e8132/fa v
# expect-log: [AudioPack] premade clip plays (sentence 16)
# expect-log: HOOK read start
appId: uk.sirous.dinoreader.dbg
name: Lion and Mouse in Farsi plays pre-made clips past the roar
---
- launchApp:
    arguments:
      cmd: skip-first-run
      lang: fa
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# skip-first-run lang=fa did not switch the screens (the run read "en v1", translated=False): the set-language hook does (voice=0: no voice-pack start, as in set-language.yaml).
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: fa
      voice: "0"
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- launchApp:
    stopApp: false
    arguments:
      cmd: fetch-audio-pack
      id: 1ca50c6936cc44788b992726784e8132
      lang: fa
# The open-book hook waits for the pack download to finish (up to 120 s). Page 5 is the page where the lion lifts his paw (piece 19).
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: 1ca50c6936cc44788b992726784e8132
      page: "5"
      play: page
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 150000
# The Play button describes itself as Pause while the read is Playing; a clip counts as playing. The page is short: the flow ends by the logcat check above.
- extendedWaitUntil:
    visible: "Pause|توقف"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: PremadeAudioNeverShown
    timeout: 15000
    optional: true
- assertVisible:
    id: ReadingSurface
# Put the screens back in English, so later flows that wait on English labels (Pause) still match.
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: en
      voice: "0"
