# Slice 185: a real Dino first run: pick the default language, tap Continue, which starts the voice pack (SpokenLanguage.Use).
# The app must stay alive on the page after Continue (Slice 162 saw a Debug x86_64 SIGSEGV here). Since Slice 261 that page is the book picker (the voice pack downloads behind it, from the tap);
# the Debug test store answers, so the flow does not need the live store.
appId: uk.sirous.dinoreader.dbg
name: First run with voice pack start
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: this flow is the fresh install and starts the voice pack download itself.
    clearState: true
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- tapOn:
    text: "Continue"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: FirstBooksPicker
    timeout: 25000
- extendedWaitUntil:
    notVisible:
      id: FirstRunLanguage
    timeout: 5000
# Real 12 s wait: nothing with this id ever shows, so this times out after 12000 ms; optional: true lets the flow go on.
# Then the app must still be alive on a first-run page (a crash, Slice 162's SIGSEGV, puts the launcher or a crash dialog on screen).
# The pack may still download, have finished or have failed: all three are fine, the picker stays.
- extendedWaitUntil:
    visible:
      id: PackStartSettleNeverShown
    timeout: 12000
    optional: true
- assertVisible:
    id: FirstBooksPicker
