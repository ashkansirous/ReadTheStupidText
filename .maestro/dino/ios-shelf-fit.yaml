# Slice 387 item 3: open the shelf on the iOS simulator (run it with the Pro Max device pattern: the fit numbers show room for the full title there) and assert the full title "My stories" is visible,
# so a title cut to "My s..." fails. The Debug-only shelf-fit.log in the app's data folder holds the header's measurements; dinoreader-ios-sim.yml prints it in its "Shelf fit lines" step.
# The first wait uses the visible words; the final assert uses the id GalleryTitle (iOS flows already use it).
appId: uk.sirous.dinoreader.dbg
name: Shelf header fit lines (iOS diagnostics)
---
- launchApp:
    # No clearState: nothing here needs a clean install.
    arguments:
      cmd: skip-first-run
      lang: en
# A shelf element first: if the first-run screen was not skipped, this fails clearly instead of the title wait. The title (full or short), not the pill, whose iOS accessibility label is the longer "Grown-ups' corner, locked".
- extendedWaitUntil:
    visible: "My stories|Stories"
    timeout: 90000
- waitForAnimationToEnd
# The shelf holds two title labels (full and short words), the unchosen one at Opacity 0: assert through the shown label's id so an invisible label cannot satisfy this.
- assertVisible:
    id: GalleryTitle
    text: "My stories"
