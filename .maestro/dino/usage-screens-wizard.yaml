# Slice 352: the first-run wizard is counted page by page. Scripted only: nothing is sent, the harness off switch stays on.
# The Debug build writes `[Usage] seq=<n> <name> session=<id> ... screen=<current screen> detail=<detail>` for each count that reached the queue (UsageCounter.Stamp),
# so a `screen` count shows as `detail=<screen>:<action>` and a button press as a `tap` with `detail=<screen>:<control>`.
# The run: the language page (Continue), the first-books picker, the intro's four pages: Next on page 1, Skip on pages 2, 3 and 4.
# Against a build without this slice no line carries `detail=intro_1:shown`, so every expect-log line below fails.
# expect-log: HOOK test-store ok ok
# expect-log: detail=first_run:shown
# expect-log: detail=first_run:continue
# expect-log: detail=intro_1:shown
# expect-log: detail=intro_1:next
# expect-log: detail=intro_2:shown
# expect-log: detail=intro_2:skip
# expect-log: detail=intro_3:shown
# expect-log: detail=intro_3:skip
# expect-log: detail=intro_4:shown
# expect-log: detail=intro_4:skip
# The same run proves blob20: those lines also carry `screen=intro_1` ... `screen=intro_4` (read by the device stage in the log).
appId: uk.sirous.dinoreader.dbg
name: The first-run wizard counts each page, Next and Skip (Dino)
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books), on purpose: the flow is the fresh install's first run, which starts with the language page and an empty shelf.
    clearState: true
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- tapOn:
    text: "Continue"
    waitToSettleTimeoutMs: 300
# The Slice 183 "keep downloading when locked?" sheet shows on a fresh install on some devices; dismissed when it is there.
- tapOn:
    id: android:id/button2
    optional: true
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: FirstBooksPicker
    timeout: 30000
- tapOn:
    id: FirstBookCard-0
    waitToSettleTimeoutMs: 300
# FirstBooks.Minimum is 2: Continue ends the step only once two books are ticked.
- tapOn:
    id: FirstBookCard-1
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBooksContinue
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: FirstRunReady
    timeout: 40000
- tapOn:
    text: "See what Dino can do"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Dino has two places
    timeout: 30000
- tapOn:
    id: IntroNext
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Read a story together
    timeout: 15000
- tapOn:
    text: "Skip"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Read it in your voice
    timeout: 15000
- tapOn:
    text: "Skip"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Which languages should stories be in?
    timeout: 15000
- tapOn:
    id: IntroLanguagesSkip
    waitToSettleTimeoutMs: 300
