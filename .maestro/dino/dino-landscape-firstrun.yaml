# Slice 232 part E: the first-run language page held sideways splits (welcome left, a 3-column language grid right with Continue under it); rotating keeps the page and the pick.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. Nothing is downloaded: the flow never taps Continue.
# The layout line is written only when the shape changes: split with 3 columns sideways, 2 columns upright, 3 again.
# expect-log: [Landscape] firstrun split=True columns=3 page=language
# expect-log: [Landscape] firstrun split=False columns=2 page=language
# The pick is read from the log (selected=<code>), not from an id: written at the tap and again after each rotation.
# expect-log: [Landscape] firstrun split=True columns=3 page=language selected=de
# expect-log: [Landscape] firstrun split=False columns=2 page=language selected=de
appId: uk.sirous.dinoreader.dbg
name: First run in landscape splits the welcome and the language grid, rotating keeps the pick
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: the flow needs the fresh install's first-run language page.
    clearState: true
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: Hello! Which language do we read in?
    timeout: 15000
- assertVisible: Continue
# Pick a language other than the default, then rotate: the page and the pick stay.
- tapOn:
    text: "Deutsch"
    waitToSettleTimeoutMs: 300
- assertVisible: Deutsch
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 15000
- assertVisible: Continue
- assertVisible: Deutsch
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 15000
- assertVisible: Continue
- assertVisible: Deutsch
- assertNotVisible:
    id: FirstRunReady
