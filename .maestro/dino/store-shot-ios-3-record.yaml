# Slice 433 (was shot 2 of Slice 291 item 5): App Store shot 3 of 6 of Dino Reader, "record": the record intro "Who will you record?", before Start is tapped (path of record-per-character.yaml). English, on the full 12-book shelf.
# One of six stand-alone flows (see store-shot-ios-1-picture.yaml for how they are run): it relaunches keeping the app's data (no clearState; skip-first-run and the microphone permission are passed again, and it needs shot 1's full shelf, so it runs after shot 1), sets its own language and leaves nothing the next one needs.
# Mid-flow hooks go to the running app as openLink on the dino-test:// URL; each openLink is followed by the guarded "Open in" tap ("Open in <app>?" is tapped only while that prompt's own text is on screen).
appId: uk.sirous.dinoreader.dbg
name: Store screenshot 3 of 6, record, Dino Reader, iOS
---
- launchApp:
    # No clearState: the relaunch keeps the data. A relaunch builds a new window, and CreateWindow leaves grown-up mode (App.xaml.cs:68), so this starts on the kids' shelf whatever the flow before did.
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Slice 404 (review pass: shots 2-6 do not run the shelf hook): shot 1 puts 12 books on the shelf and the data survives the relaunch (no clearState), so this only asserts the shelf is already full, by the book the hook lands last (FullShelfPlan.LastBookTitle). Run it after shot 1.
- extendedWaitUntil:
    visible: ".*Jack and the Beanstalk.*"
    timeout: 30000
# English, set explicitly (voice=0 starts no voice pack). Wait for a string only the English shelf shows, not StoryTile.
- openLink: "dino-test://set-language?lang=en&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible: ".*(My stories|Stories|Books|For grown-ups).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- openLink: "dino-test://enter-grown-up"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
# Slice 404, Decision 3: the four test books stay under the eight newer imports on a 12-book shelf, so Three Little Pigs is below the fold (run 44429604107); scroll to it.
- scrollUntilVisible:
    element:
      text: ".*Three Little Pigs.*"
    timeout: 30000
# The book's own ... button: TileMore whose label ("Options for <title>") names the book, not a position above a title.
- tapOn:
    id: TileMore
    text: ".*Three Little Pigs.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: "Record your voice"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroStart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
# No system microphone dialog over the shot (permissions: all: allow is not shown to cover the microphone on a simulator).
- assertNotVisible:
    text: ".*(Would Like to Access the Microphone|Don.t Allow).*"
- takeScreenshot: store-dino-ios-3-record
