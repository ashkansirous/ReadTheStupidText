# Slice 232 part D, rewritten by Slice 325 part B (grown-up mock frame W1): Settings is one list column (at most 620 dp) at every size, in the corner's content area beside the rail. A row opens its page inside that area
# with its own back arrow (nothing is pushed, the rail stays), rotating keeps the open page, and the back arrow returns to the list. Two-pane Settings and the right pane's Done are gone.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# Against the two-pane page the "[Redesign] settings" lines never appear (the old lines were "[Landscape] settings panes="), so this flow fails on a build from before this part.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [Redesign] corner tab=settings chrome=rail
# expect-log: [Redesign] settings page=AnimalSoundsPage hosted=true
# expect-log: [Redesign] settings page=list hosted=false
appId: uk.sirous.dinoreader.dbg
name: Settings in landscape is one list in the corner, a row opens its page inside, rotation keeps it
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
# One list beside the rail: the rail's tabs and way back stay, the list has no back arrow, no page is open beside it.
- assertVisible:
    id: GalleryRailTitle
- assertVisible:
    id: GalleryStore
- assertVisible:
    id: GalleryDone
- assertNotVisible:
    id: GrownUpBack
- assertNotVisible: Slower is easier for little ones
# A row opens its page inside the content area: Animal sounds, with the back arrow and no Done; the rail stays.
- tapOn:
    text: "Animal sounds"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Animals say.*"
    timeout: 10000
- assertVisible:
    id: GrownUpBack
- assertNotVisible:
    id: GrownUpDoneAnimalSoundsPage
- assertNotVisible:
    id: SettingsReadingSpeedRow
- assertVisible:
    id: GalleryDone
# Rotate upright: the same page stays open, now above the tab bar.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GrownUpBack
    timeout: 15000
- assertVisible: "Animals say.*"
- assertVisible:
    id: CornerTabBooks
# Rotate back: still the same page.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Animals say.*"
    timeout: 15000
# The back arrow returns to the list; the rail stays.
- tapOn:
    id: GrownUpBack
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
- assertVisible:
    id: GalleryDone
