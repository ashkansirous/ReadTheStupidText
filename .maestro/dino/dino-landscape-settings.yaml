# Slice 232 part D: Settings held sideways shows two panes (the list left, the open page right). A tap on a second row swaps the right pane with no push, rotating upright keeps Settings open as one pane
# (the list, no push), rotating back keeps the same right pane, and Done closes Settings as a whole. Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The layout lines are written only when the layout changes: two panes with the first section selected, the swap to Animal sounds, one pane upright, two panes again with Animal sounds kept.
# expect-log: [Landscape] settings panes=2 selected=ReadingSpeed
# expect-log: [Landscape] settings pane=AnimalSounds
# expect-log: [Landscape] settings panes=1 selected=AnimalSounds
# expect-log: [Landscape] settings panes=2 selected=AnimalSounds
appId: uk.sirous.dinoreader.dbg
name: Settings in landscape has two panes, a row swaps the right pane, rotation keeps it
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends: dismiss it only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# Two panes: the list on the left and, on first open, the first page (Reading speed) on the right with its own Done.
- assertVisible:
    id: SettingsReadingSpeedRow
- extendedWaitUntil:
    visible: Slower is easier for little ones
    timeout: 10000
- assertVisible:
    id: GrownUpDoneReadingSpeedPage
# Slice 253 item 2: beside mock frame 118 (Settings, two panes).
- takeScreenshot: shot-118-settings
# A second row swaps the right pane: Animal sounds replaces Reading speed, and the list is still there (nothing was pushed).
- tapOn:
    text: "Animal sounds"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Animals say.*"
    timeout: 10000
- assertNotVisible: Slower is easier for little ones
- assertVisible:
    id: SettingsReadingSpeedRow
- assertVisible:
    id: GrownUpDoneAnimalSoundsPage
# Rotate upright: still Settings, one pane, no pushed page (the list and the Settings Done show, the right pane is gone).
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GrownUpDoneSettingsPage
    timeout: 15000
- assertVisible:
    id: SettingsReadingSpeedRow
- assertNotVisible: "Animals say.*"
# Rotate back: the same right pane (Animal sounds) is shown, not the first row again.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Animals say.*"
    timeout: 15000
- assertVisible:
    id: SettingsReadingSpeedRow
# Done in the right pane closes Settings as a whole, back to the grown-ups' corner.
- tapOn:
    id: GrownUpDoneAnimalSoundsPage
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
