# Slice 362, Slice 418 (onboarding mock 2026-11-19 frames NO2, NO4): a family with two story languages. Step 2 ticks Swedish; the grown-up unticks The Three Little Pigs and picks The Gingerbread Man, so the demo page is Gingerbread page 3.
# Slice 418 decision 1: the listen step has no second-language part. The page plays once in Dino's language (English), there is no language bar and no "tap the other language" bubble, and Continue wakes when the page ends, whatever the family's languages.
# Shots: shot-N4a-two-languages (the name the contact-sheet manifest knows; now it shows no language bar). The flow stops at the voice step (the full path is onboarding-phone.yaml).
# Against the old build the OnboardingLanguage-sv segment and the bubble show, so this flow fails there.
# layout-check
# expect-log: HOOK test-store ok ok
# expect-log: [Onboarding] listen enter kind=Listen page=3 language=en
# expect-log: [Onboarding] listen page-ended continue=True
appId: uk.sirous.dinoreader.dbg
name: First run with two story languages, the listen step plays once with no language bar
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books, saved onboarding step), on purpose: the flow is the fresh install's first run, which starts with the language page and an empty shelf.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- tapOn:
    text: "Continue"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: android:id/button2
    optional: true
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: OnboardingLanguages
    timeout: 15000
# Swedish is the language the test store lists a pre-made audio pack in (for The Gingerbread Man).
- scrollUntilVisible:
    element:
      id: StoryLanguageRow-sv
    direction: DOWN
    timeout: 20000
- tapOn:
    id: StoryLanguageRow-sv
    waitToSettleTimeoutMs: 300
- tapOn:
    id: OnboardingLanguagesContinue
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: FirstBooksPicker
    timeout: 30000
# Pigs is card 0 (ticked at the start): unticked; Gingerbread (card 2) and card 3 are ticked.
- tapOn:
    id: FirstBookCard-0
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBookCard-2
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBookCard-3
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBooksContinue
    waitToSettleTimeoutMs: 300
# NO4: the page plays in English; with two story languages there is still no language bar and no bubble.
- extendedWaitUntil:
    visible:
      id: OnboardingListen
    timeout: 60000
- assertNotVisible:
    id: OnboardingLanguage-sv
- assertNotVisible:
    id: OnboardingBubble
- assertVisible: "Every character has its own voice, and Dino reads with feeling."
- takeScreenshot: shot-N4a-two-languages
# Continue wakes when the page ends (it is dim while it plays); tapping it until the voice step shows.
- repeat:
    times: 45
    while:
      notVisible:
        id: OnboardingVoice
    commands:
      - tapOn:
          id: OnboardingContinue
          optional: true
          waitToSettleTimeoutMs: 1500
- assertVisible: "Record Granny’s lines"
- assertVisible: "Skip this step"
