# Slice 384 (a monthly and yearly subscription for every book, next to buying single books): the scripted device check, with the Debug pretend store (hooks fake-purchases and fake-subscription) and the Debug test store: no
# money, no real store account, no Worker. Written, not yet run (the device stage runs it after the two reviews).
# The test store lists 4 books; fake-purchases marks two of them as sold. The flow buys one book, subscribes (the pretend sheet starts the 7-day trial), downloads the other sold book through the subscription, lapses the
# subscription, checks the lapsed book is greyed on the parents' screen (Subscribe again / Buy this book) and gone from the child's shelf while the bought book and the free books never move, then renews it and checks the book is
# back at once with no download.
# Against the old behaviour (no subscription card, nothing ever locks) the card, the lapsed actions and the shelf markers all fail.
# Android and iOS alike (the hooks go through the shared dispatcher). The gate is not tapped: the enter-grown-up hook stands in for it.
# expect-log: HOOK test-store ok ok
# expect-log: HOOK fake-purchases ok on paid=2 owned=0
# expect-log: HOOK skip-first-run ok
# expect-log: [Subscription] card visible=True active=False monthly=True yearly=True
# expect-log: [Subscription] card visible=True active=False monthly=True yearly=True kind=TrialUsed save=37 trial=False
# expect-log: [Subscription] card visible=True active=False monthly=True yearly=True kind=Offer save=37 trial=True
# expect-log: [Purchases] subscription state=Trial grants=True
# expect-log: [Subscription] card visible=True active=True
# expect-log: HOOK fake-subscription ok expired
# expect-log: [Purchases] subscription state=Expired grants=False
# expect-log: [Subscription] card visible=True active=False monthly=True yearly=True kind=Ended save=37 trial=False locked=1
# expect-log: HOOK fake-subscription ok grace
# expect-log: [Subscription] card visible=True active=True monthly=True yearly=True kind=Grace
# expect-log: [Subscription] shelf total=4 shown=4 lapsed=1 grownUp=True
# expect-log: [Subscription] shelf total=4 shown=3 lapsed=1 grownUp=False
# expect-log: HOOK fake-subscription ok active
# expect-log: [Purchases] subscription state=Active grants=True
# expect-log: [Subscription] shelf total=4 shown=4 lapsed=0 grownUp=False
# Slice 398 (mock SB6 to SB8): the Books tab's "why" banner and the locked tile's two pills while the book is locked, the child's shelf with neither, and the calm offline notice (hook fake-offline) that is never a lock. Against the old
# behaviour (a plain greyed tile with a caption, no banner, no offline notice) the banner, the lock badge, the price pill and the notice all fail. Written, not yet run.
# expect-log: [Subscription] shelf columns=3 grownUp=True
# expect-log: [Subscription] banners locked=1 offline=none
# expect-log: HOOK fake-offline ok on
# expect-log: [Subscription] banners locked=0 offline=shown
# expect-log: HOOK fake-offline ok off
appId: uk.sirous.dinoreader.dbg
name: A subscription opens every paid book; when it ends a subscription book greys out for parents and leaves the child's shelf, and renewing brings it back
onFlowComplete:
  - launchApp:
      stopApp: false
      arguments:
        cmd: fake-offline
        mode: "off"
  - launchApp:
      stopApp: false
      arguments:
        cmd: fake-purchases
        mode: "off"
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books, the kept subscription and book records); fine here: the flow uses the Debug test store and the pretend store only, and needs a fresh install so the sold books are not on the shelf and no subscription is kept.
    clearState: true
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 60000
# The sale is set before the first run is skipped: skip-first-run then puts only the two unsold (free) test books on the shelf.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-purchases
      mode: "on"
      paid: "gingerbread-man,three-little-pigs"
      price: "$0.99"
      buy: ok
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      tab: store
- extendedWaitUntil:
    visible:
      id: GalleryStoreSub
    timeout: 30000
# The subscription card heads the list with both plans, the store's own price and the trial, then the terms and the links Apple and Google require.
- extendedWaitUntil:
    visible:
      id: StoreSubscriptionCard
    timeout: 30000
- assertVisible:
    text: 'Try free, then .*1\.99 a month'
- assertVisible:
    text: 'Try free, then .*14\.99 a year'
- assertVisible:
    id: StoreSubscriptionTerms
- assertVisible:
    id: StoreSubscriptionTermsLink
- assertVisible:
    id: StoreSubscriptionPrivacyLink
# Slice 397 (mock SB1): the yearly plan carries the Save tag, worked out from the two store prices (14.99 against 12 x 1.99 is 37%).
- assertVisible: "Every book, one subscription"
- assertVisible: "Save 37%"
# Slice 397 (mock SB2): the store says the account used the trial: plain prices, no trial in the buttons, the tag stays.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: none
      trial: used
- extendedWaitUntil:
    visible: '.*14\.99 a year'
    timeout: 30000
- assertNotVisible: 'Try free, then .*'
- assertVisible: "Save 37%"
- assertVisible: 'Renews by itself every month or every year.*'
# Back to a new subscriber: the trial shows again.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: none
      trial: ok
- extendedWaitUntil:
    visible: 'Try free, then .*14\.99 a year'
    timeout: 30000
# Buy one book on its own first: a bought book must never be affected by the subscription later.
# The subscription card heads the list and pushes the second Buy pill below the fold, so scroll to it.
- scrollUntilVisible:
    element:
      text: 'Buy .*\$0\.99.*'
      index: 1
    timeout: 30000
# Scroll back to the first pill by its title and tap that very pill (the scroll above may have moved it off the top).
- scrollUntilVisible:
    element:
      text: 'Buy The Three Little Pigs.*'
    direction: UP
    timeout: 20000
- tapOn:
    text: 'Buy The Three Little Pigs.*'
- extendedWaitUntil:
    notVisible:
      text: 'Buy The Three Little Pigs.*'
    timeout: 60000
# Subscribe monthly: the pretend sheet starts the trial; the card then says the subscription runs and its plan buttons are gone.
- scrollUntilVisible:
    element:
      id: StoreSubscribeMonthly
    direction: UP
    timeout: 20000
- tapOn:
    id: StoreSubscribeMonthly
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "You are subscribed. Every book is open."
    timeout: 60000
- assertNotVisible:
    id: StoreSubscribeMonthly
# Slice 397 (mock SB3): the state line names the trial's end and the price after it; Manage subscription is the card's button; the paid book carries the Included tag with its Get.
- assertVisible: 'Free trial until .*Then .*1\.99 a month.*'
- assertVisible:
    id: StoreSubscriptionManage
- assertVisible: "Included"
# The other sold book is now one to Get (the subscription opens it); downloading it records that the subscription alone opened it.
- extendedWaitUntil:
    visible: "Get"
    timeout: 30000
- tapOn:
    text: "Get"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    notVisible: "Get"
    timeout: 60000
# The subscription ends: the store says so at once (online). The Books tab greys the subscription book with its two actions; the bought book and the free books carry on.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: expired
      days: "-1"
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      tab: books
# The hook only opens the mode on the tab it was already on; tap the Books tab itself.
- tapOn:
    id: CornerTabBooks
    waitToSettleTimeoutMs: 300
- scrollUntilVisible:
    element:
      id: LapsedSubscribe
    timeout: 30000
- assertVisible:
    id: LapsedBuy
- assertVisible:
    id: StoryTile
# Slice 398 (mock SB6): the "why" banner at the top of the Books tab with its two links, the locked tile's two pills (Buy carries the store's price) and no drawn "Locked" caption.
- scrollUntilVisible:
    element:
      id: LockedBanner
    direction: UP
    timeout: 20000
- assertVisible: "Your subscription ended"
- assertVisible: '1 book is locked\. Your child doesn.t see it\..*'
- assertVisible: "See plans in the Store"
- assertVisible: "Restore purchases"
- assertVisible:
    id: LapsedLockBadge
- assertVisible: "Subscribe again"
- assertVisible: 'Buy · .*0\.99'
# The cover's name for a screen reader says it is locked (no caption is drawn); the grown-ups' phone grid has the mock's 3 columns (the expect-log line above).
- assertVisible: '.*Locked: the subscription ended.*'
# "See plans in the Store" opens the Store tab (Slice 397's card for a lapsed subscription), then back to the Books tab.
- tapOn: "See plans in the Store"
- extendedWaitUntil:
    visible:
      id: StoreSubscriptionCard
    timeout: 30000
- tapOn:
    id: CornerTabBooks
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: LockedBanner
    timeout: 20000
# The child's shelf leaves the locked book out (three books are left: two free and the bought one); its files stay on the device. Slice 398 (mock SB8): no banner, no lock, no offer there.
- tapOn:
    id: GalleryDone
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryGrownUps
    timeout: 10000
- assertNotVisible:
    id: LapsedSubscribe
- assertNotVisible:
    id: LapsedBuy
- assertNotVisible:
    id: LockedBanner
- assertNotVisible:
    id: LapsedLockBadge
- assertVisible:
    id: StoryTile
# Slice 397 (mock SB5): the Store's card says it ended, counts the locked book and offers the plans again with no trial.
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      tab: books
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Your subscription ended"
    timeout: 30000
- assertVisible: '1 book on your shelf is locked and hidden from your child.*'
- assertVisible: '.*14\.99 a year'
- assertNotVisible: 'Try free, then .*'
- assertVisible: "Save 37%"
# Slice 397 (mock SB4): a payment problem: the books stay open until the date, Fix payment opens the store page, the books are Included again.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: grace
      days: "3"
- extendedWaitUntil:
    visible: 'Your payment didn.t go through'
    timeout: 30000
- assertVisible: 'Every book stays open until .* while Google Play tries again.*'
- assertVisible:
    id: StoreSubscriptionFixPayment
- assertVisible: "Included"
# Back to the shelf-lapsed state for the renewal below.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: expired
      days: "-1"
# Renewing brings the book back at once: it is on the shelf again with no new download, and nothing is greyed.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-subscription
      state: active
      days: "30"
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      tab: books
- tapOn:
    id: CornerTabBooks
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# The fake store's refresh clears the lapsed state a moment after the hook returns, so wait for it rather than assert once.
- extendedWaitUntil:
    notVisible:
      id: LapsedSubscribe
    timeout: 30000
- assertNotVisible:
    id: LockedBanner
- assertNotVisible:
    id: OfflineBanner
# Slice 398 (mock SB7): offline, past the last end date the store gave and inside the 3 days: a calm banner, never a lock. The books stay normal (nothing greyed, no "why" banner).
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-offline
      mode: "on"
      ended-hours: "5"
- extendedWaitUntil:
    visible:
      id: OfflineBanner
    timeout: 20000
- assertVisible: "Can.t check your subscription"
- assertVisible: 'No internet\. Subscription books stay open until .*, 3 days after the last date the store gave\..*'
- assertNotVisible:
    id: LapsedSubscribe
- assertNotVisible:
    id: LockedBanner
- assertVisible:
    id: StoryTile
# Back online the notice goes at once (the store's answer decides).
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-offline
      mode: "off"
- extendedWaitUntil:
    notVisible:
      id: OfflineBanner
    timeout: 20000
- tapOn:
    id: GalleryDone
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryGrownUps
    timeout: 10000
- assertNotVisible:
    id: LapsedBuy
