# Slice 291 item 5 (iOS part): the App Store screenshots of Dino Reader, taken by .github/scripts/ios-sim-store-shots.sh (store-screenshots.yml) on an iPhone 6.9", an iPhone 6.5" and an iPad 13" simulator.
# The same five screens, in the same order, as the Play phone shots (.maestro/dino/needs-file/store-shot-phone.yaml), held upright, English, on the four test books (no live store, nothing downloaded or read aloud):
# 1-reading a character's line lit (page 6 of Three Little Pigs opens with the Wolf speaking), 2-record "Who will you record?", 3-language the same page in Farsi, 4-grownups the Books tab (no price anywhere on it), 5-shelf the kids' shelf.
# The script swaps the appId line for the app's bundle id and renames store-dino-ios-<n>-<screen> to store-dino-<device>-<n>-<screen>. Run by name only: store-screenshots.ps1 and a normal run-flows.ps1 run skip store-shot-* flows.
# Mid-flow hooks go to the running app as openLink on the dino-test:// URL (iOS reads launch arguments only at a process start, see ios-read-back-reread-background.yaml); each openLink is followed by the guarded "Open in" tap.
# The way back to the shelf is a relaunch that keeps the data (launchApp without clearState), never ReadingBack: on the iPad the floating header is one accessibility element named after the book and ReadingBack is not in the hierarchy (Slice 291 item 5 note).
# The simulator boots upright, so there is no setOrientation step (the Android flow's one guards a rotated emulator).
appId: uk.sirous.dinoreader.dbg
name: Store screenshots, Dino Reader, iOS
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books); fine here: a fresh simulator install, the flow uses the four test books only and needs no pack or own book (the shots show a fresh shelf). The microphone permission is granted again at this launch because clearState revokes it, so no dialog covers the recording screen.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
# Shot 1: page 6 of Three Little Pigs opens with the Wolf speaking, so a character line is lit.
# iOS asks "Open in <app>?" for a custom-scheme link: Open is tapped only while that prompt's own text is on screen (never an app control labelled Open).
- openLink: "dino-test://open-book?id=three-little-pigs&page=6"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-1-reading
# Back to the shelf: relaunch keeping the data (no clearState).
- launchApp
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Shot 2: the record intro "Who will you record?", before Start is tapped (path of record-per-character.yaml).
- openLink: "dino-test://enter-grown-up"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    text: ".*Three Little Pigs.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: "Record your voice"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroStart
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
# No system microphone dialog over the shot (permissions: all: allow is not shown to cover the microphone on a simulator).
- assertNotVisible:
    text: ".*(Would Like to Access the Microphone|Don.t Allow).*"
- takeScreenshot: store-dino-ios-2-record
# No relaunch here: set-language rebuilds the window's root (DinoTestCommands.cs, RebuildRoot), so the record intro is gone and a new shelf is up whatever screen the flow was on.
# Shot 3: the same page as shot 1 in Farsi. set-language switches the screens (skip-first-run lang=fa does not); voice=0 starts no voice pack.
- openLink: "dino-test://set-language?lang=fa&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
# Wait for a string only the Farsi shelf shows (Gallery_Title, Gallery_ShelfTitleShort or Gallery_ForGrownUps in AppResources.fa.resx), not StoryTile: the English shelf has it too.
- extendedWaitUntil:
    visible: ".*(داستان|برای بزرگسالان).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# The shelf starts the Farsi audio fetch: let its bar appear (bounded, optional: a fast run may need no fetch), then wait until the bar and Cancel are gone so no banner covers the shot.
- extendedWaitUntil:
    visible:
      id: ShelfAudioCancel-fa
    timeout: 10000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: ShelfAudioCancel-fa
    timeout: 60000
- openLink: "dino-test://open-book?id=three-little-pigs&page=6"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 60000
# The sound-line pill can come after the reading surface: let it appear (bounded, optional), then wait until it is gone.
- extendedWaitUntil:
    visible:
      id: ReadingAudioStatus
    timeout: 10000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: ReadingAudioStatus
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-3-language
- openLink: "dino-test://set-language?lang=en&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
# Wait for a string only the English shelf shows now (the reading page was Farsi), not StoryTile.
- extendedWaitUntil:
    visible: ".*(My stories|Stories|For grown-ups).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# Shot 4: the grown-ups corner, Books tab (the books list shows no price).
- openLink: "dino-test://enter-grown-up?tab=books"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# No price in a store image (Apple 2.3.7): fail rather than shoot one.
- assertNotVisible:
    text: ".*[$£€].*"
- takeScreenshot: store-dino-ios-4-grownups
# Shot 5: the kids' shelf of illustrated books (the relaunch leaves grown-up mode).
- launchApp
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-5-shelf
