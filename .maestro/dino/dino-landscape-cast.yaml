# Slice 232 part C (mock Batch 44 frame 119): the Cast screen's rows become a grid of two columns held sideways (each row keeps its sample play button) and one column again upright;
# the header's Done and the narrator row stay on screen through both rotations. Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The cast line is written only when the number of columns changes (run-flows matches whole tokens, so the row count, which depends on the book, is left out).
# expect-log: [Landscape] cast columns=2
# expect-log: [Landscape] cast columns=1
appId: uk.sirous.dinoreader.dbg
name: Cast screen is a two-column grid held sideways
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens a starter book's cast and edits nothing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note may cover the shelf: dismiss it by its OK, only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: Cast
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Who’s speaking"
    timeout: 30000
- assertVisible:
    id: GrownUpDone
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Change for all books"
    timeout: 15000
- assertVisible: "Who’s speaking"
- assertVisible:
    id: GrownUpDone
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Change for all books"
    timeout: 15000
- assertVisible:
    id: GrownUpDone
