# Slice 268: the grown-up book sheet has no "Show original text" row, and a book opens in the app language.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader.dbg
name: Book sheet has no Show original text
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books); fine here: the flow uses starter books only.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- assertNotVisible:
    text: "Show original text.*"
- assertNotVisible:
    text: ".*original.*"
- tapOn:
    id: BookSheetClose
    waitToSettleTimeoutMs: 300
- launchApp:
    # launchApp-restart: a fresh start, then the book opens with the app language (English).
    arguments:
      cmd: open-book
      id: three-little-pigs
      page: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 90000
- assertVisible:
    text: ".*[Pp]ig.*"
