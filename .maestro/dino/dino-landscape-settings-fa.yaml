# Slice 320 item 6 (L209, L346): Settings held sideways in Farsi (right to left). The English flow dino-landscape-settings.yaml taps "Animal sounds" and waits on English text, so its Farsi copy proved nothing about the layout; this one
# uses only AutomationIds (SettingsTitle, SettingsReadingSpeedRow, GrownUpBack, GalleryDone, CornerTabBooks). Slice 325 part B made Settings one list tab with sub-pages opening inside it (back arrow, no Done), so it checks the
# list beside the rail, a row opening its page with the back arrow, a turn upright and back, and the back arrow returning to the list; the shot is for the by-eye check that the list is mirrored as designed. A second row has no
# AutomationId yet (only Reading speed and Report a problem have one). The set-language hook switches the screens (voice=0: no voice-pack start); the last step puts English back.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK set-language ok fa
# expect-log: HOOK enter-grown-up ok
# The two [Redesign] markers below show only that the corner took the Settings tab (chrome=rail) and the list was shown again; they do not prove the list built. The assertVisible on SettingsReadingSpeedRow below does.
# expect-log: [Redesign] corner tab=settings chrome=rail
# expect-log: [Redesign] settings page=list hosted=false
appId: uk.sirous.dinoreader.dbg
name: Settings in landscape in Farsi is one list, a row opens its page with the back arrow, rotation keeps it (by id)
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways or in Farsi.
onFlowComplete:
  - setOrientation: PORTRAIT
  - launchApp:
      stopApp: false
      arguments:
        cmd: set-language
        lang: en
        voice: "0"
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: set-language
      lang: fa
      voice: "0"
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- assertVisible:
    id: SettingsReadingSpeedRow
- assertNotVisible:
    id: GrownUpBack
- assertVisible:
    id: GalleryDone
- takeScreenshot: settings-landscape-fa
# A row opens its page inside the content area: the back arrow shows, the rail stays.
- tapOn:
    id: SettingsReadingSpeedRow
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GrownUpBack
    timeout: 10000
- assertVisible:
    id: GalleryDone
# Rotate upright: the same page stays open, now above the tab bar.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: CornerTabBooks
    timeout: 15000
- assertVisible:
    id: GrownUpBack
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: GrownUpBack
    timeout: 15000
# The back arrow returns to the list.
- tapOn:
    id: GrownUpBack
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
- assertVisible:
    id: GalleryDone
