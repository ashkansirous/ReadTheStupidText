# Slice 234 part B (mock Batch 45 frames 139, 136, 140): on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) the grown-ups' corner has a 300 dp ink rail with Store solid indigo and three
# columns of books, a book's options open as a 560 dp centred card with the cover on top (a tap outside closes it), and Settings shows two panes with each row's value under its name.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain). Uses no rotation. Tablet emulator only: a phone never logs these values.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [Landscape] shelf layout=rail columns=3 grownUp=True railWidth=300
# expect-log: tabletCorner=True
# expect-log: [Landscape] book sheet card=True width=560 coverOnTop=True
# expect-log: [Landscape] settings panes=2 selected=ReadingSpeed valueUnder=True
appId: uk.sirous.dinoreader.dbg
name: Corner rail, book card and Settings two panes on a tablet held upright
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow uses the starter shelf only and reads nothing aloud, so it needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- assertVisible:
    id: GalleryCornerLine
# A book's options: a centred card with Read now, closed by a tap outside it (the scrim at the top left of the screen).
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReadNow
    timeout: 10000
- tapOn:
    point: "95%,3%"
    waitToSettleTimeoutMs: 300
- assertNotVisible:
    id: BookSheetReadNow
# Settings: two panes upright, the first page on the right, the rows' values under their names.
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- assertVisible:
    id: SettingsReadingSpeedRow
- extendedWaitUntil:
    visible: Slower is easier for little ones
    timeout: 10000
- assertVisible:
    id: GrownUpDoneReadingSpeedPage
# Done closes Settings as a whole and lands back in the corner.
- tapOn:
    id: GrownUpDoneReadingSpeedPage
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 15000
