# Slice 420 (regression for the Slice 418 bug, decision 6): on the UNLOCKED shelf a tap on a cover reads the book; only the ••• (TileMore) opens its options sheet.
# 1.136.0 shipped with the bare cover opening the sheet (TileOverlay's backdrop raised OpenRequested). The title text lives on TileMore's description, so the cover is picked by index, not by its title.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader.dbg
name: A cover tap on the unlocked shelf reads the book
---
- launchApp:
    # clearState: wipes the app's data (settings, packs, own books); fine here: the flow uses the starter shelf only and opens a book without playing it.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
# The cover itself (not its dots): the first StoryTile.
- tapOn:
    id: StoryTile
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 20000
# The options sheet must not be there: its Read now button is the sheet's first row.
- assertNotVisible:
    id: BookSheetReadNow
# Back from the reader lands on the same unlocked shelf (decision 6: reading neither resets nor locks).
- tapOn:
    id: ReadingBack
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 10000
