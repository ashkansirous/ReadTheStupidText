# Slice 325 part C (grown-up mock frames KT1, KT2): on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) the kids' shelf has a 260 dp cream rail (name row, Grown-ups button) and three columns;
# rotating to landscape gives the 290 dp rail and four columns, and rotating back keeps the shelf and brings the three columns back. (Replaces Slice 234's four columns and 40 dp sides, frame 133.)
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. Tablet emulator only: a phone never logs tabletUpright=True.
# The shelf line is written only when the layout changes, so each of these tokens comes from its own pass (run-flows matches whole tokens, so each token is its own expect-log).
# expect-log: HOOK skip-first-run ok
# expect-log: layout=rail
# expect-log: columns=3
# expect-log: tabletUpright=True
# Landscape: four columns, and the tablet-upright rule is off.
# expect-log: columns=4
# expect-log: tabletUpright=False
appId: uk.sirous.dinoreader.dbg
name: Shelf on a tablet held upright shows three columns and keeps its books through a rotation
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow uses the starter shelf only and reads nothing aloud, so it needs no pack or own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
- assertVisible:
    id: GalleryGrownUps
# Landscape: the covers must really draw right after the rotation (the grid layout keeps its kind, only the span changes).
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
- assertVisible:
    id: GalleryGrownUps
# Back upright: the same shelf, still with its books and the grown-ups pill.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
- assertVisible:
    id: StoryTile
- assertVisible:
    id: GalleryGrownUps
