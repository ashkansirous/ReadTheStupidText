# Slice 394 item 1 (throw-away, to commit): tap every age chip that shows against the live store, then "All ages"; the app must stay in front (no "child already has a parent" crash).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader.dbg
name: Store age chips every tap never crashes
---
- launchApp:
    # clearState: wipes the app's data; fine here: the flow only reads the store list.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "5 & under"
    timeout: 30000
- tapOn: "5 & under"
- tapOn: "6–8"
- runFlow:
    when:
      visible: "9–12"
    commands:
      - tapOn: "9–12"
      - tapOn: "5 & under"
      - tapOn: "9–12"
- tapOn: "All ages"
- tapOn: "6–8"
- tapOn: "All ages"
- extendedWaitUntil:
    visible: "5 & under"
    timeout: 10000
