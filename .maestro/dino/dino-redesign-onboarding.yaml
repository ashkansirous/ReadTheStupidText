# Slice 325 part D (onboarding mock "Dino Reader- 2026-11-08 Onboarding.dc.html", frames O1, O2, O3, O5): the first run on the new skeleton, from the language page to "Ready to read!". Scripted only: nothing is hand-driven.
# The language page names its pick in the log; the book picker, the getting page and the ready page each log their page and shape ([Redesign] onboarding page=<language|books|getting|offline|ready> shape=stack|split|centred).
# Which shot beside which frame: shot-O1-language beside O1 (OL1 held sideways, OTL1 on RTST_Tablet), shot-O2-books beside O2. The 375 x 667 frames (O1-8, O2-8) are the same flow run on the AVD with
# `wm size 750x1334` and `wm density 320` (restored after) and renamed by tools/emulator/contact-sheet.ps1 -Since; shot-O1-8-language is taken here too and is only meaningful at that size.
# shot-OL1-language, shot-OTL1-language and shot-OW2-books come from this flow run sideways, on RTST_Tablet and in the Windows VM (tools/desktop-vm/checks/dino-first-run.ps1 reads the same log lines).
# Against the old skeleton the log line [Redesign] onboarding never appears, so the expect-log lines fail on a build from before this slice.
# layout-check
# expect-log: HOOK test-store ok ok
# The shape tokens below are the phone held upright (run-flows matches whole tokens); held sideways or on RTST_Tablet the same lines read shape=split.
# expect-log: [Redesign] onboarding page=language shape=stack
# expect-log: [Redesign] onboarding page=books shape=stack
# expect-log: [Redesign] onboarding page=getting shape=centred
# expect-log: [Redesign] onboarding page=ready shape=centred
# expect-log: [FirstBooks] done listed=4 ticked=2 onShelf=2
appId: uk.sirous.dinoreader.dbg
name: First run on the new skeleton, language to ready
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: the flow is the fresh install's first run, which starts with the language page and an empty shelf.
    clearState: true
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- assertVisible: "Hello! Which language do we read in?"
- assertVisible: "You can change it later in the grown-ups’ corner."
- assertNotVisible: "Dino downloads a voice for it. You can change it later behind the lock."
- assertVisible:
    id: FirstRunLanguage-en
- takeScreenshot: shot-O1-language
- takeScreenshot: shot-O1-8-language
- tapOn:
    text: "Continue"
    waitToSettleTimeoutMs: 300
# The Slice 183 "keep downloading when locked?" sheet shows on a fresh install on some devices; dismissed when it is there.
- tapOn:
    id: android:id/button2
    optional: true
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: FirstBooksPicker
    timeout: 30000
- assertVisible:
    id: FirstBookCard-0
- takeScreenshot: shot-O2-books
- takeScreenshot: shot-OW2-books
- tapOn:
    id: FirstBookCard-0
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBookCard-1
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBooksContinue
    waitToSettleTimeoutMs: 300
# The getting page may be gone in a moment with the fast test store; the ready page is the end.
- extendedWaitUntil:
    visible:
      id: FirstRunReady
    timeout: 40000
- assertNotVisible:
    id: FirstBooksPicker
- assertVisible: "Ready to read!"
- assertVisible: "See what Dino can do"
- assertNotVisible: "Hear Dino say hello"
# The usage-count line went with this slice (user, 2026-11-08: "Drop it, as the mock"): its first words are nowhere on the ready page.
- assertNotVisible: "Dino counts which books get read.*"
