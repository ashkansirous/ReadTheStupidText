# Slice 375 D: on a limited connection (Wi-Fi off, mobile data on) a tablet downloads the standard pack, marks the book pending, and does not start the high-res download while limited.
# The swap on Wi-Fi is the next flow, high-res-swap-on-wifi: run-flows.ps1 turns Wi-Fi back on after this one, so the book stays pending with its entry on disk. Run on the tablet emulator:
#   tools\emulator\run-flows.ps1 -App dino -Instance tablet -Flow high-res-limited-then-wifi,high-res-swap-on-wifi
# Needs the book's high-res pack to be live in the store (uploaded by dino-store.yml after this slice merges).
# needs: cellular-only
# expect-log: HOOK skip-first-run ok
# expect-log: network=Limited highres=True size=StandardThenHigh
# expect-log: [HighRes] state 1ca50c6936cc44788b992726784e8132 pending v
appId: uk.sirous.dinoreader.dbg
name: A tablet on a limited connection takes the standard pack and waits for Wi-Fi
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books, the high-res upgrade list); fine here: the flow downloads one book fresh on the limited connection; the next flow depends on the pending entry this one writes and does not clear state.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: lion-and-mouse
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 180000
