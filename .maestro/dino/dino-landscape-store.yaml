# Slice 232 part D: the store held sideways lays its cards in two columns of slimmer cards (three on a tablet); rotating upright goes back to one column and the page stays open (the filter chips are still there).
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. The list loads from the store server; offline the page shows its calm offline state, and the column line is still written.
# The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The column line is written only when the columns change (run-flows matches whole tokens, so the row count is left out of the pattern).
# expect-log: [Landscape] store columns=2
# expect-log: [Landscape] store columns=1
appId: uk.sirous.dinoreader.dbg
name: Store in landscape has two columns of slim cards, rotating back keeps the page
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the store list, downloads nothing and needs no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends: dismiss it only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
# The store header (title and Done, top right) is there sideways.
- extendedWaitUntil:
    visible: Store
    timeout: 15000
- assertVisible:
    id: GrownUpDone
# Upright: the same page, one column again.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GrownUpDone
    timeout: 15000
- assertVisible: Store
# Done goes back to the corner.
- tapOn:
    id: GrownUpDone
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
