# Slice 274: leave the app from a grown-ups page (Reading speed, the page with the slider) and come back: the page is still alive and the Settings list still opens.
# The bug itself (iOS 16 KVO crash when a view with a Loaded/Unloaded subscription is discarded) shows only on iOS 17 and older; this emulator flow guards the same path on Android.
# The gate (hold, then a sum) is tapped through by hand: the enter-grown-up hook stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [GrownUps] closed on stop
appId: uk.sirous.dinoreader.dbg
name: Settings, Reading speed page survives home and back
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- tapOn:
    id: SettingsReadingSpeedRow
- extendedWaitUntil:
    visible: Slower is easier for little ones
    timeout: 10000
# Send the app home and bring it back (stopApp: false keeps the process).
- pressKey: home
- launchApp:
    stopApp: false
# The correct screen after coming back is the kids' shelf: App.xaml.cs OnStopped -> CloseGrownUpPagesAsync leaves grown-up mode and pops the grown-ups pages
# (GalleryDone, the grown-up bar's button, and GallerySettings are hidden in kids' mode). Not the Reading speed page, not a launcher or crash dialog.
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- assertNotVisible:
    id: GallerySettings
- assertNotVisible: Slower is easier for little ones
# A restarted process would also show the shelf, so the run's expect-log lines (checked by run-flows.ps1 after the flow) are what prove the SAME process lived through the stop:
# "[GrownUps] closed on stop" is written by OnStopped's pop of the grown-ups pages, after the Reading speed page was on screen. A crash or restart leaves it missing and the flow fails.
# And it still works: back into grown-up mode, Settings opens again and shows its list.
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GallerySettings
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 15000
