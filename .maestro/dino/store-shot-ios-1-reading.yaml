# Slice 291 item 5 (iOS part): App Store shot 1 of 5 of Dino Reader, "reading": page 6 of Three Little Pigs opens with the Wolf speaking, so a character's line is lit. Held upright, English, on the four test books (no live store, nothing downloaded or read aloud).
# Taken by .github/scripts/ios-sim-store-shots.sh (store-screenshots.yml) on an iPhone 6.9", an iPhone 6.5" and an iPad 13" simulator, one Maestro invocation per shot so a failed or hung shot is retried on its own (the script keeps shots already taken). Each of the five flows (store-shot-ios-1-reading ... store-shot-ios-5-shelf) stands alone: it starts from a relaunch, sets its own language and leaves nothing the next one needs.
# The same five screens, in the same order, as the Play phone shots (.maestro/dino/needs-file/store-shot-phone.yaml). The script swaps the appId line for the app's bundle id and renames store-dino-ios-<n>-<screen> to store-dino-<device>-<n>-<screen>. Run by name only: store-screenshots.ps1 and a normal run-flows.ps1 run skip store-shot-* flows.
# This is the first flow of a device: it starts the app on a fresh simulator install with skip-first-run, so the shelf has the four test books (then the full-shelf hook adds eight more above them). The others relaunch and keep the data.
# Mid-flow hooks go to the running app as openLink on the dino-test:// URL (iOS reads launch arguments only at a process start, see ios-read-back-reread-background.yaml); each openLink is followed by the guarded "Open in" tap. The full-shelf hook is the exception: it goes as a relaunch (see below).
# The simulator boots upright, so there is no setOrientation step (the Android flow's one guards a rotated emulator).
appId: uk.sirous.dinoreader.dbg
name: Store screenshot 1 of 5, reading, Dino Reader, iOS
---
- launchApp:
    # Slice 404: no clearState here. The simulator is a fresh install (ios-sim-store-shots.sh boots a new one per device) and the script has just copied the paid books' packages into the app's full-shelf folder, which a clearState would wipe. The microphone permission is granted by this launch's permissions, so no dialog covers the recording screen of shot 2.
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Three Little Pigs.*"
    timeout: 15000
# Slice 404: 12 books on the shelf (the four test books stay, eight more come from the live store and the packages it already stored; needs the network). The hook lands "Jack and the Beanstalk" last (FullShelfPlan.LastBookId; a test checks these flows wait for FullShelfPlan.LastBookTitle) and the newest import comes first on the shelf, so it showing means every other book landed first; a hook that finished before (the app's data kept it) ends at once; a flow cannot read the hook's log, so the wait below is on that title and 600 s (8 books one after another, each a package plus the audio packs, on a simulator link).
# The full-shelf hook goes as a relaunch with launch arguments, not an openLink: iOS answers a dino-test:// link with an "Open in" prompt that came after 3 s (run 44435066569) and after 10 s (run 44449072620), so the hook never ran
# and the prompt covered every later shot. A relaunch starts a new process, which reads its launch arguments again (TestHooks.iOS.cs), and shows no prompt. No clearState: the shelf data and the copied packages stay.
- launchApp:
    arguments:
      cmd: full-shelf
- extendedWaitUntil:
    visible: ".*Jack and the Beanstalk.*"
    timeout: 600000
# English, set explicitly (set-language rebuilds the root; voice=0 starts no voice pack). Wait for a string only the English shelf shows, not StoryTile.
- openLink: "dino-test://set-language?lang=en&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible: ".*(My stories|Stories|For grown-ups).*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
# Page 6 of Three Little Pigs opens with the Wolf speaking, so a character line is lit.
# iOS asks "Open in <app>?" for a custom-scheme link: Open is tapped only while that prompt's own text is on screen (never an app control labelled Open).
- openLink: "dino-test://open-book?id=three-little-pigs&page=6"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: store-dino-ios-1-reading
