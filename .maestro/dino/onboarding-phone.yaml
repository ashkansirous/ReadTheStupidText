# Slice 362, Slice 418 (onboarding mock "Dino Reader 2026-11-19 One Shelf with a Lock", frames NO1 to NO8): the whole first run on a phone held upright, one family language, from the language page to the locked shelf, five steps,
# no corner tour. Scripted only. The test store lists the Hot book (The Three Little Pigs) first and ticks it for the grown-up (Decision 3), so card 1 is the second pick and the demo page is Pigs page 13 (Pop scared, Pim calm; record Pim).
# Shots: shot-N1-language, shot-N2-languages, shot-N3-books, shot-N4a-listen, shot-N5-voice, shot-N6a-record, shot-N6b-recorded, shot-N7-thats-you, each beside the frame it names (NO1 to NO7; the contact-sheet manifest tools/emulator/screenshot-frames.json still lists the removed tour shots and the 2026-11-13 mock: a manifest update is owed); the log markers below prove the order
# (the Windows keys and the two-pane frames are tools/desktop-vm/checks/dino-onboarding.ps1). The microphone permission is granted at launch; the emulator's microphone gives silence or noise, which is enough for a file with a length.
# Against the old first run the "Step 1 of 5" bar never shows, so this flow fails on a build from before Slice 418; onboarding-skip.yaml is the Skip this step path.
# layout-check
# expect-log: HOOK test-store ok ok
# expect-log: [Redesign] onboarding page=language shape=stack
# expect-log: [Redesign] onboarding page=languages shape=stack
# expect-log: [FirstBooks] list listed=4 ticked=1
# expect-log: [FirstBooks] done listed=4 ticked=2 onShelf=1
# expect-log: [Onboarding] listen enter kind=Listen page=13
# expect-log: [Onboarding] listen page-ended continue=True
# expect-log: [Onboarding] voice record opened lines=1
# expect-log: [Record] finish
# expect-log: [Onboarding] listen enter kind=HearYourself page=13
# expect-log: [Onboarding] route voice done tried=True
appId: uk.sirous.dinoreader.dbg
name: First run on a phone, language to the locked shelf
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books, saved onboarding step), on purpose: the flow is the fresh install's first run, which starts with the language page and an empty shelf.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: test-store
      mode: ok
# N1: the step bar, the new heading and line, the phone's language ticked so Continue is live at once.
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 60000
- assertVisible: "Step 1 of 5 · Language"
- assertVisible: "Hello! Which language should Dino use?"
- assertVisible: "For the app’s buttons and words. You can change it later in Settings."
- takeScreenshot: shot-N1-language
- tapOn:
    text: "Continue"
    waitToSettleTimeoutMs: 300
# The Slice 183 "keep downloading when locked?" sheet shows on a fresh install on some devices; dismissed when it is there.
- tapOn:
    id: android:id/button2
    optional: true
    waitToSettleTimeoutMs: 300
# N2: the family's languages. The app language is ticked, grey and always on; Continue is live with nothing else ticked.
- extendedWaitUntil:
    visible:
      id: OnboardingLanguages
    timeout: 15000
- assertVisible: "Step 2 of 5 · Story languages"
- assertVisible: "Which languages does your family read in?"
- assertVisible: "Why more than one?"
- assertVisible: "App language · always on"
- takeScreenshot: shot-N2-languages
- tapOn:
    id: OnboardingLanguagesContinue
    waitToSettleTimeoutMs: 300
# N3: the picker; The Three Little Pigs is ticked at the start (one picked, so "Pick 1 more"), the button reads "Get these books".
- extendedWaitUntil:
    visible:
      id: FirstBooksPicker
    timeout: 30000
- assertVisible: "Step 3 of 5 · Books"
- assertVisible: "Pick 1 more"
- assertVisible: "Get these books"
- takeScreenshot: shot-N3-books
- tapOn:
    id: FirstBookCard-1
    waitToSettleTimeoutMs: 300
- tapOn:
    id: FirstBooksContinue
    waitToSettleTimeoutMs: 300
# NO4: Dino reads the demo page by itself, once, in Dino's language: no language bar and no bubble, and Continue wakes when the page ends.
- extendedWaitUntil:
    visible:
      id: OnboardingListen
    timeout: 60000
- assertNotVisible:
    id: OnboardingBubble
- assertVisible: "Step 4 of 5 · Listen"
- assertVisible: "Listen to Dino read"
- assertVisible: "Every character has its own voice, and Dino reads with feeling."
- takeScreenshot: shot-N4a-listen
- repeat:
    times: 45
    while:
      notVisible:
        id: OnboardingVoice
    commands:
      - tapOn:
          id: OnboardingContinue
          optional: true
          waitToSettleTimeoutMs: 1500
# N5: be the voice of a character; the privacy card, the microphone note, and the button naming the character.
- extendedWaitUntil:
    visible:
      id: OnboardingVoice
    timeout: 15000
- assertVisible: "Step 5 of 5 · Your voice"
- assertVisible: "Be the voice of a character"
- assertVisible: "Your voice stays on this phone"
- assertVisible: "Dino will ask for the microphone."
- assertVisible: "Record Pim’s lines"
- assertVisible: "Skip this step"
- takeScreenshot: shot-N5-voice
- tapOn:
    id: OnboardingRecord
    waitToSettleTimeoutMs: 300
# NO6: Pim's lines on that page only, no Done; the same "Skip this step" link at the bottom (the per-line Skip of the ordinary record page is still absent).
- extendedWaitUntil:
    visible:
      id: RecordButton
    timeout: 30000
- assertVisible: "Pim’s lines"
- assertVisible: ".*Line 1 of .*"
- assertVisible: "Skip this step"
- assertNotVisible:
    id: RecordSkip
- assertNotVisible:
    id: GrownUpDone
- takeScreenshot: shot-N6a-record
# Every line: Record, a second and a half of microphone, Stop, Next (Finish on the last), until the page shows "That's you".
- repeat:
    times: 4
    while:
      notVisible:
        id: OnboardingHearYourself
    commands:
      - tapOn:
          id: RecordButton
          optional: true
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          visible:
            id: RecordStopButton
          timeout: 8000
          optional: true
      - extendedWaitUntil:
          visible:
            id: RecordNeverShown
          timeout: 1500
          optional: true
      - tapOn:
          id: RecordStopButton
          optional: true
          waitToSettleTimeoutMs: 300
      - extendedWaitUntil:
          visible:
            id: RecordChip
          timeout: 15000
          optional: true
      - takeScreenshot: shot-N6b-recorded
      - tapOn:
          id: RecordNext
          optional: true
          waitToSettleTimeoutMs: 600
# NO7: "That's you!", the coral chip, Play again and Start reading; Start reading deletes the try and ends setup.
- extendedWaitUntil:
    visible:
      id: OnboardingHearYourself
    timeout: 30000
- assertVisible: "That’s you!"
- assertVisible: "Play again"
- assertVisible: "Start reading"
- takeScreenshot: shot-N7-thats-you
- tapOn:
    id: OnboardingPlayAgain
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: OnboardingContinue
    waitToSettleTimeoutMs: 500
# NO8: straight on the locked shelf, with no card and no tour: the lock, no chip, no "..." on the covers.
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 30000
- assertVisible:
    id: GalleryLock
- assertNotVisible:
    id: LockChip
- assertNotVisible:
    id: TileMore
# Later launches open on the shelf, with no onboarding.
- launchApp:
    # launchApp-restart: the saved onboarding step is read at start-up, so only a fresh start proves a later launch opens on the shelf.
    stopApp: true
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- assertNotVisible:
    id: FirstRunLanguage
