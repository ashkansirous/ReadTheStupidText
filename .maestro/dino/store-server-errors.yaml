# Slice 357: a refused Get in the Store tab says why, under the book's row, in the app's language. The Debug test store (mode status402|status404|status429|status503) refuses every book download with that
# HTTP status and no body, as the Worker does; the pretend store (fake-purchases) makes one test book owned but not on the shelf, so its row shows the Get pill.
# 429 shows "Too many tries", 503 the general "Something went wrong on the server" (402 and 404 are in store-payment-required.yaml: a 404 leaves the row with no button, so nothing can follow it). After the test
# store answers again, Try again puts the book on the shelf and the strip is gone. Slice 364: the strip sits inside the book's card, with the tinted Try again button at the end of the row.
# Against the old behaviour (a failed row showed only "Try again") every text assert below fails.
# Android and iOS alike (the hooks go through the shared dispatcher). The gate is not tapped: the enter-grown-up hook stands in for it.
# expect-log: HOOK test-store ok status429
# expect-log: HOOK fake-purchases ok on paid=1 owned=1
# expect-log: HOOK skip-first-run ok
# expect-log: [StoreError] row kind=TooManyRequests
# expect-log: [StoreError] row kind=ServerError
appId: uk.sirous.dinoreader.dbg
name: A refused Get shows the status's own text under the row
onFlowComplete:
  - launchApp:
      stopApp: false
      arguments:
        cmd: fake-purchases
        mode: "off"
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded packs, own books); fine here: the flow uses the Debug test store and the pretend store only, and needs a fresh install so the owned book is not on the shelf.
    clearState: true
    arguments:
      cmd: test-store
      mode: ok
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 60000
# One test book is sold and owned: skip-first-run leaves it off the shelf, so its Store row offers Get.
- launchApp:
    stopApp: false
    arguments:
      cmd: fake-purchases
      mode: "on"
      paid: "gingerbread-man"
      owned: "gingerbread-man"
      price: "$0.99"
      buy: ok
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: test-store
      mode: status429
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      tab: store
- extendedWaitUntil:
    visible:
      id: GalleryStoreSub
    timeout: 30000
- extendedWaitUntil:
    visible: "Get"
    timeout: 30000
# 429: the strip says so inside the card and the row offers Try again.
- tapOn:
    text: "Get"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Too many tries.*"
    timeout: 30000
# 503 (and every 5xx): the general line.
- launchApp:
    stopApp: false
    arguments:
      cmd: test-store
      mode: status503
- tapOn:
    text: "Try again"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Something went wrong on the server.*"
    timeout: 30000
# The test store answers again: Try again downloads the book and the line is gone.
- launchApp:
    stopApp: false
    arguments:
      cmd: test-store
      mode: ok
- tapOn:
    text: "Try again"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "On the shelf"
    timeout: 60000
- assertNotVisible: "Something went wrong on the server.*"
