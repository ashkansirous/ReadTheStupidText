# Slice 229: every grown-up page has one Done button, top right. On Settings it goes back to grown-up mode; on a sub-page (Reading speed) it goes up one level to Settings, never further.
# The gate (hold, then a sum) is tapped through by hand: the enter-grown-up hook stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader
name: Settings, Done goes up one level
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow needs only the starter shelf and the Settings list, no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends: dismiss it only when it is on screen.
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# Done is on the Settings page itself (not the corner's own Done: that one is "GalleryDone").
- assertVisible:
    id: GrownUpDoneSettingsPage
- tapOn:
    id: SettingsReadingSpeedRow
- extendedWaitUntil:
    visible: Slower is easier for little ones
    timeout: 10000
# On the sub-page Done goes up one level: Settings, not the corner.
- tapOn:
    id: GrownUpDoneReadingSpeedPage
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
# On Settings, Done goes back to the grown-ups' corner.
- tapOn:
    id: GrownUpDoneSettingsPage
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
