# Slice 433 item 6 (review pass 2, findings 3 and 6): the SETUP of preview clip 2-record, "record" (the note's video timeline, 6-10 s: the recording screen). NOT recorded (see store-shot-ios-videoprep-1a-reading.yaml). Ends in grown-up mode with Three Little Pigs on screen.
appId: uk.sirous.dinoreader.dbg
name: Store preview clip setup, 2 record, Dino Reader, iOS
---
- launchApp:
    permissions:
      all: allow
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Jack and the Beanstalk.*"
    timeout: 30000
- openLink: "dino-test://set-language?lang=en&voice=0"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible: ".*(My stories|Stories|For grown-ups).*"
    timeout: 60000
- openLink: "dino-test://enter-grown-up"
- extendedWaitUntil:
    visible: ".*Open in.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: ".*Open in.*"
    commands:
      - tapOn:
          text: Open
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Three Little Pigs.*"
    timeout: 30000
