# Slice 375 C: a tablet (RTST_Tablet, 800 x 1280 dp, Wi-Fi) takes the high-res pack of a book that has one. open-book downloads lion-and-mouse from the live store through the store client's own
# download and the Debug-only [HighRes] marker names the decision and the pack fetched. Run with: tools\emulator\run-flows.ps1 -App dino -Instance tablet -Flow high-res-choice-tablet
# Needs the book's high-res pack to be live in the store (uploaded by dino-store.yml after this slice merges).
# expect-log: HOOK skip-first-run ok
# expect-log: device=Tablet
# expect-log: network=Unmetered highres=True size=High
appId: uk.sirous.dinoreader.dbg
name: A tablet on Wi-Fi takes the high-res pack
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books, the high-res upgrade list); fine here: the flow downloads one book fresh so the choice is made.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: lion-and-mouse
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 180000
