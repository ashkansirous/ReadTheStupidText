# Slice 197 SMOKE CHECK (it cannot fail before the fix: the drop window is microseconds wide; the concurrent unit test in StorytellerConsentTests is the proof): a tap during the Wi-Fi card starts the download. A "Download now" tap that lands as the mobile-data check ends must not be dropped: the download starts anyway.
# needs: cellular-only
# The card is shown (WaitingForWifi) while the run still holds the guard; the tap with no settle wait lands in that window, before the run releases it (the old drop window). The download-started marker proves the tap was not dropped.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: HOOK download-now consent recorded
# expect-log: HOOK storyteller download started
appId: uk.sirous.dinoreader
name: Download now right after the mobile-data check
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow starts the storyteller download itself, so it needs the pack missing, and uses no own book.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      text: "Download now"
    timeout: 60000
- tapOn:
    text: "Download now"
    waitToSettleTimeoutMs: 0
# The download must start: the Wi-Fi card goes away (Downloading, or finished and the ready note).
- extendedWaitUntil:
    notVisible:
      text: "Download now"
    timeout: 20000
