# Slice 352: a read says where it started, the screen and the taps are counted, and leaving the app counts and flushes. Scripted only: nothing is sent, the harness off switch stays on.
# The Debug build writes `[Usage] <name> <detail> session=<id>` for each count asked for (read_started and book_opened carry the origin as their detail), `[Usage] seq=<n> <name> ... screen=<screen> detail=<detail>`
# for each count that reached the queue, and `[Usage] flush on window stopped` when the window stops (App.xaml.cs FlushUsage, just after app_backgrounded is queued).
# The run: open a book (the test hook opens it the way a shelf tap does: origin shelf), press Play and Back on the reading page, then send the app to the background.
# Against a build without this slice none of these lines exist: no origin on read_started, no `screen`/`tap` counts, no app_backgrounded, no flush line.
# expect-log: HOOK skip-first-run ok
# expect-log: [Usage] book_opened shelf
# expect-log: [Usage] read_started shelf
# expect-log: detail=reading:shown
# expect-log: detail=reading:play
# expect-log: detail=reading:back
# expect-log: detail=shelf:shown
# expect-log: app_backgrounded
# expect-log: [Usage] flush on window stopped
# Not yet verified on a device: `app_resumed` and the Windows window close (the flush line `flush on window destroying`) need the iOS simulator and the Windows VM.
appId: uk.sirous.dinoreader.dbg
name: A read carries its origin, taps are counted, leaving the app flushes the queue (Dino)
---
- launchApp:
    # clearState: wipes the app's data; fine here: the flow needs no pack or own book, and it must not depend on what the flow before it left (a half-done first run).
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: three-little-pigs
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
- extendedWaitUntil:
    visible: Play
    timeout: 10000
- tapOn: Play
- extendedWaitUntil:
    visible: Pause
    timeout: 90000
- tapOn:
    id: ReadingBack
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryTitle
    timeout: 15000
# The app goes to the background: Window.Stopped queues app_backgrounded (with the screen) and flushes.
- pressKey: home
