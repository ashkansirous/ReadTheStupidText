# Slice 264: a grown-up reorders the shelf. The "Reorder" row of a book's sheet opens the reorder mode (Done and Cancel at the top); Cancel leaves the order as it was; Done keeps it, and it survives a restart.
# The drag itself is not scripted: the system drag starts on a long press, which a Maestro swipe cannot make. The shelf-reorder-move hook drops the 4th book before the 2nd through the same order code a drop uses.
# The four starter books are in a fixed order (three-little-pigs is 2nd, tortoise-and-hare 4th), so the 2nd title tells the order: before the move it is the pigs, after Done and after a restart the tortoise.
# Slice 382: the plain-swipe drag is scripted below (a touch drag, no hold, on Android and iOS); the Windows mouse drag is the VM check's. The covers on the first open after the clearState install log "[Cover] shown <id> in N ms" (sharp straight away, N small).
# The 1 second press on a cover (TileOverlay's PointerGestureRecognizer) is Not yet verified on a device.
# expect-log: HOOK skip-first-run ok
# expect-log: [Cover] shown
# expect-log: [Reorder] drag start
# expect-log: [Reorder] drag wiggle
# expect-log: running=True
# expect-log: [Reorder] drag end drop
# expect-log: [Reorder] tap lift
# expect-log: HOOK shelf-order-reset ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [Reorder] opened with 4 books,
# expect-log: HOOK shelf-reorder-move moved
# expect-log: [Reorder] closed: cancel
# expect-log: [Reorder] done saved 4 books:
# expect-log: [Reorder] closed: done
appId: uk.sirous.dinoreader.dbg
name: Reorder the shelf, Cancel keeps it, Done saves it across a restart
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books, a stored shelf order); fine here: the flow uses the four starter books only and opens no pack, so it needs none of it.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
# Start from the default order whatever an earlier run saved: delete the stored order, then restart the app so the shelf is read again.
- launchApp:
    stopApp: false
    arguments:
      cmd: shelf-order-reset
- launchApp:
    # launchApp-restart: reads the shelf again, now without a stored order.
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 60000
# The tile titles are not text nodes on Android: a book is named only by the content description of its options button ("Options for <title>"), so the order is read from TileMore, in shelf order.
# Before: the 2nd book is the pigs.
- copyTextFrom:
    id: TileMore
    index: 1
- assertTrue: ${maestro.copiedText.toLowerCase().includes('pig')}
# Reorder from the sheet, move the 4th book before the 2nd, then Cancel: the shelf is as it was.
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReorder
    timeout: 10000
- tapOn:
    id: BookSheetReorder
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
- assertVisible:
    id: ReorderCancel
- assertVisible:
    id: ReorderHint
# Slice 382: a plain swipe on a cover drags it at once in edit mode, no hold; the held book keeps wiggling (the "drag wiggle ... running=True" line). Maestro's swipe is a real touch drag, so this is the scripted check of the
# touch drag itself: before the slice a swipe only scrolled or did nothing, because the system drag needed a long press. The swipe is slow (1.2 s) so the cover is under the finger for the whole move.
- swipe:
    from:
      id: ReorderCover
      index: 3
    direction: UP
    duration: 1200
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
# Where the drag drops depends on the screen, so Cancel and reopen the reorder mode: the shelf is back in its original order for the steps below.
- tapOn:
    id: ReorderCancel
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 10000
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReorder
    timeout: 10000
- tapOn:
    id: BookSheetReorder
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
# Review finding 1: the touch pan must not eat a plain tap, which lifts a cover (the "tap lift" line).
- tapOn:
    id: ReorderCover
    index: 2
    waitToSettleTimeoutMs: 300
- launchApp:
    stopApp: false
    arguments:
      cmd: shelf-reorder-move
      from: "4"
      to: "2"
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
- tapOn:
    id: ReorderCancel
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 10000
- assertNotVisible:
    id: ReorderDone
- copyTextFrom:
    id: TileMore
    index: 1
- assertTrue: ${maestro.copiedText.toLowerCase().includes('pig')}
# Again, this time Done: the tortoise is now 2nd.
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetReorder
    timeout: 10000
- tapOn:
    id: BookSheetReorder
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
- launchApp:
    stopApp: false
    arguments:
      cmd: shelf-reorder-move
      from: "4"
      to: "2"
- extendedWaitUntil:
    visible:
      id: ReorderDone
    timeout: 10000
- tapOn:
    id: ReorderDone
    waitToSettleTimeoutMs: 500
# Done lands in the grown-ups' corner, not on the kids' shelf.
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 15000
- assertNotVisible:
    id: ReorderDone
- copyTextFrom:
    id: TileMore
    index: 1
- assertTrue: ${maestro.copiedText.toLowerCase().includes('tortoise')}
# Restart: the order was stored, not just shown.
- launchApp:
    # launchApp-restart: the flow proves the saved shelf order survives a restart of the app.
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 60000
- copyTextFrom:
    id: TileMore
    index: 1
- assertTrue: ${maestro.copiedText.toLowerCase().includes('tortoise')}
