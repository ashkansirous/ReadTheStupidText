# Slice 325 part D (onboarding mock frames OT1 / OTL1, replacing Slice 234 part B's frame 138 card): on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) the first-run language page is two panes
# (the welcome in a 320 dp pane, the languages in two wide columns on the right, Continue at its foot); sideways it is the same two panes with a 460 dp left pane; rotating back keeps the pick.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. Nothing is downloaded: the flow never taps Continue.
# The layout line is written only when the shape changes (and at each pick): upright, sideways with the pick kept, upright again with the pick kept. A phone upright logs split=False, so this fails there.
# expect-log: [Landscape] firstrun split=True columns=2 page=language selected=en
# expect-log: [Landscape] firstrun split=True columns=2 page=language selected=de
appId: uk.sirous.dinoreader.dbg
name: First run on a tablet held upright is a centred card with two language columns
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books), on purpose: the flow needs the fresh install's first-run language page.
    clearState: true
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
# All the languages are on screen at once (no scroll): the first, a middle one and the last of the list.
- assertVisible: English
- assertVisible: Deutsch
- assertVisible:
    id: FirstRunLanguage-fa
- assertVisible: Continue
- tapOn:
    text: "Deutsch"
    waitToSettleTimeoutMs: 300
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: Hello! Which language do we read in?
    timeout: 15000
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 15000
- assertVisible: Deutsch
- assertVisible: Continue
- assertNotVisible:
    id: FirstRunReady
