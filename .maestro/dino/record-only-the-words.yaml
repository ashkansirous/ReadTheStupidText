# Slice 395 + 443: recording a character shows and replaces only that character's words, not the narration around them, and the book reads the parent's take in place of only those words.
# Three Little Pigs is one of the four Debug test books the offline test store puts on the shelf (the import-test-book hook has no Freddy book): tick Pip only (untick the Storyteller, Pop, Pim and Wolf), record the three lines (line 1 is on page 2, line 2 on page 5, line 3 on page 16), press Done, then check the clips the library holds.
# Line 1 is Pip's "Yay! Now I can play all day!" with no narration on the card; line 2 is "No, no, no! Not by the hair of my chinny chin chin!" and "said Pip." is not on any card.
# The record-state hook lists the clips: the first is a part clip of page 2 (file rec-en-2-p1-1-*.m4a, part 0 of the page, the narration "said Pip. ..." is part 1).
# Then the book is read back from page 2 (open-book page=2 play=1): the narration has no pre-made audio here (no audio pack is installed) so it is shown for a beat, and the take of page 2 plays its own file:
# the log has a "[RecordedClip] playing part take" line for it, counted from 0 on the page: parts=0-0 (page 2).
# The microphone permission is granted at launch. The emulator's microphone gives silence or noise, which is enough for a file with a length.
# To see it fail against the old behaviour: before this slice the card held the whole sentence, so the assertNotVisible below fails, and no clip file name carries "-p".
# expect-log: HOOK test-store ok offline
# expect-log: [Record] saved
# expect-log: HOOK record-state ok clips=3 files=3
# expect-log: [RecordedClip] playing part take
# expect-log: parts=0-0 reading=en
appId: uk.sirous.dinoreader.dbg
name: Record only the character's words and read the book back
---
- launchApp:
    # clearState: wipes the app's data (settings, side languages, installed audio packs, own books); fine here: skip-first-run puts the test books back and no audio pack may be installed, so every part without a take has no clip.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: test-store
      mode: offline
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- tapOn:
    id: TileMore
    text: ".*Three Little Pigs.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: "Record your voice"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroStart
    timeout: 20000
# Only Pip is ticked: the Storyteller, Pop, Pim and Wolf are unticked.
- tapOn:
    text: "Storyteller"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Pop"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Pim"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Wolf"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: RecordIntroStart
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordButton
    timeout: 20000
# Line 1: only Pip's words, never the narration of the same sentence.
- assertVisible: ".*Yay! Now I can play all day!.*"
- assertNotVisible: ".*Pip was in a big hurry.*"
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordNext
    waitToSettleTimeoutMs: 300
# Line 2: Pip's words on page 5; "said Pip." belongs to the narrator and is on no card.
- extendedWaitUntil:
    visible: ".*Not by the hair of my chinny chin chin.*"
    timeout: 15000
- assertNotVisible: ".*said Pip.*"
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordNext
    waitToSettleTimeoutMs: 300
# Line 3: Pip's words on page 16.
- extendedWaitUntil:
    visible: ".*I'm sorry I was in such a hurry.*"
    timeout: 15000
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordDone
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroProgress
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: BookSheetClose
    timeout: 20000
- tapOn:
    id: BookSheetClose
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 20000
- launchApp:
    stopApp: false
    arguments:
      cmd: record-state
      id: three-little-pigs
      clips: "3"
- tapOn:
    id: GalleryLock
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryLock
    timeout: 20000
# Read the book back from page 2 (the open-book hook refuses while grown-up mode is on; Done above left it): the narration is shown for a beat, then each take plays its own file.
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: three-little-pigs
      page: "2"
      play: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
# Nothing with this id ever shows: the wait only gives the read time to reach the take on page 2 (a beat for the narration around it).
- extendedWaitUntil:
    visible:
      id: RecordNeverShown
    timeout: 30000
    optional: true
- assertVisible:
    id: ReadingSurface
