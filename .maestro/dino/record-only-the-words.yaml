# Slice 395: recording a character shows and replaces only that character's words, not the narration around them.
# Import Freddy and the Slipper, tick Mummy and Tummy only (untick the Storyteller and Freddy), record the first three lines, press Done, then read the book from the start.
# Line 1 is Mummy's "Dinner, my dear! ..." with no "One evening his Mummy called," on the card; line 2 is "Just one little spoonful," and "said Mummy." is not on any card.
# The record-state hook lists the clips: the first is a part clip of page 2 (file rec-en-2-p2-2-*.m4a, the narration before it is part 1). Reading back plays Mummy's take for that part only:
# the "[RecordedClip] playing part take" line is written for each take and the narration between them is read by the book's own audio (shown for a beat here: the test store is offline, no pack).
# The microphone permission is granted at launch. The emulator's microphone gives silence or noise, which is enough for a file with a length.
# To see it fail against the old behaviour: before this slice the card held the whole sentence ("One evening his Mummy called, ..."), so the assertNotVisible below fails, and no clip file name carries "-p".
# expect-log: HOOK test-store ok offline
# expect-log: HOOK import-test-book ok freddy-and-the-slipper
# expect-log: [Record] saved
# expect-log: [RecordState] clip rec-en-2-p2-2-
# expect-log: HOOK record-state ok clips=3
# expect-log: [RecordedClip] playing part take
appId: uk.sirous.dinoreader.dbg
name: Record only the character's words and read the book back
---
- launchApp:
    # clearState: wipes the app's data (settings, side languages, installed audio packs, own books); fine here: the flow imports the one test book and no audio pack may be installed, so every part without a take has no clip.
    clearState: true
    permissions:
      all: allow
    arguments:
      cmd: test-store
      mode: offline
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: import-test-book
      id: freddy-and-the-slipper
- extendedWaitUntil:
    visible: ".*Freddy.*"
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    text: ".*Freddy.*"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: "Record your voice"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroStart
    timeout: 20000
# Only Mummy and Tummy are ticked: the Storyteller and Freddy are unticked.
- tapOn:
    text: "Storyteller"
    waitToSettleTimeoutMs: 300
- tapOn:
    text: "Freddy"
    waitToSettleTimeoutMs: 300
- tapOn:
    id: RecordIntroStart
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordButton
    timeout: 20000
# Line 1: only Mummy's words, never the narration of the same sentence.
- assertVisible: ".*Dinner, my dear.*Come and sit over here!.*"
- assertNotVisible: ".*One evening his Mummy called.*"
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordNext
    waitToSettleTimeoutMs: 300
# Line 2: Mummy's first words on page 3; "said Mummy." belongs to the narrator and is on no card.
- extendedWaitUntil:
    visible: ".*Just one little spoonful.*"
    timeout: 15000
- assertNotVisible: ".*said Mummy.*"
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordNext
    waitToSettleTimeoutMs: 300
# Line 3: Mummy's second part of the same sentence.
- extendedWaitUntil:
    visible: ".*It's yummy!.*chicken and peas!.*"
    timeout: 15000
- tapOn:
    id: RecordButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordStopButton
    timeout: 15000
- tapOn:
    id: RecordStopButton
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordChip
    timeout: 20000
- tapOn:
    id: RecordDone
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroProgress
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: BookSheetClose
    timeout: 20000
- tapOn:
    id: BookSheetClose
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 20000
- launchApp:
    stopApp: false
    arguments:
      cmd: record-state
      id: freddy-and-the-slipper
      clips: "3"
- tapOn:
    id: GalleryDone
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryGrownUps
    timeout: 20000
# Read the book from the start: the first take plays at "Dinner, my dear!", after the narration "One evening his Mummy called," (shown for a beat).
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: freddy-and-the-slipper
      play: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: RecordNeverShown
    timeout: 40000
    optional: true
- assertVisible:
    id: ReadingSurface
