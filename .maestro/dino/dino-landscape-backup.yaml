# Slice 232 part D: Backup held sideways puts the save and restore cards side by side; rotating upright stacks them and the page stays open. Uses Maestro's setOrientation;
# tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The line is written only when the arrangement changes: side by side sideways, stacked upright.
# expect-log: [Landscape] backup sideBySide=True
# expect-log: [Landscape] backup sideBySide=False
appId: uk.sirous.dinoreader.dbg
name: Backup in landscape has its two cards side by side, rotating back keeps the page
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the Backup page and saves or restores nothing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# Backup is not shown in the right pane: it pushes as its own page in both orientations.
# Sideways, the Settings list pane shows only the first rows, so scroll Backup into view first.
# scrollUntilVisible swipes at the screen centre, which is the right pane here, so swipe inside the left list column (about 15% across) instead.
- repeat:
    times: 6
    while:
      notVisible: "Backup"
    commands:
      - swipe:
          start: 15%, 80%
          end: 15%, 30%
- tapOn:
    text: "Backup"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Save a backup
    timeout: 10000
- assertVisible: Restore from a backup
# Upright: the same page, the cards stacked.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Save a backup
    timeout: 15000
- assertVisible: Restore from a backup
# Done on Backup goes up one level to Settings (Slice 229).
- tapOn:
    id: GrownUpDone
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
