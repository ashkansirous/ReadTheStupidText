# Slice 232 part D (hosted in the Settings tab since Slice 325 part B): Backup held sideways puts the save and restore cards side by side; rotating upright stacks them and the page stays open. Uses Maestro's setOrientation;
# tools/emulator/rotate.ps1 is the adb fallback if a device ignores it. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The line is written only when the arrangement changes: side by side sideways, stacked upright.
# expect-log: [Landscape] backup sideBySide=True
# expect-log: [Landscape] backup sideBySide=False
appId: uk.sirous.dinoreader.dbg
name: Backup in landscape has its two cards side by side, rotating back keeps the page
# Runs after the flow pass or fail, so a failure never leaves the next flow sideways.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the Backup page and saves or restores nothing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- setOrientation: LANDSCAPE_LEFT
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
# Slice 325 part B: Backup opens inside the Settings tab (like every Settings page) with the back arrow, the rail staying. Sideways the list shows only the first rows, so scroll Backup into view first
# (the list is the content column right of the rail, about 60% across).
- repeat:
    times: 6
    while:
      notVisible: "Backup"
    commands:
      - swipe:
          start: 60%, 80%
          end: 60%, 30%
- tapOn:
    text: "Backup"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Save a backup
    timeout: 10000
- assertVisible: Restore from a backup
# Upright: the same page, the cards stacked.
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: Save a backup
    timeout: 15000
- assertVisible: Restore from a backup
# The back arrow on Backup goes up one level to the Settings list (Slice 229; there is no Done in the corner since Slice 325).
- assertNotVisible:
    id: GrownUpDone
- tapOn:
    id: GrownUpBack
- extendedWaitUntil:
    visible:
      id: SettingsReadingSpeedRow
    timeout: 10000
