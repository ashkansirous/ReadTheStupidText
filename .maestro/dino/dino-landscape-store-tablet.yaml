# Slice 234 part C, rewritten by Slice 325 part B (grown-up mock frame T2): the Store tab on a tablet (run on RTST_Tablet, 800 x 1280 dp). Upright the content beside the 260 dp rail is 540 dp wide, one column of cards; held sideways it is
# 990 dp (1280 less the 290 dp rail), two columns (decision 4: two columns from 800 dp of content). The cards are frame T2's: a 76 dp cover, the title, the credits, the length, and "On the shelf" or the Get pill at the end.
# The tablet twin of dino-landscape-store (phone). The list loads from the store server; offline the tab shows its calm offline state, and the column lines are still written.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# Against the old tablet-upright store ("[TabletUpright] store ... actionBelow=") the lines below never appear, so this flow fails on a build from before this part.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: [Redesign] store columns=1
# expect-log: [Redesign] store columns=2
appId: uk.sirous.dinoreader.dbg
name: Store on a tablet is one column upright and two columns sideways
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the store list, downloads nothing and needs no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: GalleryStoreSub
    timeout: 15000
- assertNotVisible:
    id: GrownUpBack
- assertNotVisible:
    id: GrownUpDone
# Sideways on a tablet is two columns, and the tab stays open; back upright is one column again with the tab still open.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: GalleryStoreSub
    timeout: 15000
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GalleryStoreSub
    timeout: 15000
- assertVisible:
    id: GalleryDone
