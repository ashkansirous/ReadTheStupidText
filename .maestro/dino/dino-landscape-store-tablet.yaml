# Slice 234 part C (mock Batch 45 frame 143): the store on a tablet held upright (run on RTST_Tablet, 800 x 1280 dp) lays its cards in two columns with 90 dp covers and the action as a full-width button under each card.
# The tablet twin of dino-landscape-store, which expects the phone's columns: that flow is phone-only, this one is tablet-only (a phone never logs [TabletUpright]). The list loads from the store server; offline the page shows its calm offline state, and the line is still written.
# Uses Maestro's setOrientation; tools/emulator/rotate.ps1 is the adb fallback. The gate is not tapped: the enter-grown-up hook stands in for a passed gate (grown-ups-button.yaml covers the gate chain).
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# The line is written when the card shape changes: upright (two columns, action below, 90 dp cover), then sideways on a tablet (three columns, not "actionBelow"), then upright again.
# expect-log: [TabletUpright] store columns=2 actionBelow=True cover=90
# expect-log: [Landscape] store columns=3
appId: uk.sirous.dinoreader.dbg
name: Store on a tablet held upright has two columns with the action under each card
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow only opens the store list, downloads nothing and needs no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- runFlow:
    when:
      visible: Storyteller voices are ready
    commands:
      - tapOn: "OK"
- tapOn:
    id: GalleryStore
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: Store
    timeout: 15000
- assertVisible:
    id: GrownUpDone
# Sideways on a tablet is three columns (Slice 232), and back upright is the two-column page again with the page still open.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: GrownUpDone
    timeout: 15000
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: GrownUpDone
    timeout: 15000
- assertVisible: Store
- tapOn:
    id: GrownUpDone
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
