# Slice 383 (replaces Slice 322's rule for a lock): a locked or dark screen does NOT pause the silent beat; a book that is playing keeps reading with the screen off. Locking raises Window.Stopped (Android onStop, iOS
# DidEnterBackground), not Page.OnDisappearing; ReadingPage logs "window stopped" and the beat's timer is not touched, so the pieces keep being shown while asleep; the session then writes "silent piece shown while the window is stopped" for a piece shown between a stop and the next resume.
# Only the page itself being covered (the grown-up gate, a sheet) pauses a beat.
# Same setup as silent-piece-beat (store offline, so no piece has a clip). Needs the emulator's screen lock set to None or Swipe.
# `# needs: screen-cycle` makes run-flows.ps1 send KEYCODE_SLEEP for 4 s every 12 s while the flow runs, then KEYCODE_WAKEUP and wm dismiss-keyguard (tools/emulator/dialog-guard.ps1, Get-ScreenCycleCommands).
# needs: screen-cycle
# To see it fail against the old behaviour: before Slice 383 a lock stopped the beat's timer, so the next piece could only be shown after the unlock and the line "silent piece shown while the window is stopped" could never be written (on origin/main it does not exist, and its condition cannot happen).
# expect-log: HOOK test-store ok offline
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK read start
# expect-log: [AudioPack] silent piece shown (sentence 0)
# expect-log: [AudioPack] window stopped (lock, screen off, Home or another app)
# expect-log: [AudioPack] silent piece shown while the window is stopped
appId: uk.sirous.dinoreader.dbg
name: The silent beat goes on while the screen is locked
---
- launchApp:
    # clearState: wipes the app's data (settings, side languages, installed audio packs, a stored shelf order); fine here: skip-first-run puts the four test books back and no audio pack may be installed beforehand, so that every piece has no clip.
    clearState: true
    arguments:
      cmd: test-store
      mode: offline
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: three-little-pigs
      play: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
# A beat counts as Playing, so the control offers Pause while it runs.
- extendedWaitUntil:
    visible: Pause
    timeout: 30000
# A real wait of 45 s (nothing with this id ever shows; optional lets the flow go on): the harness sleeps and wakes the screen about three times in it; the read keeps going through every sleep.
- extendedWaitUntil:
    visible:
      id: SilentBeatNeverShown
    timeout: 45000
    optional: true
# Back in front after the last wake (stopApp: false keeps the process).
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 20000
# The read went on through the locks (a pause here would mean the old behaviour stopped it).
- assertVisible:
    id: ReadingSurface
- extendedWaitUntil:
    visible: Pause
    timeout: 10000
