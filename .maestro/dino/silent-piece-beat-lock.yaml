# Slice 322: the silent beat follows the screen lock like the read's audio does. Locking the screen raises Window.Stopped (Android onStop, iOS DidEnterBackground), not Page.OnDisappearing, so
# ReadingPage recombines "page shown" and "window in front" and tells the session (SetBeatHidden): the beat's timer stops and no further "silent piece shown" line is written while the screen is locked; on unlock the whole beat starts again
# and the read goes on. The flow cannot assert an absent line, so it proves the path by the two lines the pause and the resume write, in that order, plus a piece shown after the unlock.
# Same setup as silent-piece-beat (store offline, so no piece has a clip). Needs the emulator's screen lock set to None or Swipe.
# Maestro's `pressKey: lock` never turned the emulator's screen off (330 dumpsys power samples all Awake, no onStop), so the sleep and wake come from the harness: `# needs: screen-cycle` makes run-flows.ps1
# send KEYCODE_SLEEP for 4 s every 12 s while the flow runs, then KEYCODE_WAKEUP and wm dismiss-keyguard (tools/emulator/dialog-guard.ps1, Get-ScreenCycleCommands). The flow only waits and checks the read goes on.
# needs: screen-cycle
# To see it fail against the old behaviour: before Slice 322 a lock wrote no "silent piece paused, the window is not in front" line and the beat kept going.
# expect-log: HOOK test-store ok offline
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK read start
# expect-log: [AudioPack] silent piece shown (sentence 0)
# expect-log: [AudioPack] silent piece paused, the window is not in front
# expect-log: [AudioPack] silent piece resumed, the page is shown and its window is in front
appId: uk.sirous.dinoreader.dbg
name: The silent beat pauses when the screen locks and goes on when it is back
---
- launchApp:
    # clearState: wipes the app's data (settings, side languages, installed audio packs, a stored shelf order); fine here: skip-first-run puts the four test books back and no audio pack may be installed beforehand, so that every piece has no clip.
    clearState: true
    arguments:
      cmd: test-store
      mode: offline
- extendedWaitUntil:
    visible:
      id: FirstRunLanguage
    timeout: 25000
- launchApp:
    stopApp: false
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: open-book
      id: three-little-pigs
      play: "1"
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 30000
# A beat counts as Playing, so the control offers Pause while it runs.
- extendedWaitUntil:
    visible: Pause
    timeout: 30000
# A real wait of 45 s (nothing with this id ever shows; optional lets the flow go on): the harness sleeps and wakes the screen about three times in it. Several cycles, because one sleep can land between two
# 1.2 s beats (then no beat is running and no paused line is written, by design); at least one catches a running beat, and the expect-log lines above need only one pause line and one resume line.
- extendedWaitUntil:
    visible:
      id: SilentBeatNeverShown
    timeout: 45000
    optional: true
# Back in front after the last wake (stopApp: false keeps the process).
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: ReadingSurface
    timeout: 20000
# The read goes on after the last unlock.
- assertVisible:
    id: ReadingSurface
- extendedWaitUntil:
    visible: Pause
    timeout: 10000
