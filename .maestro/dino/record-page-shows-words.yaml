# Slice 231, redrawn by Slice 279 (mock Batch 48 frames 178 and 180): Record opens the intro page, the intro's Start opens the recording page, and that page shows the line's words on a card over the picture
# (the old page showed the page's words with an instruction, a note and a counter around them). The first piece of the book is shown with its words; the page holds no instruction text.
# The gate is skipped by the enter-grown-up hook; the book sheet's Record row is tapped by its text.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
# expect-log: HOOK import-test-book ok three-little-pigs
appId: uk.sirous.dinoreader.dbg
name: Record page shows the words
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow imports one test book and records nothing.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: GalleryTitle
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: import-test-book
      id: three-little-pigs
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- tapOn:
    text: "Record your voice"
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: RecordIntroStart
    timeout: 20000
- tapOn:
    id: RecordIntroStart
    waitToSettleTimeoutMs: 300
# The first piece: its words (the card's label id is RecordViews.PageWordsId) and the three controls, nothing else around it.
- extendedWaitUntil:
    visible:
      id: RecordPageWords
    timeout: 15000
- assertVisible:
    id: RecordPageWords
    text: ".{10,}"
- assertVisible:
    id: RecordButton
- assertNotVisible: "Read aloud the words on each screen."
