# POST-MERGE LIVE CHECK by design (Slice 260 Not yet verified): fails before the merge's publish-store has run (the live store list has no tags until then).
# Slice 260: the store lists tagged books first and shows each tag as a badge in the app language. Lion and Mouse is tagged Hot and New, so with no scrolling its Hot badge is on screen
# (English "Hot", German "Angesagt"); an old list without tags would show no badge, so this flow fails against the old behaviour.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader.dbg
name: Store tag badges, tagged books first
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow reads the live store list and a starter shelf, with no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      lang: en
- extendedWaitUntil:
    visible:
      id: GalleryStore
    timeout: 30000
- tapOn:
    id: GalleryStore
- extendedWaitUntil:
    visible:
      id: store-tag-Hot
    timeout: 30000
- assertVisible:
    id: store-tag-New
- assertVisible: "Hot"
- launchApp:
    # launchApp-restart: a restart is wanted, the open store page must not still be on top when the German hook arrives.
    # clearState: wipes the app's data (settings, packs, own books), as above; fine, a fresh start in German so the shelf, not the open store, receives the next hook.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: de
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
      lang: de
- extendedWaitUntil:
    visible:
      id: GalleryStore
    timeout: 30000
- tapOn:
    id: GalleryStore
- extendedWaitUntil:
    visible: "Angesagt"
    timeout: 30000
- assertVisible:
    id: store-tag-Hot
- assertNotVisible: "Hot"
