# Slice 189: the shelf has the book-and-plus button and no gear; grown-up mode has the gear, a "..." on every cover and the book sheet; Settings goes back to grown-up mode, then the kids' shelf.
# The gate (hold, then a sum) is tapped through by hand: the enter-grown-up hook stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader
name: Grown-ups button, gear, book sheet and back chain
---
- launchApp:
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- assertVisible:
    id: GalleryGrownUps
- assertNotVisible:
    id: GallerySettings
- assertNotVisible:
    id: TileMore
# A relaunch without clearState keeps the books; the hook enters grown-up mode once the shelf is up.
- launchApp:
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 30000
- assertVisible:
    id: GallerySettings
- assertVisible:
    id: GalleryAddBook
- assertVisible:
    id: GalleryStore
- assertNotVisible:
    id: GalleryGrownUps
# The one-time "Storyteller voices are ready" note can cover grown-up mode once the background pack download ends; its OK has no id, so it is tapped by position (optional).
- tapOn:
    point: 50%,91%
    optional: true
# The sheet of a starter book: Remove, no Edit pages. Keep leaves it open; Done closes it.
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- assertNotVisible:
    id: BookSheetEdit
- tapOn:
    id: BookSheetRemove
    waitToSettleTimeoutMs: 300
- tapOn: Keep
- assertVisible:
    id: BookSheetRemove
- tapOn:
    id: BookSheetDone
    waitToSettleTimeoutMs: 300
- assertNotVisible:
    id: BookSheetRemove
# The voices-ready note may arrive late and cover the gear: dismiss it again (optional).
- tapOn:
    point: 50%,91%
    optional: true
# Gear -> Settings (no gate); back goes to grown-up mode, not the kids' shelf.
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- assertNotVisible:
    id: GalleryDone
- back
- extendedWaitUntil:
    visible:
      id: GalleryDone
    timeout: 10000
# Back from grown-up mode is the kids' shelf, with the book-and-plus button again.
- back
- extendedWaitUntil:
    visible:
      id: GalleryGrownUps
    timeout: 10000
- assertNotVisible:
    id: TileMore
