# Slice 189, Slice 418: the locked shelf has the lock and no "..." on the covers; unlocked it has the "Unlocked" chip, a "..." on every cover and the book sheet; Settings is a tab, and Back on its list goes to Books.
# The gate (hold, then a sum) is tapped through by hand (lock.yaml opens it and cancels): the enter-grown-up hook (the alias of unlock) stands in for a passed gate.
# expect-log: HOOK skip-first-run ok
# expect-log: HOOK enter-grown-up ok
appId: uk.sirous.dinoreader.dbg
name: Grown-ups button, gear, book sheet and back chain
---
- launchApp:
    # clearState: wipes the app's data (settings, downloaded voice/OCR packs, own books); fine here: the flow uses the starter shelf and the grown-up chain only, with no own book or voice pack.
    clearState: true
    arguments:
      cmd: skip-first-run
      lang: en
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 60000
- assertVisible:
    id: GalleryLock
- assertNotVisible:
    id: LockChip
- assertNotVisible:
    id: TileMore
# The hook goes to the running app (stopApp: false), so the books stay; the hook enters grown-up mode once the shelf is up.
- launchApp:
    stopApp: false
    arguments:
      cmd: enter-grown-up
- extendedWaitUntil:
    visible:
      id: LockChip
    timeout: 30000
- assertVisible:
    id: GallerySettings
- assertVisible:
    id: GalleryStore
- assertVisible:
    id: LockChip
# The sheet of a starter book: Remove, and no Edit pages row on any book (Slice 278). Keep leaves it open; a tap outside closes it.
- tapOn:
    id: TileMore
    index: 0
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: BookSheetRemove
    timeout: 10000
- assertNotVisible:
    id: BookSheetEdit
- tapOn:
    id: BookSheetRemove
    waitToSettleTimeoutMs: 300
- tapOn: Keep
- assertVisible:
    id: BookSheetRemove
# Slice 228: the sheet has no Done row; its round close button closes it.
- tapOn:
    id: BookSheetClose
    waitToSettleTimeoutMs: 300
- assertNotVisible:
    id: BookSheetRemove
# Slice 392 (Slice 325): Settings is a tab, not a pushed page, so the chip and the lock stay on screen with the Settings list under them.
- tapOn:
    id: GallerySettings
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: SettingsTitle
    timeout: 10000
- assertVisible:
    id: LockChip
# Android Back on the Settings list (no sub-page open) goes to the Books tab (Slice 418); the shelf stays unlocked, so the covers keep their "...".
- back
- extendedWaitUntil:
    visible:
      id: StoryTile
    timeout: 10000
- assertVisible:
    id: TileMore
# The lock locks at once, with no question: the chip and the "..." go.
- tapOn:
    id: GalleryLock
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: LockToast
    timeout: 10000
- assertNotVisible:
    id: LockChip
- assertNotVisible:
    id: TileMore
