    <style>
      /* Slice 433 item 6: the iPad app preview (1600 x 1200, landscape), the same timeline and captions as index.html (the iPhone one). */
      @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf"); font-weight: 300 700; }
      /* Slice 433 item 10: the caption font per language, picked as tools/emulator/store-captions.ps1 does (preview-locales.mjs sets capFont and checks every glyph): Andika for Cyrillic, Vazirmatn for Arabic, the Windows UI fonts for Japanese and Chinese (local render only). */
      @font-face { font-family: "Andika"; src: url("assets/fonts/Andika-Regular.ttf"); }
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn.ttf"); font-weight: 100 900; }
      @font-face { font-family: "CapJa"; src: local("Yu Gothic UI Semibold"), local("YuGothicUI-Semibold"); }
      @font-face { font-family: "CapZh"; src: local("Microsoft YaHei UI"), local("MicrosoftYaHeiUI"); }
      :root {
        --brand: #5b57e8;
        --sand: #f3efe6;
        --ink: #2b2540;
        --body: #5a5470;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1600px; height: 1200px; overflow: hidden; background: var(--sand); }
      #root { position: relative; width: 1600px; height: 1200px; background: var(--sand); }
      /* The simulator shot is 2752 x 2064 (iPad 13" landscape); scaled to the width (x 0.5814, so 1600 x 1200) and its 28 px of status bar (48 px at full size) are cut off the top.
         User decision 2026-11-25 ("the text over is written on top? why? no one will see that! I think it should be in the middle of the page"): no top band; the footage uses the
         whole frame (its 1172 px centred, 14 px of the app's sand above and below) and each caption is a Brand panel in the vertical middle. The end frame's subscription line is a middle panel too (below). */
      #win { position: absolute; left: 0; top: 14px; width: 1600px; height: 1172px; overflow: hidden; background: var(--sand); }
      .shot { position: absolute; left: 0; top: -28px; width: 1600px; height: 1200px; }
      #dip { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; background: var(--sand); opacity: 0; z-index: 5; pointer-events: none; }
      .cap { position: absolute; left: 0; top: 0; width: 1600px; height: 1200px; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 6; }
      .pill { display: block; max-width: 1280px; padding: 26px 56px; border-radius: 40px; background: var(--brand); box-shadow: 0 14px 40px rgba(43, 37, 64, 0.35);
        font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 64px; line-height: 1.12; color: #ffffff; }
      /* Coordinator 2026-11-25: the end frame's line is the same middle panel, under "Dino / Kids Books & Stories" (no top band). */
      /* Slice 433 item 10: the panel hangs from its English top (793 px, one line) and grows downward, so a longer translation never covers the line above it. */
      .cap-end { top: 793px; height: 400px; align-items: flex-start; }
      /* Japanese has no spaces: break at phrase boundaries (Chrome's auto-phrase), never inside a word. */
      #root:lang(ja) .pill, #root:lang(ja) #end-sub { word-break: auto-phrase; }
      /* English keeps its accepted, unbalanced wrapping on purpose; translations balance their lines so no word or character is left alone. */
      #root:not(:lang(en)) .pill, #root:not(:lang(en)) #end-sub { text-wrap: balance; }
      #end { position: absolute; left: 0; top: 84px; width: 1600px; height: 1116px; background: var(--sand); z-index: 4; }
      #end-icon { position: absolute; left: 700px; top: 250px; width: 200px; height: 200px; border-radius: 46px; box-shadow: 0 12px 32px rgba(43, 37, 64, 0.18); }
      #end-name { position: absolute; left: 0; top: 490px; width: 1600px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 100px; line-height: 1; color: var(--ink); }
      #end-sub { position: absolute; left: 0; top: 610px; width: 1600px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 42px; color: var(--body); }
