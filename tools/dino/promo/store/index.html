      @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.ttf"); font-weight: 300 700; }
      /* Slice 433 item 10: the caption font per language, picked as tools/emulator/store-captions.ps1 does (preview-locales.mjs sets capFont and checks every glyph): Andika for Cyrillic, Vazirmatn for Arabic, the Windows UI fonts for Japanese and Chinese (local render only). */
      @font-face { font-family: "Andika"; src: url("assets/fonts/Andika-Regular.ttf"); }
      @font-face { font-family: "Vazirmatn"; src: url("assets/fonts/Vazirmatn.ttf"); font-weight: 100 900; }
      @font-face { font-family: "CapJa"; src: local("Yu Gothic UI Semibold"), local("YuGothicUI-Semibold"); }
      @font-face { font-family: "CapZh"; src: local("Microsoft YaHei UI"), local("MicrosoftYaHeiUI"); }
      :root {
        --brand: #5b57e8;
        --sand: #f3efe6;
        --ink: #2b2540;
        --body: #5a5470;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 886px; height: 1920px; overflow: hidden; background: var(--sand); }
      #root { position: relative; width: 886px; height: 1920px; background: var(--sand); }
      /* The simulator shot is 1320 x 2868 (iPhone 6.9"); the picture is scaled to the width (x 0.6712, so 886 x 1925) and its 125 px of status bar (186 px at full size) are cut off the top.
         User decision 2026-11-25 ("the text over is written on top? why? no one will see that! I think it should be in the middle of the page"): the previews have no top band;
         the footage uses the whole frame (its 1800 px centred, 60 px of the app's sand above and below) and each caption is a Brand panel in the vertical middle. The end frame's subscription line is a middle panel too (below). */
      #win { position: absolute; left: 0; top: 60px; width: 886px; height: 1800px; overflow: hidden; background: var(--sand); }
      .shot { position: absolute; left: 0; top: -125px; width: 886px; height: 1925px; }
      #dip { position: absolute; left: 0; top: 0; width: 886px; height: 1920px; background: var(--sand); opacity: 0; z-index: 5; pointer-events: none; }
      .cap { position: absolute; left: 0; top: 0; width: 886px; height: 1920px; display: flex; align-items: center; justify-content: center; text-align: center; z-index: 6; }
      .pill { display: block; max-width: 708px; padding: 30px 48px; border-radius: 44px; background: var(--brand); box-shadow: 0 16px 44px rgba(43, 37, 64, 0.35);
        font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 64px; line-height: 1.14; color: #ffffff; }
      /* Coordinator 2026-11-25 (the user's objection to a top band covers the end frame too): the end frame's line is the same middle panel, under "Dino / Kids Books & Stories". */
      /* Slice 433 item 10: the panel hangs from its English top (1237 px, two lines) and grows downward, so a three-line translation never covers the line above it. */
      .cap-end { top: 1237px; height: 600px; align-items: flex-start; }
      /* Japanese has no spaces: break at phrase boundaries (Chrome's auto-phrase), never inside a word. */
      #root:lang(ja) .pill, #root:lang(ja) #end-sub { word-break: auto-phrase; }
      /* English keeps its accepted, unbalanced wrapping on purpose; translations balance their lines so no word or character is left alone. */
      #root:not(:lang(en)) .pill, #root:not(:lang(en)) #end-sub { text-wrap: balance; }

      #end-icon { position: absolute; left: 293px; top: 420px; width: 300px; height: 300px; border-radius: 68px; box-shadow: 0 14px 36px rgba(43, 37, 64, 0.18); }
      #end-name { position: absolute; left: 0; top: 790px; width: 886px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 120px; line-height: 1; color: var(--ink); }
      #end-sub { position: absolute; left: 0; top: 930px; width: 886px; text-align: center; font-family: "Fredoka", sans-serif; font-weight: 500; font-size: 48px; color: var(--body); }
