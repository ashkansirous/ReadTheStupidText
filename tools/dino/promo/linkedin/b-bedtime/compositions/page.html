    (function () {
      const HL = "#fbe38a";
      const CLEAR = "rgba(251, 227, 138, 0)";
      const tl = gsap.timeline({ paused: true });

      // Camera: one slow push over the whole page scene; the picture never cuts.
      tl.fromTo("#pg-cam", { scale: 1 }, { scale: 1.06, duration: 18.2, ease: "none" }, 0);

      tl.set("#pg-chip-en-fill", { opacity: 1 }, 0);
      tl.set("#pg-chip-en-label", { color: "#ffffff" }, 0);

      // A sentence lights up while its clip plays, as the app's reading highlight does.
      function light(id, on, off) {
        tl.fromTo(id, { backgroundColor: CLEAR }, { backgroundColor: HL, duration: 0.15, ease: "power1.out" }, on);
        tl.to(id, { backgroundColor: CLEAR, duration: 0.2, ease: "power1.in" }, off);
      }
      // The chip of the language that speaks turns violet; the one before goes back to paper.
      function chipOn(lang, prev, at) {
        tl.fromTo("#pg-chip-" + lang, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, at);
        tl.fromTo("#pg-chip-" + lang + "-fill", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.inOut" }, at + 0.1);
        tl.fromTo("#pg-chip-" + lang + "-label", { color: "#2b2540" }, { color: "#ffffff", duration: 0.25 }, at + 0.1);
        tl.to("#pg-chip-" + prev + "-fill", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, at + 0.1);
        tl.to("#pg-chip-" + prev + "-label", { color: "#2b2540", duration: 0.25 }, at + 0.1);
      }
      // Blur swap on one stage: the text card stays, its words change language.
      function swap(from, to, at) {
        tl.to(from, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, at);
        tl.fromTo(to, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, at + 0.18);
      }

      // Opening caption: already on screen at frame 0 (the thumbnail), leaves just before the Farsi swap.

      window.__timelines["page"] = tl;
