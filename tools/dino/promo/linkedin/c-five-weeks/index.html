<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1350">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f3efe6;
        --ink: #2b2540;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
      #rail {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="44" data-width="1080" data-height="1350">
      <div id="bg"></div>

      <!-- Scenes, back to back on one lane -->
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="week1" data-composition-id="week1" data-composition-src="compositions/week1.html" data-start="4.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="week2" data-composition-id="week2" data-composition-src="compositions/week2.html" data-start="10.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="week3" data-composition-id="week3" data-composition-src="compositions/week3.html" data-start="16.5" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="week4" data-composition-id="week4" data-composition-src="compositions/week4.html" data-start="21.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="week5" data-composition-id="week5" data-composition-src="compositions/week5.html" data-start="27.5" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="tally" data-composition-id="tally" data-composition-src="compositions/tally.html" data-start="33.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="37" data-duration="7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>

      <!-- The week rail rides over the week scenes and the tally (4.5-37 s) -->
      <div id="rail" data-composition-id="rail" data-composition-src="compositions/rail.html" data-start="4.5" data-duration="32.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1350"></div>

      <!-- Music bed: HeyGen catalog, "Astral Generated Music: 3602ebd4" (cheerful upbeat preschool pop, 43 s; free catalog via HyperFrames), as in film B. No voices in this film. -->
      <audio id="music" class="clip" src="assets/bgm/cheerful-kids-11.m4a" data-start="0" data-duration="43" data-track-index="5" data-volume="0.45" data-fade-in="0.6" data-fade-out="3.5"></audio>

      <!-- Effects: a pop as each week lands, the store pops as in film B -->
      <audio id="sfx-w1" class="clip" src="assets/sfx/pop.mp3" data-start="4.6" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/pop.mp3" data-start="10.6" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/pop.mp3" data-start="16.6" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/pop.mp3" data-start="21.6" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-w5" class="clip" src="assets/sfx/pop.mp3" data-start="27.6" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-tally" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="33.6" data-duration="0.6" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-store-1" class="clip" src="assets/sfx/pop.mp3" data-start="40.63" data-duration="0.39" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-store-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="40.83" data-duration="0.36" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-store-3" class="clip" src="assets/sfx/pop.mp3" data-start="41.03" data-duration="0.4" data-track-index="3" data-volume="0.32"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
