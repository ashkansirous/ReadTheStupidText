name: testflight-external

# Daily: sends each iOS app's newest processed build to the external TestFlight group ("Rofagha")
# and submits it for Beta App Review, even if an older build's review is still waiting. Never
# cancels a review, never expires a build (Decision 154, Slice 147). Internal testers still get
# every merge via release.yml. Two crons because GitHub delays or drops on-the-hour ones; the
# backup skips when the newest build is already submitted, and submits a newer one if it
# finished processing after the first run.

on:
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to send to external testers.'
        required: true
        type: choice
        options: [both, rtst, dino]
        default: both

permissions:
  contents: read

# Never cancel a running submission.
concurrency:
  group: testflight-external
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPS: ${{ (github.event.inputs.app || 'both') == 'both' && 'rtst dino' || github.event.inputs.app }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit the newest build to external testers
        run: |
          read -ra app_keys <<< "$APPS"
          node .github/scripts/ios-review-cadence.mjs testflight "${app_keys[@]}"
