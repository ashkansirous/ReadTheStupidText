name: release

# The one workflow that reacts to a push to main (Slice 70; it replaced the
# monolithic build.yml). Pull requests are covered by each platform workflow's
# own `pull_request` paths: windows.yml, android.yml, ios.yml, tests.yml,
# dinoreader.yml, site-checks.yml, release-scripts.yml (which also lints every
# workflow with actionlint).
#
# Manual run: `workflow_dispatch` behaves exactly like a push to main (same
# version, same release, same submits) and is refused on any other ref. The
# `force_all` input builds every target regardless of what changed, which is
# how a full (and, with the secrets set, signed) rebuild + release is triggered
# by hand.
#
# Store submission: `store-submit` runs only for Windows-specific changes (the `windowsstore`
# ship-targets output: App/Infrastructure/store-submit.yml/windows.yml, or force_all, a major bump or
# no base tag). A core-only change (Domain/Application/Documents) still rebuilds the MSIX for the
# GitHub release but does not start a Store submission.
#
# Rules carried over from build.yml (Batch 8, Decisions 52-58):
#   * ZERO Actions artifacts. The account's Actions+Packages storage quota is
#     500 MB, shared by every repo and billed as monthly GB-hours; one run's
#     MSIX x64 + ARM64 + AAB + APK is ~1 GB. GitHub Release assets don't count
#     toward it, so every build output goes straight to a draft Release.
#     Don't add actions/upload-artifact for build outputs.
#   * Only build what changed. The `version` job runs
#     .github/scripts/ship-targets.mjs after GitVersion (unit-tested by
#     ship-targets.test.mjs on every PR): core code builds all three app
#     platforms, App/Infrastructure only Windows, Mobile splits by folder
#     (Decision 69: Platforms/Android -> Android, Platforms/iOS -> iOS, the rest
#     of Mobile -> both), Mobile.Shared (Slice 58) rebuilds every app that uses it
#     (its root: Android + iOS + Dino Reader; Platforms/Android: Android + Dino
#     Reader; Platforms/iOS: iOS), DinoReader.App only Dino Reader, DinoReader.Core
#     runs its tests and also builds Dino Reader, docs build nothing.
#     A major version bump (or force_all) builds everything. Each platform
#     workflow's `pull_request.paths` mirrors that mapping; the test parses
#     them and fails on drift.
#   * iOS (Slice 48, Decision 70): compiles unsigned until the six iOS signing
#     secrets exist (`release-draft` reports whether they do as `ios_signed`).
#     With them, a release run signs an App Store .ipa, attaches it to the draft
#     and `testflight-submit` uploads it after the release publishes. An unsigned
#     iOS build can't ship, so an iOS-only change with no secrets cuts no
#     release (release-draft skips it).
#   * Dino Reader (Slice 58, Decision 72) is a second Android app sharing this
#     one version. It compiles unsigned until its OWN four signing secrets exist
#     (DINOREADER_ANDROID_SIGNING_*; `release-draft` reports whether they do as
#     `dino_signed`, which also requires DINOREADER_PLAY_SERVICE_ACCOUNT_JSON so a
#     half-configured repo never publishes a Dino-only GitHub release). With them, a release
#     run signs a DinoReader-<v>.aab/.apk, attaches both to the draft, and `play-submit-dino`
#     sends the .aab to its own Play internal track. A Dino-only
#     change without the signing secrets cuts no release, like an unsigned iOS one.
#
#   * Dino Reader on iOS (Slice 67) is a third signed target (`dinoios`): its own
#     `dinoreader-ios.yml`, signed when the five team-wide iOS secrets AND
#     DINOREADER_IOS_PROVISIONING_PROFILE_BASE64 exist (`dino_ios_signed`), uploaded by
#     `testflight-submit-dino`. Without them it compiles unsigned and ships nothing.
#
#   * Dino Reader on Windows (Slice 67) is the `dinowin` target: `dinoreader-windows.yml` builds an
#     unsigned, self-contained MSIX per architecture (no secrets needed) and attaches both to the
#     draft as DinoReader.App_<v>.0_<arch>.msix. `store-submit-dino` sends them to the Store with
#     the same AZURE_AD_*/SELLER_ID secrets, but only when the repository variable
#     DINOREADER_STORE_APP_ID is set (it is empty until the Partner Center listing exists).
#
# Flow: version (GitVersion + ship-targets, one full clone) -> test ->
# release-draft (runs when windows || android || ios || dinoapp; creates/reuses draft
# v<x.y.z>, carries forward the untouched platform's assets from its last
# release) -> build-windows / build-android / build-ios (reusable workflows;
# they upload into the draft; build-dinoapp is Dino Reader's) -> release-publish (only if every affected build
# succeeded; the tag is created here, so a failed run leaves no v* tag) ->
# store-submit / play-submit / play-submit-dino / testflight-submit / publish-downloads.
# `dinoreader` and `site-checks` are standalone: in no job's needs, so an
# outage there can never block a build or a release.
#
# GitVersion derives the SemVer from git tags (Decision 17): main defaults to a
# patch bump; "+semver: minor|major|none" in a commit overrides it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Build every target (Windows, Android, iOS, Dino Reader app and tests) whatever changed.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel an in-progress run (two runs would race on the same draft
# Release). GitHub keeps only ONE pending run per group and drops older pending
# ones, which is safe only because `version` diffs against the last release tag, so
# the surviving run still sees the dropped run's changes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GitVersion, then the ship-targets plan, in one full clone (ship-targets
  # diffs against the last published release tag, and GitVersion needs the
  # tags too).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      versionCode: ${{ steps.versioncode.outputs.code }}
      windows: ${{ steps.targets.outputs.windows }}
      windows_store: ${{ steps.targets.outputs.windowsstore }}
      android: ${{ steps.targets.outputs.android }}
      ios: ${{ steps.targets.outputs.ios }}
      dinoreader: ${{ steps.targets.outputs.dinoreader }}
      dinoapp: ${{ steps.targets.outputs.dinoapp }}
      dinoios: ${{ steps.targets.outputs.dinoios }}
      dinowin: ${{ steps.targets.outputs.dinowin }}
    steps:
      # workflow_dispatch can be started on any branch; only main may release.
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release.yml only runs on main (this is ${GITHUB_REF})."
          exit 1

      - name: Checkout (full history + tags — GitVersion and ship-targets need them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true

      # Android versionCode must be a strictly increasing integer. Three-digit
      # minor/patch fields (the old 10000/100 packing collided once patch hit
      # 100); every code this yields exceeds the old scheme's 10012 for 1.0.12.
      - name: Derive Android versionCode
        id: versioncode
        run: |
          CODE=$(( ${{ steps.gitversion.outputs.major }} * 1000000 + ${{ steps.gitversion.outputs.minor }} * 1000 + ${{ steps.gitversion.outputs.patch }} ))
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Which targets this run builds, from the files changed since the last
      # published release tag and whether the version's major moved.
      - name: Decide what ships
        id: targets
        env:
          NEW_VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          FORCE_ALL: ${{ inputs.force_all && 'true' || 'false' }}
        run: node .github/scripts/ship-targets.mjs

  # Pure-logic unit tests. Gates every Windows/Android build and so every release.
  test:
    needs: version
    if: needs.version.outputs.windows == 'true' || needs.version.outputs.android == 'true' || needs.version.outputs.dinowin == 'true'
    uses: ./.github/workflows/tests.yml

  # Dino Reader's pure Core. Standalone: a Dino-only push tests but never
  # versions or releases.
  dinoreader:
    needs: version
    if: needs.version.outputs.dinoreader == 'true'
    uses: ./.github/workflows/dinoreader.yml

  # Standalone, like dinoreader: the downloads Worker's checks are in no job's
  # needs, so an outage can never block a release. (The release scripts' own
  # tests run on PRs in release-scripts.yml.)
  site-checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site-checks.yml

  # Creates (or, on a re-run / after a failed run, reuses and empties) a DRAFT
  # v<x.y.z> release at this merge commit. Drafts create no tag, so nothing is
  # visible or tagged until release-publish. Skips the whole release
  # (proceed=false) if this version is already published — GitVersion holds the
  # version steady until the next tag, so consecutive pushes can resolve to the
  # same one. Skipped outright when no app platform was selected (docs, DinoReader).
  release-draft:
    needs: [version, test]
    # `test` is skipped (not failed) when only iOS changed, so a bare `needs`
    # would skip this job: !cancelled() plus explicit results instead.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.version.result == 'success'
      && (needs.version.outputs.windows == 'true' || needs.version.outputs.android == 'true' || needs.version.outputs.ios == 'true' || needs.version.outputs.dinoapp == 'true' || needs.version.outputs.dinoios == 'true' || needs.version.outputs.dinowin == 'true')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      proceed: ${{ steps.draft.outputs.proceed }}
      # Whether the six iOS signing secrets are all set (all six, so a
      # half-configured repo stays unsigned instead of failing). Computed here
      # from job-level env because `secrets` can't appear in an `if:`.
      ios_signed: ${{ steps.ios.outputs.signed }}
      # Whether all five Dino Reader secrets are set: the four Android signing ones plus the Play service account (Slice 58).
      dino_signed: ${{ steps.dino.outputs.signed }}
      # Whether the Dino Reader iOS secrets are all set: the five team-wide iOS ones plus its own provisioning profile (Slice 67).
      dino_ios_signed: ${{ steps.dinoios.outputs.signed }}
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_P12_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_DINO_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_P12_PASSWORD != '' && secrets.DINOREADER_IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_DINO_SIGNING: ${{ secrets.DINOREADER_ANDROID_SIGNING_KEYSTORE_BASE64 != '' && secrets.DINOREADER_ANDROID_SIGNING_KEY_ALIAS != '' && secrets.DINOREADER_ANDROID_SIGNING_KEY_PASSWORD != '' && secrets.DINOREADER_ANDROID_SIGNING_STORE_PASSWORD != '' && secrets.DINOREADER_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
      WINDOWS: ${{ needs.version.outputs.windows }}
      ANDROID: ${{ needs.version.outputs.android }}
      IOS: ${{ needs.version.outputs.ios }}
      DINO: ${{ needs.version.outputs.dinoapp }}
      DINO_IOS: ${{ needs.version.outputs.dinoios }}
      DINO_WIN: ${{ needs.version.outputs.dinowin }}
    steps:
      - name: Check the iOS signing secrets
        id: ios
        run: echo "signed=${HAS_IOS_SIGNING}" >> "$GITHUB_OUTPUT"

      - name: Check the Dino Reader signing secrets
        id: dino
        run: echo "signed=${HAS_DINO_SIGNING}" >> "$GITHUB_OUTPUT"

      - name: Check the Dino Reader iOS signing secrets
        id: dinoios
        run: echo "signed=${HAS_DINO_IOS_SIGNING}" >> "$GITHUB_OUTPUT"

      # An unsigned iOS or Dino Reader build can't be shipped, so a change that only
      # touches those while their signing secrets are missing releases nothing: no
      # draft, no tag, and proceed stays unset so every later release step is skipped.
      - name: Check that something shippable changed
        id: shippable
        run: |
          if [ "$WINDOWS" = "true" ] || [ "$DINO_WIN" = "true" ] || [ "$ANDROID" = "true" ] \
            || { [ "$IOS" = "true" ] && [ "${{ steps.ios.outputs.signed }}" = "true" ]; } \
            || { [ "$DINO" = "true" ] && [ "${{ steps.dino.outputs.signed }}" = "true" ]; } \
            || { [ "$DINO_IOS" = "true" ] && [ "${{ steps.dinoios.outputs.signed }}" = "true" ]; }; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only iOS or Dino Reader changed and their signing secrets are not set, so there is nothing to release."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse the draft release
        id: draft
        if: steps.shippable.outputs.ship == 'true'
        run: |
          set -euo pipefail
          state=$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq "map(select(.tagName == \"$TAG\")) | if length == 0 then \"missing\" else (.[0].isDraft | tostring) end")
          case "$state" in
            false)
              echo "::notice::Release $TAG is already published — version did not bump; skipping the release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            true)
              echo "Reusing draft $TAG: retargeting to ${GITHUB_SHA} and clearing stale assets."
              gh release edit "$TAG" --repo "$REPO" --target "$GITHUB_SHA"
              gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes; done ;;
            missing)
              gh release create "$TAG" --repo "$REPO" --draft --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes ;;
          esac
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (release scripts)
        if: steps.draft.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # A release always carries every platform's latest build (Decision 57):
      # a platform that won't upload fresh assets this run (untouched, or
      # Android without the signing secret) gets them copied from the newest
      # published release that has them (Releases API only — no Actions
      # storage), so releases/latest never lacks the MSIX or the APK.
      - name: Carry forward assets of platforms not rebuilt
        if: steps.draft.outputs.proceed == 'true'
        env:
          HAS_SIGNING: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
          IOS_SIGNED: ${{ steps.ios.outputs.signed }}
          DINO_SIGNED: ${{ steps.dino.outputs.signed }}
          DINO_IOS_SIGNED: ${{ steps.dinoios.outputs.signed }}
        run: |
          set -euo pipefail
          carry_forward() {
            local found source
            found=$(bash .github/scripts/find-release.sh "$1")
            if [ -z "$found" ]; then echo "No earlier release has assets matching $1 — nothing to carry."; return 0; fi
            source=$(head -n 1 <<< "$found")
            mkdir -p carry && rm -f carry/*
            tail -n +2 <<< "$found" |
              while read -r name; do gh release download "$source" --repo "$REPO" --pattern "$name" --dir carry; done
            echo "Carrying forward from $source:"; ls carry
            gh release upload "$TAG" carry/* --repo "$REPO" --clobber
          }
          if [ "$WINDOWS" != "true" ]; then carry_forward '^ReadTheStupidText\.App_.*\.msix$'; fi
          if [ "$DINO_WIN" != "true" ]; then carry_forward '^DinoReader\.App_.*\.msix$'; fi
          # Each app matches only its own staged name (ReadTheStupidText-<v> / DinoReader-<v>;
          # see stage-android-package.sh), so the two never mix.
          if [ "$ANDROID" != "true" ] || [ "$HAS_SIGNING" != "true" ]; then carry_forward '^ReadTheStupidText-.*\.(aab|apk)$'; fi
          if [ "$DINO" != "true" ] || [ "$DINO_SIGNED" != "true" ]; then carry_forward '^DinoReader-.*\.(aab|apk)$'; fi
          if [ "$IOS" != "true" ] || [ "$IOS_SIGNED" != "true" ]; then carry_forward '^ReadTheStupidText-.*\.ipa$'; fi
          if [ "$DINO_IOS" != "true" ] || [ "$DINO_IOS_SIGNED" != "true" ]; then carry_forward '^DinoReader-.*\.ipa$'; fi

  build-windows:
    needs: [version, test, release-draft]
    # !cancelled() + explicit results: release-draft is skipped when nothing
    # ships, and a bare `needs` would cascade that skip into this job.
    if: >-
      !cancelled()
      && needs.version.outputs.windows == 'true'
      && needs.release-draft.outputs.proceed == 'true'
      && needs.version.result == 'success'
      && needs.test.result == 'success'
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      upload: ${{ needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # CI signs with an upload key; Google Play App Signing re-signs for
  # distribution, so no release-signing secret leaves CI (Decisions 18/42).
  # The unsigned Debug build always runs; the signed .aab/.apk build only when
  # cutting a release and once ANDROID_SIGNING_KEYSTORE_BASE64 exists.
  build-android:
    needs: [version, test, release-draft]
    if: >-
      !cancelled()
      && needs.version.outputs.android == 'true'
      && needs.release-draft.outputs.proceed == 'true'
      && needs.version.result == 'success'
      && needs.test.result == 'success'
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      version_code: ${{ needs.version.outputs.versionCode }}
      release: ${{ needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # iOS (Slice 48, Decision 70). The unsigned simulator compile runs whenever
  # there is no signed publish to prove the same thing; the signed App Store
  # .ipa is built only when cutting a release and once all six iOS secrets exist.
  build-ios:
    needs: [version, test, release-draft]
    if: >-
      !cancelled()
      && needs.version.outputs.ios == 'true'
      && needs.version.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.release-draft.outputs.ios_signed == 'true' && needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # Dino Reader (Slice 58, Decision 72): the second Android app. Same shape as build-ios:
  # the unsigned compile runs whenever the app (or code it shares) changed; the signed
  # .aab/.apk is built only when cutting a release and once its four secrets exist.
  build-dinoapp:
    needs: [version, test, release-draft]
    if: >-
      !cancelled()
      && needs.version.outputs.dinoapp == 'true'
      && needs.version.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/dinoreader-android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      version_code: ${{ needs.version.outputs.versionCode }}
      release: ${{ needs.release-draft.outputs.dino_signed == 'true' && needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # Dino Reader on iOS (Slice 67): the twin of build-ios for `src/DinoReader.App` (uk.sirous.dinoreader).
  # The signed .ipa needs the five team-wide iOS secrets plus its own provisioning profile.
  build-dinoios:
    needs: [version, test, release-draft]
    if: >-
      !cancelled()
      && needs.version.outputs.dinoios == 'true'
      && needs.version.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/dinoreader-ios.yml
    with:
      version: ${{ needs.version.outputs.version }}
      sign: ${{ needs.release-draft.outputs.dino_ios_signed == 'true' && needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # Dino Reader on Windows (Slice 67): the twin of build-windows for `src/DinoReader.App`. Unsigned
  # MSIX x64 + ARM64, so it needs no secrets and always uploads into the draft.
  build-dinowin:
    needs: [version, test, release-draft]
    if: >-
      !cancelled()
      && needs.version.outputs.dinowin == 'true'
      && needs.release-draft.outputs.proceed == 'true'
      && needs.version.result == 'success'
      && needs.test.result == 'success'
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    permissions:
      contents: write   # gh release upload
    uses: ./.github/workflows/dinoreader-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      upload: ${{ needs.release-draft.outputs.proceed == 'true' }}
    secrets: inherit

  # Publishes the draft (creating the v<x.y.z> tag at the merge commit) only
  # when every platform this change touched built successfully. iOS and Dino Reader
  # count only when signed: an unsigned compile check gates nothing (it can't ship).
  release-publish:
    needs: [version, release-draft, build-windows, build-dinowin, build-android, build-ios, build-dinoapp, build-dinoios]
    if: >-
      !cancelled()
      && needs.release-draft.outputs.proceed == 'true'
      && (needs.version.outputs.windows != 'true' || needs.build-windows.result == 'success')
      && (needs.version.outputs.dinowin != 'true' || needs.build-dinowin.result == 'success')
      && (needs.version.outputs.android != 'true' || needs.build-android.result == 'success')
      && (needs.version.outputs.ios != 'true' || (needs.release-draft.outputs.ios_signed != 'true' || needs.build-ios.result == 'success'))
      && (needs.version.outputs.dinoapp != 'true' || (needs.release-draft.outputs.dino_signed != 'true' || needs.build-dinoapp.result == 'success'))
      && (needs.version.outputs.dinoios != 'true' || (needs.release-draft.outputs.dino_ios_signed != 'true' || needs.build-dinoios.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Publish v${{ needs.version.outputs.version }}
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          WINDOWS: ${{ needs.version.outputs.windows }}
          DINO_WIN: ${{ needs.version.outputs.dinowin }}
          IOS: ${{ needs.version.outputs.ios }}
          IOS_SIGNED: ${{ needs.release-draft.outputs.ios_signed }}
          DINO: ${{ needs.version.outputs.dinoapp }}
          DINO_SIGNED: ${{ needs.release-draft.outputs.dino_signed }}
          DINO_IOS: ${{ needs.version.outputs.dinoios }}
          DINO_IOS_SIGNED: ${{ needs.release-draft.outputs.dino_ios_signed }}
        run: |
          set -euo pipefail
          # A re-run of an old failed run must not publish its stale draft over
          # a newer release (it would become "latest" and hit the Store with a
          # lower version) — discard it instead. Only app tags (v<x.y.z>) count:
          # packs-<n> releases must never be compared as app versions.
          newest=$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sed 's/^v//' | sort -V | tail -n 1 || true)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::warning::v${newest} is already published, newer than v${VERSION} — deleting this stale draft instead of publishing it."
            gh release delete "v${VERSION}" --repo "$REPO" --yes
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh release view "v${VERSION}" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets on v${VERSION}:"; echo "$names"
          if [ "$WINDOWS" = "true" ]; then
            built=$(grep -cE "^ReadTheStupidText[.]App_${VERSION//./[.]}[.]0_.*[.]msix$" <<< "$names" || true)
            if [ "$built" -ne 2 ]; then
              echo "::error::Expected 2 freshly built MSIX (x64 + ARM64) for ${VERSION}, found ${built}"; exit 1
            fi
          fi
          if [ "$DINO_WIN" = "true" ]; then
            built=$(grep -cE "^DinoReader[.]App_${VERSION//./[.]}[.]0_.*[.]msix$" <<< "$names" || true)
            if [ "$built" -ne 2 ]; then
              echo "::error::Expected 2 freshly built Dino Reader MSIX (x64 + ARM64) for ${VERSION}, found ${built}"; exit 1
            fi
          fi
          if [ "$IOS" = "true" ] && [ "$IOS_SIGNED" = "true" ]; then
            if ! grep -qxF "ReadTheStupidText-${VERSION}.ipa" <<< "$names"; then
              echo "::error::Expected the freshly built ReadTheStupidText-${VERSION}.ipa on the draft"; exit 1
            fi
          fi
          if [ "$DINO" = "true" ] && [ "$DINO_SIGNED" = "true" ]; then
            for ext in aab apk; do
              if ! grep -qxF "DinoReader-${VERSION}.${ext}" <<< "$names"; then
                echo "::error::Expected the freshly built DinoReader-${VERSION}.${ext} on the draft"; exit 1
              fi
            done
          fi
          if [ "$DINO_IOS" = "true" ] && [ "$DINO_IOS_SIGNED" = "true" ]; then
            if ! grep -qxF "DinoReader-${VERSION}.ipa" <<< "$names"; then
              echo "::error::Expected the freshly built DinoReader-${VERSION}.ipa on the draft"; exit 1
            fi
          fi
          gh release edit "v${VERSION}" --repo "$REPO" --draft=false --latest
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Slice 69: an extra public copy of the signed APK in R2, which the landing
  # site serves at /download. Its own job on purpose: it holds no signing
  # secrets, reads the APK back from the published GitHub Release (the build
  # store), and nothing needs it, so a bucket or token problem shows up red
  # here without ever blocking store-submit or play-submit. Without
  # CLOUDFLARE_API_TOKEN the script logs a skip and exits 0. wrangler (a root
  # devDependency) is what uploads, hence npm ci.
  publish-downloads:
    needs: [version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && (needs.version.outputs.android == 'true' || needs.version.outputs.dinoapp == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Slice 74: one matrix leg per product, so a Dino problem never turns the
    # Read The Stupid Text copy red. A product copies only when it shipped in
    # this run (`shipped`); a run that did not ship it leaves its previous APK
    # in the bucket, which the Worker keeps serving as "latest" (highest
    # manifest version). The job `if` skips the whole matrix when neither shipped (an
    # empty output counts as not shipped); `if` cannot read `matrix`, so within
    # it the download step gates each leg: later steps need its `found` output.
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: readthestupidtext
            stem: ReadTheStupidText
            shipped: ${{ needs.version.outputs.android }}
          - product: dinoreader
            stem: DinoReader
            shipped: ${{ needs.version.outputs.dinoapp }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      STEM: ${{ matrix.stem }}
    steps:
      - name: Checkout
        if: matrix.shipped == 'true'
        uses: actions/checkout@v4

      # A release without a signed APK (no keystore secret) has nothing to copy.
      - name: Download the APK from the release
        id: apk
        if: matrix.shipped == 'true'
        run: |
          set -euo pipefail
          names=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          if ! grep -qxF "${STEM}-${VERSION}.apk" <<< "$names"; then
            echo "No ${STEM}-${VERSION}.apk on v${VERSION}; nothing to copy." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "v${VERSION}" --repo "${{ github.repository }}" -p "${STEM}-*.apk" --dir dist
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.apk.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.apk.outputs.found == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Copy the APK to the downloads bucket (R2)
        if: steps.apk.outputs.found == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLATFORM: android
          PRODUCT: ${{ matrix.product }}
          ASSET_PATHS: dist/${{ matrix.stem }}-${{ needs.version.outputs.version }}.apk
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Skipped: CLOUDFLARE_API_TOKEN is not set, so ${STEM} v${VERSION} was not copied to the downloads bucket." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node .github/scripts/publish-downloads.mjs
          echo "Copied ${STEM}-${VERSION}.apk to the downloads bucket (or it was already there)." >> "$GITHUB_STEP_SUMMARY"

  # Microsoft Store submission (Decision 44) — only when Windows-specific paths changed
  # (`windowsstore`), not for a core-only change.
  # A job in this run, not an `on: release` trigger: a GITHUB_TOKEN-created
  # release never starts another workflow run (GitHub's recursion guard).
  store-submit:
    needs: [version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.windows_store == 'true'
    uses: ./.github/workflows/store-submit.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      product_id: ${{ vars.STORE_PRODUCT_ID }}
    secrets: inherit

  # Dino Reader's Microsoft Store submission (Slice 67) - only when Dino Reader's MSIX were rebuilt AND
  # the Partner Center listing exists, i.e. the repository variable DINOREADER_STORE_APP_ID (its Store
  # id) is set. With the variable empty the job is skipped cleanly. Same store-submit.yml and the same
  # AZURE_AD_*/SELLER_ID secrets as Read The Stupid Text; only the package and product id differ.
  store-submit-dino:
    needs: [version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.dinowin == 'true'
      && vars.DINOREADER_STORE_APP_ID != ''
    uses: ./.github/workflows/store-submit.yml
    with:
      tag: v${{ needs.version.outputs.version }}
      package: DinoReader.App
      product_id: ${{ vars.DINOREADER_STORE_APP_ID }}
    secrets: inherit

  # Google Play internal-testing upload — only when Android was rebuilt. A
  # no-op until both the signing and PLAY_SERVICE_ACCOUNT_JSON secrets exist;
  # Play Console also needs the very first release on a track uploaded by hand
  # once (an API limitation).
  play-submit:
    needs: [version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Download the .aab from the release
        if: ${{ env.CAN_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "ReadTheStupidText-${VERSION}.aab" --dir play

      - name: Publish to Play Store (internal testing)
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.sirous.readthestupidtext
          releaseFiles: play/*.aab
          track: internal
          status: completed

  # Dino Reader's Google Play internal-testing upload (Slice 58) - only when Dino Reader was
  # rebuilt, signed, and its OWN service account exists. A no-op until then: the app must first
  # be created in Play Console (uk.sirous.dinoreader), and its very first release on a track
  # uploaded by hand once (an API limitation). Never uses the Read The Stupid Text secrets.
  play-submit-dino:
    needs: [version, release-draft, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.dinoapp == 'true'
      && needs.release-draft.outputs.dino_signed == 'true'
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ secrets.DINOREADER_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Download the .aab from the release
        if: ${{ env.CAN_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "DinoReader-${VERSION}.aab" --dir play

      - name: Publish to Play Store (internal testing)
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.DINOREADER_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.sirous.dinoreader
          releaseFiles: play/*.aab
          track: internal
          status: completed

  # TestFlight upload (Decision 70) — only when iOS was rebuilt AND signed. The
  # .ipa comes from the published release, so a build for a release that never
  # went out is never uploaded. macOS because altool ships with Xcode. Apple takes
  # up to ~30 minutes to process a build; this job does not wait for that, and
  # adding the build to a tester group stays a manual step in App Store Connect.
  testflight-submit:
    needs: [version, release-draft, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.ios == 'true'
      && needs.release-draft.outputs.ios_signed == 'true'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the .ipa from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Capture first: `gh | grep -q` under pipefail fails on grep's early exit (SIGPIPE), reading as "asset missing".
          names=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          if ! grep -qxF "ReadTheStupidText-${VERSION}.ipa" <<< "$names"; then
            echo "::error::Release v${VERSION} was published as signed iOS but carries no ReadTheStupidText-${VERSION}.ipa; nothing was sent to TestFlight."; exit 1
          fi
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "ReadTheStupidText-${VERSION}.ipa" --dir testflight

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash .github/scripts/testflight-upload.sh "testflight/ReadTheStupidText-${VERSION}.ipa"

  # Slice 67: Dino Reader's own TestFlight upload (ASC app 6825053435, uk.sirous.dinoreader). Runs only when the
  # release was published with its signed .ipa, which needs DINOREADER_IOS_PROVISIONING_PROFILE_BASE64: with that
  # secret empty dino_ios_signed is false, nothing is built signed and this job is skipped.
  testflight-submit-dino:
    needs: [version, release-draft, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.version.outputs.dinoios == 'true'
      && needs.release-draft.outputs.dino_ios_signed == 'true'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Download the .ipa from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Capture first: `gh | grep -q` under pipefail fails on grep's early exit (SIGPIPE), reading as "asset missing".
          names=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          if ! grep -qxF "DinoReader-${VERSION}.ipa" <<< "$names"; then
            echo "::error::Release v${VERSION} was published as signed Dino Reader iOS but carries no DinoReader-${VERSION}.ipa; nothing was sent to TestFlight."; exit 1
          fi
          gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "DinoReader-${VERSION}.ipa" --dir testflight

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bash .github/scripts/testflight-upload.sh "testflight/DinoReader-${VERSION}.ipa"
