# Dino store books (Slice 158, Decision 163; own workflow again since 2026-11-01, Slice 239 "Changed after merge").
# Uploads the Dino store books that are behind the live store and delists the ones whose content folder is gone. It is
# separate from release.yml so a story merge starts at once and never waits in release.yml's concurrency group behind an
# app build (an iOS build can hold that group for an hour). Its own group queues uploads only behind each other.
# release.yml ignores the whole content/dino folder (its push `paths`); the starter list is checked here, in the first step below, and no longer builds the app (Slice 265).
# Mixed pushes (story + code) match both workflows. No Actions artifacts: the books stay on the runner.
name: Dino store books

on:
  push:
    branches: [main]
    paths:
      - 'content/dino/**'
      - '!content/dino/*/high-res/**'
      - 'tools/DinoReader.BookBuilder/**'
      - 'src/DinoReader.Core/**'
      - 'src/ReadTheStupidText.Application/**'
      - 'src/DinoReader.App/ShippedTitles.cs'
      - 'tools/upload-store-story.ps1'
      - '.github/scripts/publish-store-books.mjs'
      - '.github/scripts/r2-wrangler.mjs'
      - '.github/workflows/dino-store.yml'
  # A daily retry: the publish compares content hashes with the live store, so a run with nothing behind uploads nothing, and a failed or cancelled upload is caught here.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dino-store
  cancel-in-progress: false

jobs:
  publish-store:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # Slice 353: one SDK pin for every job

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Slice 239: no test suite runs for a store-only change, so the checks live in this job: `build --live` validates each store book (its book.json kind included) before it builds it:
      # an invalid book is skipped and named, the valid ones are still built and uploaded, and the job fails at the end.

      # The live store's version, content hash and highest package of every story, so the build can version a changed book above everything in the bucket (no stamp needed).
      - name: Read the live store state
        run: node .github/scripts/publish-store-books.mjs --live-state "$RUNNER_TEMP/live-store.json"

      # Slices 272 and 277: a book reaches the store only with complete audio: a pack in every language, a clip for every sentence the app reads, no stale or empty clip (manifests and clip sizes only, no clip is downloaded;
      # the same check the pull request runs in tools-selftests.yml). A book with a gap, or none in the verdict file audio-verdict.json, builds no pack and uploads nothing (build --live skips it, publish-store-books.mjs refuses it),
      # the other books still go, and the "Fail when audio is incomplete" step fails the job at the end.
      - name: Check that every book's audio is complete
        id: audiocheck
        run: |
          git lfs install --local
          status=0
          # An LFS fetch failure is an infrastructure failure, not an audio gap: status is still written (no verdict file means nothing is published) and the failing step says which.
          if git lfs pull --include "content/dino/*/audio/*/manifest.json" --exclude ""; then
            dotnet run --project tools/DinoReader.BookBuilder --configuration Release -- check-audio --verdict "$RUNNER_TEMP/audio-verdict.json" || status=$?
          else
            status=lfs
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Slice 265: the clips are Git LFS objects (.lfsconfig keeps them out of a normal checkout). Only the audio packs the live store lacks are built: `--audio-behind` lists
      # `<book> <language>` pairs, each pair's clips are fetched alone (`--exclude ""` overrides the .lfsconfig exclusion) and packed before `build` so meta.json lists the pack.
      # The zips go up before the cover, package and meta.json (publish-store-books.mjs). A book with a pack that fails to build uploads none of its new packs (staged per book); the other books go on and the job fails at the end naming the pair.
      - name: Build the audio packs the live store lacks
        id: audio
        env:
          LISTEN_BUDGET_SECONDS: '900'
        run: |
          node .github/scripts/publish-store-books.mjs --audio-behind --bucket-state "$RUNNER_TEMP/live-store.json" --audio-verdict "$RUNNER_TEMP/audio-verdict.json" > "$RUNNER_TEMP/audio-behind.txt"
          cat "$RUNNER_TEMP/audio-behind.txt"
          failed=""
          listen_failed=""
          skipped=0
          if [ -s "$RUNNER_TEMP/audio-behind.txt" ]; then
            dotnet build tools/DinoReader.BookBuilder --configuration Release
            # Slice 281: each pack also gets its listening track (build-listen joins the clips with ffmpeg and measures them with ffprobe); the runner image may not carry them. A failed install never blocks the zips, covers,
            # packages and meta.json: the tracks are then recorded as failed (the "Fail when a listening track could not be built" step fails the job at the end).
            have_ffmpeg=1
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg) || echo "::warning::ffmpeg could not be installed; no listening track is built in this run."
            fi
            if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | head -n 1; else have_ffmpeg=0; fi
            git lfs install --local
            mkdir -p artifacts/store
            started=$SECONDS
            # One book at a time into its own staging folder: its zips are copied to artifacts/store only when every pair of the book built, so a book with a failed pair uploads none of its new packs.
            # Slice 281 time budget: no new book is started once LISTEN_BUDGET_SECONDS are used (the first book always is), so the first run after the slice (a track for every live pack) fills in over several runs
            # (a push or the daily cron) and never runs into the job's timeout (60 minutes: the 15-minute build budget + the other steps, ~10 min of normal run + the live-state reads of every story, ~10 min + the uploads of the built tracks, ~10 min + margin; estimates, untimed); what was not reached stays "behind" and is built next time. Every book finished is uploaded by the publish step below.
            while IFS= read -r stem; do
              if [ $((SECONDS - started)) -ge "$LISTEN_BUDGET_SECONDS" ]; then
                skipped=$((skipped + $(grep -c "^${stem} " "$RUNNER_TEMP/audio-behind.txt")))
                continue
              fi
              stage="$RUNNER_TEMP/audio-stage/$stem"
              book_ok=1
              languages=""
              # git and dotnet get </dev/null so neither can read the list from the loop's stdin and silently skip the pairs after it.
              while read -r pair_stem language; do
                [ "$pair_stem" = "$stem" ] || continue
                if git lfs pull --include "content/dino/${stem}/audio/${language}/**" --exclude "" </dev/null \
                  && dotnet run --no-build --project tools/DinoReader.BookBuilder --configuration Release -- build-audio "$stem" --lang "$language" --out "$stage" </dev/null; then
                  echo "audio pack built: $stem $language"
                  languages="${languages:+$languages,}$language"
                else
                  echo "::error::The audio pack of $stem [$language] could not be built."
                  failed="$failed $stem/$language"
                  book_ok=0
                  break
                fi
              done < "$RUNNER_TEMP/audio-behind.txt"
              # The listening tracks of the book's built languages, one process (the story is built once). A track that fails never holds back its zip: the zip, cover, package and meta.json go up without the track's length,
              # the error is named here and the job fails at the end.
              if [ "$book_ok" = 1 ] && [ -n "$languages" ]; then
                if [ "$have_ffmpeg" = 1 ]; then
                  dotnet run --no-build --project tools/DinoReader.BookBuilder --configuration Release -- build-listen "$stem" --lang "$languages" --out "$stage" </dev/null \
                    || listen_failed="$listen_failed $stem/$languages"
                else
                  listen_failed="$listen_failed $stem/$languages(ffmpeg missing)"
                fi
              fi
              if [ "$book_ok" = 1 ] && [ -d "$stage" ]; then
                cp -r "$stage/." artifacts/store/
              fi
            done < <(cut -d' ' -f1 "$RUNNER_TEMP/audio-behind.txt" | sort -u)
            echo "Audio packs not reached in this run's time budget (built by the next run): ${skipped}"
            echo "- audio packs not reached in this run's time budget (built by the next run): ${skipped}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          echo "listen_failed=${listen_failed# }" >> "$GITHUB_OUTPUT"
          # No retry loop. A failed book is left out here (publish-store-books.mjs prunes its unbuilt packs from meta.json), every other book still builds and uploads, and the always() step below fails the job at the end.

      # Exit 0 = all built, 2 = some invalid book skipped (the others built), anything else = a broken build: nothing is uploaded then.
      - name: Build the store books
        id: build
        run: |
          status=0
          dotnet run --project tools/DinoReader.BookBuilder --configuration Release -- build --live "$RUNNER_TEMP/live-store.json" 2> >(tee "$RUNNER_TEMP/build-errors.txt" >&2) || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # --delist on every run, so a delisting is never lost when a pending run is replaced: the script delists only pipeline-managed ids (live contentHash) with no content folder at all, refuses more than 3 or half the live list, and an invalid book is skipped, not delisted.
      - name: Upload the books that are behind the live store, delist the ones whose content folder is gone
        if: steps.build.outputs.status == '0' || steps.build.outputs.status == '2'
        run: node .github/scripts/publish-store-books.mjs --delist --bucket-state "$RUNNER_TEMP/live-store.json" --audio-verdict "$RUNNER_TEMP/audio-verdict.json"

      - name: Check that no built book is still behind
        if: steps.build.outputs.status == '0' || steps.build.outputs.status == '2'
        run: |
          node .github/scripts/publish-store-books.mjs --verify

      - name: Fail when a book's audio is incomplete
        if: always() && steps.audiocheck.outputs.status != '' && steps.audiocheck.outputs.status != '0'
        env:
          STATUS: ${{ steps.audiocheck.outputs.status }}
        run: |
          if [ "$STATUS" = lfs ]; then
            echo "::error::git lfs pull of the audio manifests failed, so no audio verdict exists and nothing was uploaded: an infrastructure failure, not an audio gap. Rerun the job."
            exit 1
          fi
          echo "::error::The audio check exited ${STATUS}: books without a complete audio verdict were not uploaded (the others were); the gaps are listed in the check step above. Run BookBuilder check-audio for the missing sentences."
          exit 1

      - name: Fail when an audio pack could not be built
        if: always() && steps.audio.outputs.failed != ''
        env:
          FAILED: ${{ steps.audio.outputs.failed }}
        run: |
          echo "::error::These audio packs could not be built (that book uploaded none of its new packs; the other books were built and uploaded): ${FAILED}"
          exit 1

      - name: Fail when a listening track could not be built
        if: always() && steps.audio.outputs.listen_failed != ''
        env:
          FAILED: ${{ steps.audio.outputs.listen_failed }}
        run: |
          echo "::error::These listening tracks could not be built (their audio packs and books were uploaded without the track, the next run builds them again; '(ffmpeg missing)' = ffmpeg or ffprobe could not be installed): ${FAILED}"
          exit 1

      - name: Fail when a store book was skipped as invalid
        if: always() && steps.build.outputs.status != '0'
        env:
          STATUS: ${{ steps.build.outputs.status }}
        run: |
          grep '^::error::store book' "$RUNNER_TEMP/build-errors.txt" || true
          echo "::error::The store build exited ${STATUS:-without running}: a book was skipped as invalid (exit 2; see the ::error:: lines of the build step for its name) or the build broke."
          exit 1
