name: ios

# iOS build (Slice 48, Decision 70; split out of build.yml by Slice 70).
# `dotnet publish`, not xcodebuild. Entry points:
#   * pull_request (own paths) / workflow_dispatch: the unsigned simulator
#     compile check (macOS minutes cost ~10x Linux, so nothing more).
#   * workflow_call from release-rtst.yml with `sign` = true (release-draft reports
#     the six iOS signing secrets exist and has a draft to fill): builds the
#     signed App Store .ipa and uploads it to the draft release; release-rtst.yml's
#     testflight-submit sends it to App Store Connect after the publish.
# Signing material lives in a temp keychain removed in an `always()` step.
# Zero Actions artifacts (Batch 8): don't add actions/upload-artifact for build outputs.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Sirous.Reading.Domain/**'
      - 'src/Sirous.Reading.Application/**'
      - 'src/Sirous.Reading.Documents/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'src/SherpaOnnxVersion.props'
      - 'GitVersion.yml'
      - '.gitattributes'
      - '.github/workflows/release-shared.yml'
      - '.github/workflows/release-rtst.yml'
      - '.github/workflows/tests.yml'
      - '.github/scripts/find-release.sh'
      - '.github/scripts/ship-targets.mjs'
      - 'src/ReadTheStupidText.Mobile/**'
      - '!src/ReadTheStupidText.Mobile/Platforms/**'
      - 'src/ReadTheStupidText.Mobile/Platforms/iOS/**'
      - 'src/Sirous.Reading.Mobile.Shared/**'
      - '!src/Sirous.Reading.Mobile.Shared/Platforms/**'
      - 'src/Sirous.Reading.Mobile.Shared/Platforms/iOS/**'
      - '.github/scripts/ios-signing.sh'
      - '.github/scripts/testflight-upload.sh'
      - '.github/workflows/ios.yml'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'GitVersion SemVer (x.y.z) for the signed release build.'
        required: false
        type: string
        default: ''
      sign:
        description: 'Build the signed .ipa and upload it to the draft v<version>.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 90   # a stuck release build ends after 90 min (user, 2026-11-02)
    runs-on: macos-26
    permissions:
      contents: write   # gh release upload (release runs only)
    env:
      # Signed only when the release is being cut: on PRs, or when the version was
      # already published, the output would be discarded and the secrets needlessly
      # exposed.
      SIGN_RELEASE: ${{ inputs.sign == true }}
      PUBLISH_DIR: src/ReadTheStupidText.Mobile/bin/Release/net10.0-ios/ios-arm64/publish
      PROJECT: src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj
      VERSION: ${{ inputs.version }}
    steps:
      # No LFS: the iOS package carries no voice model (Slice 50).
      - name: Checkout
        uses: actions/checkout@v4

      # iOS pins the SDK feature band its workload set needs (see the workload step).
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      # On macOS the csproj multi-targets android + ios, and restore evaluates every
      # target, so it would demand the Android workload. Both dotnet calls below pass
      # -p:IncludeAndroid=false, which the csproj honours by dropping net10.0-android, so
      # only maui-ios is needed. (A plain -p:TargetFrameworks=net10.0-ios would also flow
      # into the referenced class libraries and break their restore.)
      # Each .NET iOS SDK requires one Xcode version. The latest manifests (iOS SDK
      # 27.x) need Xcode 27, which macos-26 doesn't have, so the workload is pinned
      # to workload set 10.0.401 (Microsoft.iOS.Sdk 26.5.10318, needs Xcode 26.6 —
      # the image's default, selected explicitly). A workload set only works with an
      # SDK of its feature band, hence dotnet-version 10.0.401 above. Moving to a
      # newer iOS SDK means bumping both together, and the Xcode when the image has it.
      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install the .NET MAUI iOS workload (pinned)
        run: |
          set -euo pipefail
          dotnet --version
          dotnet workload install maui-ios --version 10.0.401
          dotnet workload --version

      # Simulator build: needs no certificate or profile. Skipped when the signed
      # publish below runs, which compiles the same code in Release. Debug on
      # purpose: a Release simulator build runs the full trim/AOT pipeline (~59
      # min per PR); Debug proves the code compiles in a few minutes, and every
      # main build still does the full signed Release compile.
      - name: Compile check (unsigned, simulator)
        if: ${{ env.SIGN_RELEASE != 'true' }}
        run: >
          dotnet build "$PROJECT"
          -f net10.0-ios
          -p:IncludeAndroid=false
          -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64

      - name: Install signing certificate and profile
        id: signing
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash .github/scripts/ios-signing.sh install

      # CFBundleShortVersionString = this product's version. CFBundleVersion must
      # only ever go up per version: a UTC timestamp (yyyymmdd.hhmmss, no leading
      # zeros), as Lets Call Mom does. Key and profile go in via env so their
      # spaces and parentheses need no quoting inside the command.
      - name: Release build (signed .ipa)
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          CODESIGN_KEY: ${{ steps.signing.outputs.codesign_key }}
          CODESIGN_PROVISION: ${{ steps.signing.outputs.codesign_provision }}
        run: |
          # Slice 252 item 3 (measure only): -v:n -clp:PerformanceSummary prints per-target and per-task
          # times; they go into the job summary, also when the build fails. No build setting changes.
          set -o pipefail
          NOW=$(date -u +%Y%m%d%H%M%S)
          BUILD="${NOW:0:8}.$((10#${NOW:8:6}))"
          BUILD_LOG="$RUNNER_TEMP/ios-release-build.log"
          START=$SECONDS
          rc=0
          dotnet publish "$PROJECT" \
            -f net10.0-ios \
            -p:IncludeAndroid=false \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$CODESIGN_PROVISION" \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion="$BUILD" \
            -v:n -clp:PerformanceSummary 2>&1 | tee "$BUILD_LOG" || rc=$?
          {
            echo "### Signed Release build timing (Slice 252)"
            echo "Elapsed: $((SECONDS - START)) s, exit code ${rc}"
            echo '```'
            awk '/Target Performance Summary/{s=1;n=0} /Task Performance Summary/{s=2;n=0} s&&n<60{print;n++}' "$BUILD_LOG" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "Built ${VERSION} (${BUILD})" >> "$GITHUB_STEP_SUMMARY"

      # Decision 70: look inside the package, a clean build proves nothing about
      # which native binaries landed (the Android .so lesson). Listing only.
      - name: Stage the .ipa and list its native contents
        if: ${{ env.SIGN_RELEASE == 'true' }}
        run: |
          set -euo pipefail
          found=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*.ipa')
          if [ "$(printf '%s\n' "$found" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly 1 .ipa in $PUBLISH_DIR, found: ${found:-none}"; exit 1
          fi
          mkdir -p dist
          cp "$found" "dist/ReadTheStupidText-${VERSION}.ipa"
          unzip -l "dist/ReadTheStupidText-${VERSION}.ipa" | grep -E 'Frameworks/|[.]dylib|[.]a$' || echo "No Frameworks/ or dylib entries in the .ipa."

      - name: Upload .ipa to the draft release
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Slice 252 item 4: a network blip must not throw away a 50-minute build; retry with back-off.
          for attempt in 1 2 3 4 5; do
            if gh release upload "rtst-v${VERSION}" "dist/ReadTheStupidText-${VERSION}.ipa" --repo "${{ github.repository }}" --clobber; then
              echo "Upload succeeded on attempt ${attempt}"; exit 0
            fi
            echo "::warning::Upload attempt ${attempt} failed"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 30))
          done
          echo "::error::Upload failed after 5 attempts"; exit 1

      - name: Remove signing material
        if: ${{ always() && env.SIGN_RELEASE == 'true' }}
        run: bash .github/scripts/ios-signing.sh cleanup || true
