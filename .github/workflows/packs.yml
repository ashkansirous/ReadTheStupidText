name: packs

# Publishes language packs (Slice 50, Decisions 60-62; multilingual voices in Slice 51,
# Decision 63) as assets of a dedicated `packs-<n>` GitHub release, separate from the app's
# `v<x.y.z>` releases. Manual only: packs change rarely and must never ride on an app
# build. Release assets don't count toward the Actions storage quota, and this uploads no
# Actions artifacts (Decision 52).
#
# Why this can't disturb app versioning:
#   * GitVersion.yml / GitVersion.dino.yml set tag-prefix rtst-v / dino-v, so only those
#     <prefix><semver> tags are versions; `packs-1` does not parse as one.
#   * release.yml's base-tag lookup (ship-targets.mjs) only matches rtst-v* / dino-v* tags.
#   * the release is created with --latest=false, so releases/latest stays the app.
# Details and the pack format: docs/voice-packs.md.
#
# Four voice packs are built into one release and listed in one packs.json:
#   * supertonic-3  from the LFS model in the repo (en, fr, es, pt, ru, ja, ar, da, fi, sv, nl, de)
#   * piper-fa      four Piper fa_IR voices (ganji_adabi, the default, ganji, mana, gyro),
#                   each with its own model folder (Slice 89). Three come from the sherpa-onnx
#                   `tts-models` release, sha256-pinned; mana has no sherpa build, so its
#                   upstream onnx is pinned, given sherpa's Piper metadata and int8-quantized
#                   here the way sherpa's piper export does. It carries the GPL-3.0
#                   espeak-ng data, which therefore exists only inside this pack's zip,
#                   never in the repo, the MSIX, the AAB or the .ipa (Decision 63).
#   * piper-nb      one Piper no_NO voice (nvcc, ten speakers, CC0) as a bokmal (nb) pack (Slice 104).
#                   The upstream onnx is pinned by revision and sha256, given sherpa's Piper metadata
#                   and int8-quantized here like mana. It carries the same GPL-3.0 espeak-ng data
#                   (copied from the Persian archive), only inside this pack's zip (Decision 108).
#   * melo-zh-en    MeloTTS Chinese + English (MIT), same download and pin.
#   * kokoro-en     Dino Reader's storyteller voices (Slice 114, Decision 118; Slice 118 adds Spanish, Portuguese
#                   and Chinese, so the pack serves en,es,pt,zh under its old id): Kokoro-82M v1.0
#                   (Apache-2.0 weights) as sherpa-onnx's int8 multi-language build, pinned by sha256, with
#                   its English lexicon, the Chinese lexicon, jieba dictionary and rule FSTs, and the GPL-3.0
#                   espeak-ng data, only inside this pack's zip (Decision 119). Its catalog kind is `storyteller`, so the text reader never picks it and an
#                   older app skips the entry. A sample wav (the "Hear one" button) rides next to the zip.
# Twenty-six translation packs (Slice 75, Decision 67; Slice 106, Decision 110; Slice 168 adds de-en and en-de; Slice 184 adds en-ja) ride in the same release and packs.json:
#   one Opus-MT (Marian) leg each, `<source>-<target>` with English at one end, so a pair like
#   fr -> ru pivots through two packs. Pre-converted int8 ONNX encoder/decoder from the Xenova
#   Hugging Face repos (CC-BY-4.0 Opus-MT weights by Helsinki-NLP), pinned to one revision and
#   sha256-checked. en-ja is the exception: Mitsua's ElanMT (CC-BY-SA-4.0) has no ONNX build on the Hub, so this
#   workflow converts it (optimum export, int8 dynamic quantisation, tool versions pinned; the Hub files that go in are
#   pinned by revision and sha256), allowed as a downloaded pack only (Slice 184). Persian (both ways) has no usable leg.
# Four OCR packs (Slice 52, Decision 65) ride in the same release and the same packs.json:
#   ocr-latin (en, fr, es, pt), ocr-cyrillic (ru), ocr-arabic (ar, fa), ocr-cjk (zh, ja).
#   Each is PaddleOCR det + rec ONNX models and a dictionary (Apache-2.0), fetched from a
#   pinned revision of the monkt/paddleocr-onnx Hugging Face repo and sha256-checked.

on:
  workflow_dispatch:
    inputs:
      release_number:
        description: 'Packs release number: publishes the tag packs-<n> (the app pins one in PackConstants.CatalogUrl)'
        required: true
        type: string
      pack_version:
        description: 'Version stamped into the Supertonic-3 pack (bump when the model files, its licence texts or its language list change; 4 adds German, Slice 168)'
        required: true
        default: '4'
        type: string
      piper_pack_version:
        description: 'Version stamped into the Persian (Piper) pack'
        required: true
        default: '2'
        type: string
      norwegian_pack_version:
        description: 'Version stamped into the Norwegian (Piper) pack'
        required: true
        default: '1'
        type: string
      melo_pack_version:
        description: 'Version stamped into the Chinese (MeloTTS) pack'
        required: true
        default: '1'
        type: string
      kokoro_pack_version:
        description: 'Version stamped into the Kokoro storyteller pack (Dino Reader: English, Spanish, Portuguese, Chinese; 2 is the first with es, pt and zh)'
        required: true
        default: '2'
        type: string
      kokoro_carry_over_from:
        description: 'Release tag (e.g. packs-7) to carry the unchanged Kokoro pack over from, byte for byte, instead of rebuilding it from the upstream archive; leave empty to build. Needs kokoro_pack_version to be that release''s version.'
        required: false
        default: ''
        type: string
      ocr_pack_version:
        description: 'Version stamped into the four PaddleOCR packs (bump when any model or dictionary changes)'
        required: true
        default: '1'
        type: string

      translation_pack_version:
        description: 'Version stamped into the twenty-six translation packs (bump when any model changes)'
        required: true
        default: '1'
        type: string

permissions:
  contents: write   # create the packs-<n> release and upload its assets

env:
  SUPERTONIC_ID: supertonic-3
  SUPERTONIC_LANGUAGES: 'en,fr,es,pt,ru,ja,ar,da,fi,sv,nl,de'
  SUPERTONIC_LICENSE: 'BigScience OpenRAIL-M (model weights) AND MIT (sample code)'
  MODEL_DIR: src/ReadTheStupidText.App/VoiceModel
  # Keep the ids in sync with src/ReadTheStupidText.Application/Reading/PackConstants.cs.
  PERSIAN_ID: piper-fa
  PERSIAN_LICENSE: 'CC0-1.0 (voice data) AND MIT (voice models) AND GPL-3.0-or-later (espeak-ng data)'
  # Slice 89: four voices in one pack. The sherpa-onnx int8 archives are pinned by sha256 (their
  # release digests); mana is built from the pinned upstream commit with sherpa-onnx's script.
  PERSIAN_RELEASE_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
  GANJI_ADABI_SHA256: 42cc4a913e9e5a703a5a5d758267dd38ae6d86b47d4defad1e826be7885b050c
  GANJI_SHA256: 2ae4658c3a69ef4f92e09d0014f4af31ca6c95e9ae417de3c34544b5e3a98120
  GYRO_SHA256: 99bd3b912261c1a87a3f7930555622b36174b3e459e6bc153ba5fc743b931d9d
  MANA_COMMIT: ad9dd8518bedf517bd7cbc9f63b8e5c844bf5bc0
  MANA_ONNX_SHA256: e390c0e74ba71fd97c49ba662ee0c6e1724b462ba2d4561698af4f564840f126
  MANA_JSON_SHA256: d102276a05436613a05e1fbad8f125abcf8f56759aaf4fd36adf216653949997
  SHERPA_SCRIPTS_COMMIT: 36342561cbc256d55ecd61c2664bb8d598760a95
  SHERPA_ADD_META_SHA256: a24b65a03e5c94c6cb1d9261bb93c197d1bede9357a2e829aabb64de1b404f42
  PERSIAN_MAX_BYTES: 104857600
  # Slice 104: one multi-speaker Piper voice, pinned to a rhasspy/piper-voices revision. The onnx sha256 is
  # its Git LFS object id. Reuses SHERPA_SCRIPTS_COMMIT / SHERPA_ADD_META_SHA256 above for the metadata.
  NORWEGIAN_ID: piper-nb
  NORWEGIAN_LICENSE: 'CC0-1.0 (voice data) AND MIT (voice model) AND GPL-3.0-or-later (espeak-ng data)'
  NORWEGIAN_COMMIT: 5041a7a49ae5b3a0f30e6837769eb03fdbb231bd
  NORWEGIAN_ONNX_SHA256: 3f51702946d9544898440a1a66906155661a9d680ee103130ff68f73360b512e
  NORWEGIAN_JSON_SHA256: 98410e911e5a9076ac4677a79b08b20f98c54f550c4388e29978f6bafa32b83d
  NORWEGIAN_MAX_BYTES: 104857600
  NORWEGIAN_SPEAKERS: 10
  # The espeak-ng data the Persian fetch step unpacks (the Piper archive), shared by the Norwegian pack.
  ESPEAK_DATA_SRC: src-models/fa-ganji_adabi/espeak-ng-data
  CHINESE_ID: melo-zh-en
  CHINESE_LICENSE: MIT
  CHINESE_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-melo-tts-zh_en.tar.bz2
  CHINESE_SHA256: e58351ed7149f290a54534538badd4077cdbe6fddc964b24d0bee870415d1514
  # Slice 114: Kokoro-82M v1.0 as sherpa-onnx's int8 multi-language archive (132 MB; model.int8.onnx 114 MB, voices.bin 28 MB,
  # 54 voices of which Dino lists the English, Spanish, Portuguese and Chinese ones, see KokoroVoiceTable.cs). Pinned by the archive's sha256 (the release digest).
  # The zip comes to about 126 MB (English only), over the 100 MB cap of the other packs, so this pack has its own cap (150 MB); the Chinese
  # lexicon, jieba dictionary and FSTs (Slice 118) add about 17 MB uncompressed, so check the size line of the run.
  # Keep the id in sync with PackConstants.StorytellerPackId, and the languages with KokoroVoiceTable.Serves.
  KOKORO_ID: kokoro-en
  KOKORO_LANGUAGES: 'en,es,pt,zh'
  KOKORO_LICENSE: 'Apache-2.0 (Kokoro-82M weights) AND GPL-3.0-or-later (espeak-ng data)'
  KOKORO_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
  KOKORO_SHA256: 4c3052abaa60943a341f193888cf6abd68787dae6ab8ae5c925a706caa247e4e
  KOKORO_MAX_BYTES: 157286400
  # PaddleOCR ONNX models (Apache-2.0), pinned to one revision of the monkt/paddleocr-onnx repo.
  # The sha256 values are the Git LFS object ids (the files' sha256) and the dictionaries' hashes.
  # Keep the ids in sync with the OCR pack ids in the Mobile app's OCR catalog tests.
  OCR_LICENSE: Apache-2.0
  OCR_BASE_URL: https://huggingface.co/monkt/paddleocr-onnx/resolve/7b02d0a30a07ba2b92ad1ff5a8941ae2c633de65
  OCR_DET_PATH: detection/v3/det.onnx
  OCR_DET_SHA256: ee40e80071ba3a320d4efda75f3e22047a7d049e9bf7bcaaf9daea23fc21b935
  OCR_LATIN_REC_SHA256: 614ffc2d6d3902d360fad7f1b0dd455ee45e877069d14c4e51a99dc4ef144409
  OCR_LATIN_DICT_SHA256: 3c0a8a79b612653c25f765271714f71281e4e955962c153e272b7b8c1d2b13ff
  OCR_CYRILLIC_REC_SHA256: dc6bf0e855247decce214ba6dae5bc135fa0ad725a5918a7fcfb59fad6c9cdee
  OCR_CYRILLIC_DICT_SHA256: 3e95f1581557162870cacdba5af91a4c6be2890710d395b0c3c7578e7ee5e6eb
  OCR_ARABIC_REC_SHA256: 7982d371612785238fd99080cff36354deaec84fdc6ff7da9c82af4243fa0c9a
  OCR_ARABIC_DICT_SHA256: 637c27c88512c22089bef927b34ada08f748dc132ac70facd68d8202384c2726
  OCR_CJK_REC_SHA256: 26fa4f47060f58e25962b9af6beaee05c8182b90e026c4ecc6db165d9dfdc38a
  OCR_CJK_DICT_SHA256: d1979e9f794c464c0d2e0b70a7fe14dd978e9dc644c0e71f14158cdf8342af1b
  # Opus-MT ONNX models (Slice 75). The pack ids and folder layout are read by
  # src/ReadTheStupidText.Infrastructure/Translation (TranslationPacks, TranslationPackFiles).
  TRANSLATION_PAIRS: 'fr-en en-fr es-en en-es pt-en en-pt zh-en en-zh ar-en en-ar ru-en en-ru ja-en en-ja da-en en-da fi-en en-fi sv-en en-sv nl-en en-nl nb-en en-nb de-en en-de'

jobs:
  publish-packs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: packs-${{ inputs.release_number }}
      SUPERTONIC_VERSION: ${{ inputs.pack_version }}
      PERSIAN_VERSION: ${{ inputs.piper_pack_version }}
      NORWEGIAN_VERSION: ${{ inputs.norwegian_pack_version }}
      CHINESE_VERSION: ${{ inputs.melo_pack_version }}
      KOKORO_VERSION: ${{ inputs.kokoro_pack_version }}
      KOKORO_CARRY_OVER_FROM: ${{ inputs.kokoro_carry_over_from }}
      OCR_VERSION: ${{ inputs.ocr_pack_version }}
      TRANSLATION_VERSION: ${{ inputs.translation_pack_version }}
    steps:
      - name: Checkout (with LFS — the voice model is LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true

      # The quantiser pins below (onnxruntime 1.23.2, matching the apps) have no wheels for the
      # runner image's newer default Python, so pin one they support.
      - name: Use Python 3.12 for the quantiser
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refuse a tag that is not packs-<number>
        run: |
          if ! [[ "$TAG" =~ ^packs-[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like packs-<number>"; exit 1
          fi

      # Layout: <id>/pack.json, <id>/LICENSE and the model files, zipped under a
      # single top-level folder. pack.json lists every payload file so the app can
      # verify an install is complete.
      - name: Build the Supertonic pack zip
        run: |
          set -euo pipefail
          mkdir -p "out/$SUPERTONIC_ID"
          # The required file set — keep in sync with the constants in
          # src/ReadTheStupidText.Domain/Reading/SupertonicFiles.cs (never `cp *`:
          # stray files must not ship, and a missing one must fail the job).
          model_files=(duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin)
          for f in "${model_files[@]}" LICENSE; do
            src="$MODEL_DIR/$f"
            if [ ! -f "$src" ]; then echo "::error::Missing required pack file $src"; exit 1; fi
            # An LFS pointer (checkout without the real objects) is a tiny text file.
            if [[ "$(head -c 24 "$src" | tr -d '\0')" == 'version https://git-lfs'* ]]; then
              echo "::error::$src is an unresolved Git LFS pointer"; exit 1
            fi
            if [ "$f" != LICENSE ] && [ "$(stat -c %s "$src")" -lt 1024 ] && [[ "$f" == *.onnx ]]; then
              echo "::error::$src is under 1 KB — not a real model file"; exit 1
            fi
            cp "$src" "out/$SUPERTONIC_ID/$f"
          done
          # The weights are BigScience OpenRAIL-M; the repo's LICENSE above is MIT for the sample code only. OpenRAIL-M asks for a copy of
          # its text, its use-based restrictions passed on, and the source (STORE.md, "Supertonic weights licence").
          cp .github/licenses/supertonic-3-OpenRAIL-M.txt "out/$SUPERTONIC_ID/LICENSE-OpenRAIL-M"
          cat > "out/$SUPERTONIC_ID/NOTICE" <<'NOTICE_TEXT'
          Supertonic-3 voice model
            Model weights: BigScience OpenRAIL-M (full text: LICENSE-OpenRAIL-M).
            Sample code: MIT (LICENSE).
            Source: https://huggingface.co/Supertone/supertonic-3

          Use restrictions (Attachment A of the OpenRAIL-M licence, summarised; the licence text governs). Do not use the model to:
            exploit or harm minors; generate or spread false information meant to harm others; impersonate or defame people;
            harass or discriminate against people; give medical advice; or make automated decisions about legal rights.
          Anyone who receives this model or a work made with it is bound by the same restrictions. Machine-generated content
          must be disclosed as such when it is published.
          NOTICE_TEXT
          files=$(printf '%s\n' "${model_files[@]}" | jq -R . | jq -s .)
          # The ten voice styles are the fixed SupertonicVoiceTable, offered for every
          # language the pack serves, so the manifest lists no voices (model only).
          jq -n --arg id "$SUPERTONIC_ID" --arg language "$SUPERTONIC_LANGUAGES" --arg version "$SUPERTONIC_VERSION" --argjson files "$files" \
            '{id: $id, kind: "voice", language: $language, version: $version, engine: "sherpa-onnx", model: "supertonic", files: $files}' \
            > "out/$SUPERTONIC_ID/pack.json"
          (cd out && zip -r -X "$SUPERTONIC_ID-$SUPERTONIC_VERSION.zip" "$SUPERTONIC_ID")
          ls -l out

      # Downloads a sherpa-onnx model archive and refuses it unless its sha256 is the pinned one.
      - name: Fetch the pinned Piper and MeloTTS models
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" sha="$2" dir="$3"
            curl -fsSL --retry 3 -o "$dir.tar.bz2" "$url"
            echo "$sha  $dir.tar.bz2" | sha256sum -c -
            mkdir -p "$dir" && tar -xjf "$dir.tar.bz2" -C "$dir" --strip-components=1
          }
          mkdir -p src-models
          fetch "$PERSIAN_RELEASE_URL/vits-piper-fa_IR-ganji_adabi-medium-int8.tar.bz2" "$GANJI_ADABI_SHA256" src-models/fa-ganji_adabi
          fetch "$PERSIAN_RELEASE_URL/vits-piper-fa_IR-ganji-medium-int8.tar.bz2" "$GANJI_SHA256" src-models/fa-ganji
          fetch "$PERSIAN_RELEASE_URL/vits-piper-fa_IR-gyro-medium-int8.tar.bz2" "$GYRO_SHA256" src-models/fa-gyro
          fetch "$CHINESE_URL" "$CHINESE_SHA256" src-models/melo-zh-en
          if [ -z "$KOKORO_CARRY_OVER_FROM" ]; then
            fetch "$KOKORO_URL" "$KOKORO_SHA256" src-models/kokoro
          fi

      # Mana (MahtaFetrat/Mana-Persian-Piper, MIT, CC0 data) has no sherpa-onnx build. Do what sherpa's
      # piper export does (scripts/piper/generate.sh.in): write tokens.txt from the phoneme map and add
      # the Piper metadata (sherpa's add_meta_data.py), then dynamic-int8 quantize (the same
      # quantize_dynamic call as sherpa's dynamic_quantization.py, without its fp16 half, whose
      # onnxmltools import has drifted). Inputs and the script are pinned by commit and sha256.
      - name: Build the Mana voice for sherpa-onnx (metadata, tokens, int8)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mana"
          mkdir -p "$work" src-models/fa-mana
          hf="https://huggingface.co/MahtaFetrat/Mana-Persian-Piper/resolve/$MANA_COMMIT"
          sherpa="https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$SHERPA_SCRIPTS_COMMIT/scripts/piper"
          get() {
            curl -fsSL --retry 3 -o "$work/$2" "$1/$2"
            echo "$3  $work/$2" | sha256sum -c -
          }
          get "$hf" fa_IR-mana-medium.onnx "$MANA_ONNX_SHA256"
          get "$hf" fa_IR-mana-medium.onnx.json "$MANA_JSON_SHA256"
          get "$sherpa" add_meta_data.py "$SHERPA_ADD_META_SHA256"
          # Pinned: the metadata and the int8 quantization depend on these versions, and the size check cannot
          # tell a bad quantization from a good one.
          python3 -m pip install --quiet onnx==1.19.1 onnxruntime==1.23.2 iso639-lang==2.6.3
          (
            cd "$work"
            python3 add_meta_data.py --name mana --kind medium --lang fa_IR
            python3 -c "from onnxruntime.quantization import QuantType, quantize_dynamic; quantize_dynamic(model_input='fa_IR-mana-medium.onnx', model_output='mana-int8.onnx', weight_type=QuantType.QUInt8)"
          )
          cp "$work/mana-int8.onnx" src-models/fa-mana/fa_IR-mana-medium.onnx
          # add_meta_data.py (sherpa, pinned) writes tokens.txt from the phoneme_id_map in the .onnx.json.
          if [ ! -s "$work/tokens.txt" ]; then echo "::error::add_meta_data.py did not write tokens.txt"; exit 1; fi
          cp "$work/tokens.txt" src-models/fa-mana/tokens.txt

      # The Persian pack: four Piper voices, one model folder each (voices/<name>/model.onnx +
      # tokens.txt), plus the one espeak-ng data folder they all phonemize with.
      # The espeak-ng data is GPL-3.0; it ships ONLY in this downloaded zip (Decision 63),
      # with its licence text and the link to its corresponding source.
      - name: Build the Persian (Piper) pack zip
        run: |
          set -euo pipefail
          dest="out/$PERSIAN_ID"
          mkdir -p "$dest"
          copy_voice() {
            local name="$1" src="src-models/fa-$1" out="$dest/voices/$1"
            mkdir -p "$out"
            for pair in "fa_IR-$name-medium.onnx model.onnx" "tokens.txt tokens.txt"; do
              read -r from to <<< "$pair"
              if [ ! -e "$src/$from" ]; then echo "::error::Missing $from for voice $name"; exit 1; fi
              cp "$src/$from" "$out/$to"
            done
            if [ "$(stat -c %s "$out/model.onnx")" -lt 1048576 ]; then echo "::error::$name model.onnx is not a real model"; exit 1; fi
          }
          for voice in ganji_adabi ganji mana gyro; do copy_voice "$voice"; done
          if [ ! -d src-models/fa-ganji_adabi/espeak-ng-data ]; then echo "::error::Missing espeak-ng-data in the Piper archive"; exit 1; fi
          cp -r src-models/fa-ganji_adabi/espeak-ng-data "$dest/espeak-ng-data"
          cat > "$dest/LICENSE" <<'LICENSE_TEXT'
          Persian voices: ganji_adabi, ganji, mana, gyro (Piper, medium; one folder each under voices/)
            ganji_adabi: model MIT (rhasspy/piper-voices), voice data CC0 1.0 Universal.
              Fine-tuned from ganji.
            ganji: model MIT (rhasspy/piper-voices), voice data CC0 1.0 Universal
              (https://datacula.com/tts-databases ; per the Piper MODEL_CARD). Fine-tuned from amir.
            mana: model MIT (https://huggingface.co/MahtaFetrat/Mana-Persian-Piper), voice data CC0 1.0
              Universal (https://huggingface.co/datasets/MahtaFetrat/Mana-TTS, released by the
              Nasl-e-Mana magazine).
            gyro: model MIT (https://huggingface.co/gyroing/Persian-Piper-Model-gyro), voice data CC0 1.0
              Universal (Kaggle: magnoliasis/persian-tts-dataset-male).
            Attribution: ganji descends from amir, trained on the Apache-2.0 dataset
              SadeghK/datacula-pertts-amir (https://huggingface.co/datasets/SadeghK/datacula-pertts-amir);
              the Apache-2.0 attribution is kept here for that reason.
            Converted for sherpa-onnx by https://github.com/k2-fsa/sherpa-onnx (Apache-2.0); mana was
            given the same metadata and int8 quantization with sherpa-onnx's scripts/piper.

          espeak-ng data (folder espeak-ng-data): GPL-3.0-or-later
            Copyright the espeak-ng authors. This data is used only to turn text into
            phonemes and is distributed in this pack under the GNU General Public License
            v3 or later (https://www.gnu.org/licenses/gpl-3.0.html). Its corresponding
            source code is available at https://github.com/espeak-ng/espeak-ng .
          LICENSE_TEXT
          cat > "$dest/SOURCE" <<SOURCE_TEXT
          Voices ganji_adabi, ganji, gyro (sherpa-onnx int8 builds): $PERSIAN_RELEASE_URL/vits-piper-fa_IR-<voice>-medium-int8.tar.bz2
          Voice mana: https://huggingface.co/MahtaFetrat/Mana-Persian-Piper (commit $MANA_COMMIT), prepared with
            https://github.com/k2-fsa/sherpa-onnx/tree/$SHERPA_SCRIPTS_COMMIT/scripts/piper
          Piper voices: https://huggingface.co/rhasspy/piper-voices/tree/main/fa/fa_IR
          espeak-ng source: https://github.com/espeak-ng/espeak-ng
          SOURCE_TEXT
          # Every file present except pack.json itself, so the app can verify an install is complete.
          files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
          # ganji_adabi first: it is the default voice. Each model is single-speaker (sid 0).
          voices='[
            {"id": "piper:fa-ganji-adabi", "name": "Ganji Adabi", "sid": 0, "model": "voices/ganji_adabi"},
            {"id": "piper:fa-ganji", "name": "Ganji", "sid": 0, "model": "voices/ganji"},
            {"id": "piper:fa-mana", "name": "Mana", "sid": 0, "model": "voices/mana"},
            {"id": "piper:fa-gyro", "name": "Gyro", "sid": 0, "model": "voices/gyro"}
          ]'
          jq -n --arg id "$PERSIAN_ID" --arg version "$PERSIAN_VERSION" --argjson files "$files" --argjson voices "$voices" \
            '{id: $id, kind: "voice", language: "fa", version: $version, engine: "sherpa-onnx", model: "vits", voices: $voices, files: $files}' \
            > "$dest/pack.json"
          (cd out && zip -r -X "$PERSIAN_ID-$PERSIAN_VERSION.zip" "$PERSIAN_ID")
          ls -l out
          if [ "$(stat -c %s "out/$PERSIAN_ID-$PERSIAN_VERSION.zip")" -gt "$PERSIAN_MAX_BYTES" ]; then
            echo "::error::The Persian pack zip is over 100 MB"; exit 1
          fi

      # Norwegian (rhasspy/piper-voices no_NO-nvcc-medium, MIT model, CC0 data): no sherpa-onnx build, so
      # prepare it like Mana above (metadata, tokens.txt, dynamic int8). Pinned by commit and sha256.
      - name: Build the Norwegian voice for sherpa-onnx (metadata, tokens, int8)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/nvcc"
          mkdir -p "$work" src-models/nb-nvcc
          hf="https://huggingface.co/rhasspy/piper-voices/resolve/$NORWEGIAN_COMMIT/no/no_NO/nvcc/medium"
          sherpa="https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$SHERPA_SCRIPTS_COMMIT/scripts/piper"
          get() {
            curl -fsSL --retry 3 -o "$work/$2" "$1/$2"
            echo "$3  $work/$2" | sha256sum -c -
          }
          get "$hf" no_NO-nvcc-medium.onnx "$NORWEGIAN_ONNX_SHA256"
          get "$hf" no_NO-nvcc-medium.onnx.json "$NORWEGIAN_JSON_SHA256"
          get "$sherpa" add_meta_data.py "$SHERPA_ADD_META_SHA256"
          python3 -m pip install --quiet onnx==1.19.1 onnxruntime==1.23.2 iso639-lang==2.6.3
          (
            cd "$work"
            python3 add_meta_data.py --name nvcc --kind medium --lang no_NO
            python3 -c "from onnxruntime.quantization import QuantType, quantize_dynamic; quantize_dynamic(model_input='no_NO-nvcc-medium.onnx', model_output='nvcc-int8.onnx', weight_type=QuantType.QUInt8)"
          )
          cp "$work/nvcc-int8.onnx" src-models/nb-nvcc/model.onnx
          if [ ! -s "$work/tokens.txt" ]; then echo "::error::add_meta_data.py did not write tokens.txt"; exit 1; fi
          cp "$work/tokens.txt" src-models/nb-nvcc/tokens.txt

      # The Norwegian pack: one model folder holding ten speakers (sid 0-9, the speaker_id_map of the
      # upstream .onnx.json), plus the espeak-ng data from the Persian archive. The data is GPL-3.0 and
      # ships ONLY in this downloaded zip (Decision 108), with its licence text and source link.
      - name: Build the Norwegian (Piper) pack zip
        run: |
          set -euo pipefail
          dest="out/$NORWEGIAN_ID"
          mkdir -p "$dest/voices/nvcc"
          cp src-models/nb-nvcc/model.onnx src-models/nb-nvcc/tokens.txt "$dest/voices/nvcc/"
          if [ "$(stat -c %s "$dest/voices/nvcc/model.onnx")" -lt 1048576 ]; then echo "::error::nvcc model.onnx is not a real model"; exit 1; fi
          if [ ! -d "$ESPEAK_DATA_SRC" ]; then echo "::error::Missing espeak-ng-data at $ESPEAK_DATA_SRC (fetched by the Persian steps)"; exit 1; fi
          cp -r "$ESPEAK_DATA_SRC" "$dest/espeak-ng-data"
          # The Norwegian voice is espeak voice "nb": the data copied from the Persian steps must carry it (lang/gmq/nb names dictionary "no", so the file is no_dict).
          if [ ! -s "$dest/espeak-ng-data/no_dict" ] || [ -z "$(find "$dest/espeak-ng-data/lang" -type f -name nb -print -quit)" ]; then
            echo "::error::espeak-ng-data has no nb voice (needs no_dict and lang/*/nb)"; exit 1
          fi
          cat > "$dest/LICENSE" <<'LICENSE_TEXT'
          Norwegian voice: nvcc (Piper, medium, ten speakers; folder voices/nvcc)
            Model MIT (rhasspy/piper-voices), voice data CC0 1.0 Universal (Norwegian Language Bank,
            https://www.nb.no/sprakbanken/en/resource-catalogue/oai-nb-no-sbr-75/ ; per the Piper MODEL_CARD).
            Given sherpa-onnx's Piper metadata and int8 quantization with sherpa-onnx's scripts/piper
            (https://github.com/k2-fsa/sherpa-onnx, Apache-2.0).

          espeak-ng data (folder espeak-ng-data): GPL-3.0-or-later
            Copyright the espeak-ng authors. This data is used only to turn text into
            phonemes and is distributed in this pack under the GNU General Public License
            v3 or later (https://www.gnu.org/licenses/gpl-3.0.html). Its corresponding
            source code is available at https://github.com/espeak-ng/espeak-ng .
          LICENSE_TEXT
          cat > "$dest/SOURCE" <<SOURCE_TEXT
          Voice nvcc: https://huggingface.co/rhasspy/piper-voices/tree/$NORWEGIAN_COMMIT/no/no_NO/nvcc/medium, prepared with
            https://github.com/k2-fsa/sherpa-onnx/tree/$SHERPA_SCRIPTS_COMMIT/scripts/piper
          espeak-ng source: https://github.com/espeak-ng/espeak-ng
          SOURCE_TEXT
          files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
          # Speaker codes of the upstream speaker_id_map (K = woman, M = man; the app shows the gender, localised). KNN first: it is the default voice.
          # Keep the ids in sync with NorwegianVoices.cs in src/ReadTheStupidText.Application/Reading.
          voices='[
            {"id": "piper:nb-knn", "name": "KNN", "sid": 0, "model": "voices/nvcc"},
            {"id": "piper:nb-ksv", "name": "KSV", "sid": 1, "model": "voices/nvcc"},
            {"id": "piper:nb-mmn", "name": "MMN", "sid": 2, "model": "voices/nvcc"},
            {"id": "piper:nb-kon", "name": "KON", "sid": 3, "model": "voices/nvcc"},
            {"id": "piper:nb-mnn", "name": "MNN", "sid": 4, "model": "voices/nvcc"},
            {"id": "piper:nb-msv", "name": "MSV", "sid": 5, "model": "voices/nvcc"},
            {"id": "piper:nb-mon", "name": "MON", "sid": 6, "model": "voices/nvcc"},
            {"id": "piper:nb-mnv", "name": "MNV", "sid": 7, "model": "voices/nvcc"},
            {"id": "piper:nb-kmn", "name": "KMN", "sid": 8, "model": "voices/nvcc"},
            {"id": "piper:nb-knv", "name": "KNV", "sid": 9, "model": "voices/nvcc"}
          ]'
          # The hardcoded voices must be exactly the upstream speakers: same count, each code at its sid.
          speakers_json="$RUNNER_TEMP/nvcc/no_NO-nvcc-medium.onnx.json"
          if [ "$(jq '.num_speakers' "$speakers_json")" != "$NORWEGIAN_SPEAKERS" ] || [ "$(jq '.speaker_id_map | length' "$speakers_json")" != "$NORWEGIAN_SPEAKERS" ] || [ "$(jq length <<<"$voices")" != "$NORWEGIAN_SPEAKERS" ]; then
            echo "::error::The upstream nvcc voice does not have $NORWEGIAN_SPEAKERS speakers"; exit 1
          fi
          mismatch=$(jq -rn --argjson voices "$voices" --slurpfile up "$speakers_json"             '$voices[] | select(($up[0].speaker_id_map[(.id | sub("^piper:nb-"; "") | ascii_upcase)]) != .sid) | .id')
          if [ -n "$mismatch" ]; then echo "::error::Voices out of step with the upstream speaker_id_map: $mismatch"; exit 1; fi
          jq -n --arg id "$NORWEGIAN_ID" --arg version "$NORWEGIAN_VERSION" --argjson files "$files" --argjson voices "$voices" \
            '{id: $id, kind: "voice", language: "nb", version: $version, engine: "sherpa-onnx", model: "vits", voices: $voices, files: $files}' \
            > "$dest/pack.json"
          (cd out && zip -r -X "$NORWEGIAN_ID-$NORWEGIAN_VERSION.zip" "$NORWEGIAN_ID")
          ls -l out
          if [ "$(stat -c %s "out/$NORWEGIAN_ID-$NORWEGIAN_VERSION.zip")" -gt "$NORWEGIAN_MAX_BYTES" ]; then
            echo "::error::The Norwegian pack zip is over 100 MB"; exit 1
          fi

      # The Chinese pack: the upstream MeloTTS zh_en folder (file names are what
      # Domain/Reading/MeloFiles.cs expects), minus the unused int8 stub and README.
      - name: Build the Chinese (MeloTTS) pack zip
        run: |
          set -euo pipefail
          src="src-models/melo-zh-en"
          dest="out/$CHINESE_ID"
          mkdir -p "$dest"
          for f in model.onnx lexicon.txt tokens.txt date.fst number.fst phone.fst; do
            if [ ! -f "$src/$f" ]; then echo "::error::Missing $f in the MeloTTS archive"; exit 1; fi
            cp "$src/$f" "$dest/$f"
          done
          if [ ! -d "$src/dict" ]; then echo "::error::Missing dict in the MeloTTS archive"; exit 1; fi
          cp -r "$src/dict" "$dest/dict"
          for doc in LICENSE SOURCE MODEL_CARD; do
            if [ -f "$src/$doc" ]; then cp "$src/$doc" "$dest/$doc"; fi
          done
          if [ "$(stat -c %s "$dest/model.onnx")" -lt 1048576 ]; then echo "::error::model.onnx is not a real model"; exit 1; fi
          files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
          voices='[{"id": "melo:zh", "name": "Mei", "sid": 0}]'
          jq -n --arg id "$CHINESE_ID" --arg version "$CHINESE_VERSION" --argjson files "$files" --argjson voices "$voices" \
            '{id: $id, kind: "voice", language: "zh", version: $version, engine: "sherpa-onnx", model: "melo", voices: $voices, files: $files}' \
            > "$dest/pack.json"
          (cd out && zip -r -X "$CHINESE_ID-$CHINESE_VERSION.zip" "$CHINESE_ID")
          ls -l out

      # The Kokoro storyteller pack (Slice 114): the upstream int8 model stored as model.onnx (the name
      # Domain/Reading/KokoroFiles.cs expects), all 54 voices in voices.bin, the English lexicon and the espeak-ng
      # data, and (Slice 118) the Chinese lexicon, jieba dictionary and rule FSTs that the Chinese voices need (Domain/Reading/KokoroFiles.cs).
      # Spanish and Portuguese need only espeak-ng's es and pt data, which the data folder already has.
      # No voices are listed in pack.json: they live in KokoroVoiceTable.cs with their speaker ids.
      - name: Build the Kokoro (storyteller) pack zip
        if: inputs.kokoro_carry_over_from == ''
        run: |
          set -euo pipefail
          src="src-models/kokoro"
          dest="out/$KOKORO_ID"
          mkdir -p "$dest"
          cp "$src/model.int8.onnx" "$dest/model.onnx"
          for f in voices.bin tokens.txt lexicon-us-en.txt lexicon-zh.txt date-zh.fst phone-zh.fst number-zh.fst; do
            if [ ! -f "$src/$f" ]; then echo "::error::Missing $f in the Kokoro archive"; exit 1; fi
            cp "$src/$f" "$dest/$f"
          done
          if [ ! -d "$src/espeak-ng-data" ]; then echo "::error::Missing espeak-ng-data in the Kokoro archive"; exit 1; fi
          cp -r "$src/espeak-ng-data" "$dest/espeak-ng-data"
          if [ ! -s "$src/dict/jieba.dict.utf8" ]; then echo "::error::Missing the jieba dictionary (dict/) in the Kokoro archive"; exit 1; fi
          cp -r "$src/dict" "$dest/dict"
          if [ "$(stat -c %s "$dest/model.onnx")" -lt 1048576 ]; then echo "::error::model.onnx is not a real model"; exit 1; fi
          if [ ! -s "$dest/espeak-ng-data/en_dict" ] || [ -z "$(find "$dest/espeak-ng-data/lang" -type f -name en-US -print -quit)" ]; then
            echo "::error::espeak-ng-data has no en-US voice (needs en_dict and lang/*/en-US)"; exit 1
          fi
          for lang in es pt; do
            if [ ! -s "$dest/espeak-ng-data/${lang}_dict" ] || [ -z "$(find "$dest/espeak-ng-data/lang" -type f -name "$lang" -print -quit)" ]; then
              echo "::error::espeak-ng-data has no $lang voice (needs ${lang}_dict and lang/*/$lang)"; exit 1
            fi
          done
          # The Brazilian voices run with espeak voice pt-br, the Chinese ones with cmn (espeak has no "zh").
          for voice in pt-BR cmn; do
            if [ -z "$(find "$dest/espeak-ng-data/lang" -type f -iname "$voice" -print -quit)" ]; then
              echo "::error::espeak-ng-data has no $voice voice (lang/*/$voice)"; exit 1
            fi
          done
          cp "$src/LICENSE" "$dest/LICENSE-Kokoro-Apache-2.0"
          cat > "$dest/LICENSE" <<'LICENSE_TEXT'
          Kokoro storyteller voices for Dino Reader (English, Spanish, Portuguese, Chinese)
            Kokoro-82M v1.0 weights: Apache License 2.0 (https://huggingface.co/hexgrad/Kokoro-82M; the licence text is
            LICENSE-Kokoro-Apache-2.0). Converted to ONNX and int8-quantized by sherpa-onnx
            (https://github.com/k2-fsa/sherpa-onnx, Apache-2.0), archive kokoro-int8-multi-lang-v1_0.

          espeak-ng data (folder espeak-ng-data): GPL-3.0-or-later
            Copyright the espeak-ng authors. This data is used only to turn text into
            phonemes and is distributed in this pack under the GNU General Public License
            v3 or later (https://www.gnu.org/licenses/gpl-3.0.html). Its corresponding
            source code is available at https://github.com/espeak-ng/espeak-ng .
          LICENSE_TEXT
          cat > "$dest/SOURCE" <<SOURCE_TEXT
          Model, voices, tokens, lexicons, rule FSTs, jieba dictionary: $KOKORO_URL (sha256 $KOKORO_SHA256)
          Kokoro-82M: https://huggingface.co/hexgrad/Kokoro-82M
          espeak-ng source: https://github.com/espeak-ng/espeak-ng
          SOURCE_TEXT
          files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
          jq -n --arg id "$KOKORO_ID" --arg languages "$KOKORO_LANGUAGES" --arg version "$KOKORO_VERSION" --argjson files "$files" \
            '{id: $id, kind: "storyteller", language: $languages, version: $version, engine: "sherpa-onnx", model: "kokoro", files: $files}' \
            > "$dest/pack.json"
          (cd out && zip -r -X "$KOKORO_ID-$KOKORO_VERSION.zip" "$KOKORO_ID")
          ls -l out
          size=$(stat -c %s "out/$KOKORO_ID-$KOKORO_VERSION.zip")
          echo "Kokoro pack zip: $size bytes (cap $KOKORO_MAX_BYTES)"
          if [ "$size" -gt "$KOKORO_MAX_BYTES" ]; then
            echo "::error::The Kokoro pack zip is over $KOKORO_MAX_BYTES bytes"; exit 1
          fi

      # The "Hear one" sample of the cast screen, made with the pack's own files so it always matches the voices
      # (Heart narrates, Puck speaks; speaker ids from KokoroVoiceTable.cs). It sits next to the zip on the release as
      # <id>-<version>-sample.wav (StorytellerOffer.SampleFileName), is not in the catalog and is not part of the pack.
      - name: Make the Kokoro voice sample
        if: inputs.kokoro_carry_over_from == ''
        run: |
          set -euo pipefail
          python -m pip install --quiet "sherpa-onnx==1.13.3"
          python - "out/$KOKORO_ID" "out/$KOKORO_ID-$KOKORO_VERSION-sample.wav" <<'PY'
          import array, os, sys, wave
          import sherpa_onnx
          pack, target = sys.argv[1], sys.argv[2]
          kokoro = sherpa_onnx.OfflineTtsKokoroModelConfig(
              model=os.path.join(pack, "model.onnx"),
              voices=os.path.join(pack, "voices.bin"),
              tokens=os.path.join(pack, "tokens.txt"),
              lexicon=os.path.join(pack, "lexicon-us-en.txt"),
              data_dir=os.path.join(pack, "espeak-ng-data"),
          )
          tts = sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(kokoro=kokoro, num_threads=2)))
          # Self-check of the engine languages the app configures (KokoroVoiceTable.EngineLang): Brazilian Portuguese as pt-br, Spanish,
          # and Chinese as cmn with Latin-script words in the sentence (espeak "zh" fails on those). Every speaker id of
          # KokoroVoiceTable's Spanish, Portuguese and Chinese tables is synthesized (voices.bin holds 54 voices, ids 0-53).
          checks = [
              ("pt-br", (42, 43, 44), "Olá, vamos ler uma história?", False),
              ("es", (28, 29, 53), "Hola, ¿quieres leer un cuento?", False),
              ("cmn", tuple(range(45, 53)), "他叫 Bobby,住在 London。", True),
          ]
          for lang, check_sids, text, chinese in checks:
              check_kokoro = sherpa_onnx.OfflineTtsKokoroModelConfig(
                  model=os.path.join(pack, "model.onnx"),
                  voices=os.path.join(pack, "voices.bin"),
                  tokens=os.path.join(pack, "tokens.txt"),
                  lexicon=(os.path.join(pack, "lexicon-us-en.txt") + "," + os.path.join(pack, "lexicon-zh.txt")) if chinese else os.path.join(pack, "lexicon-us-en.txt"),
                  data_dir=os.path.join(pack, "espeak-ng-data"),
                  dict_dir=os.path.join(pack, "dict") if chinese else "",
                  lang=lang,
              )
              check_tts = sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(
                  model=sherpa_onnx.OfflineTtsModelConfig(kokoro=check_kokoro, num_threads=2),
                  rule_fsts=",".join(os.path.join(pack, f) for f in ("date-zh.fst", "phone-zh.fst", "number-zh.fst")) if chinese else ""))
              for check_sid in check_sids:
                  if not check_tts.generate(text, sid=check_sid, speed=1.0).samples:
                      raise SystemExit("Kokoro made no audio for lang " + lang + " sid " + str(check_sid))
          lines = [
              (3, 0.94, "Once upon a time, a little lamb found a very big, very friendly dinosaur."),
              (18, 1.0, "Hello! Will you read me a story?"),
          ]
          rate, samples = 0, []
          for sid, speed, text in lines:
              audio = tts.generate(text, sid=sid, speed=speed)
              if not audio.samples:
                  raise SystemExit("Kokoro made no audio for: " + text)
              rate = audio.sample_rate
              samples.extend(audio.samples)
              samples.extend([0.0] * (rate // 4))
          pcm = array.array("h", (max(-32768, min(32767, int(v * 32767))) for v in samples))
          with wave.open(target, "wb") as out:
              out.setnchannels(1)
              out.setsampwidth(2)
              out.setframerate(rate)
              out.writeframes(pcm.tobytes())
          print("sample", len(pcm) / rate, "seconds")
          PY
          ls -l "out/$KOKORO_ID-$KOKORO_VERSION-sample.wav"
          if [ "$(stat -c %s "out/$KOKORO_ID-$KOKORO_VERSION-sample.wav")" -gt 4000000 ]; then
            echo "::error::The sample is over 4 MB (the app refuses a larger one)"; exit 1
          fi

      # The OCR packs: det.onnx (the shared PP-OCRv3 mobile detector, 2.4 MB) + rec.onnx + dict.txt
      # per script, each zip standalone so a pack never depends on another being installed.
      # PP-OCRv5 Latin and Cyrillic (eslav) recognizers, the PP-OCRv3 Arabic one (Arabic, Persian) and
      # the PP-OCRv5 Chinese one, which also reads Japanese.
      - name: Build the OCR (PaddleOCR) pack zips
        run: |
          set -euo pipefail
          mkdir -p ocr-src
          fetch() {
            local path="$1" sha="$2" dest="$3"
            curl -fsSL --retry 3 -o "$dest" "$OCR_BASE_URL/$path"
            echo "$sha  $dest" | sha256sum -c -
          }
          fetch "$OCR_DET_PATH" "$OCR_DET_SHA256" ocr-src/det.onnx
          build_ocr() {
            local id="$1" languages="$2" folder="$3" rec_sha="$4" dict_sha="$5"
            local dest="out/$id"
            mkdir -p "$dest"
            cp ocr-src/det.onnx "$dest/det.onnx"
            fetch "languages/$folder/rec.onnx" "$rec_sha" "$dest/rec.onnx"
            fetch "languages/$folder/dict.txt" "$dict_sha" "$dest/dict.txt"
            cat > "$dest/LICENSE" <<LICENSE_TEXT
          PaddleOCR text detection and recognition models ($id)
            Copyright PaddlePaddle Authors. Licensed under the Apache License, Version 2.0
            (https://www.apache.org/licenses/LICENSE-2.0). The models are distributed as is.
            Upstream: https://github.com/PaddlePaddle/PaddleOCR
            ONNX conversion: https://huggingface.co/monkt/paddleocr-onnx (Apache-2.0)
            Pinned files: $OCR_BASE_URL
          LICENSE_TEXT
            files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
            jq -n --arg id "$id" --arg language "$languages" --arg version "$OCR_VERSION" --argjson files "$files" \
              '{id: $id, kind: "ocr", language: $language, version: $version, engine: "onnxruntime", files: $files}' \
              > "$dest/pack.json"
            (cd out && zip -r -X "$id-$OCR_VERSION.zip" "$id")
          }
          build_ocr ocr-latin "en,fr,es,pt" latin "$OCR_LATIN_REC_SHA256" "$OCR_LATIN_DICT_SHA256"
          build_ocr ocr-cyrillic ru eslav "$OCR_CYRILLIC_REC_SHA256" "$OCR_CYRILLIC_DICT_SHA256"
          build_ocr ocr-arabic "ar,fa" arabic "$OCR_ARABIC_REC_SHA256" "$OCR_ARABIC_DICT_SHA256"
          build_ocr ocr-cjk "zh,ja" chinese "$OCR_CJK_REC_SHA256" "$OCR_CJK_DICT_SHA256"
          ls -l out

      # The translation packs: one Opus-MT leg per zip (encoder.onnx, decoder.onnx, source.spm, vocab.json,
      # translation.json, LICENSE, SOURCE). The table is: pair, Hugging Face repo, pinned revision, then the
      # sha256 of the encoder, merged decoder (with key/value cache), source.spm, vocab.json, config.json, the target token a
      # multi-target model needs (">>xx<<", or "-"), the repo layout ("-" for Xenova's onnx/*_quantized.onnx, or a directory
      # such as "int8/" holding unsuffixed files) and the licence the model card declares (Xenova's repos declare none and
      # point at the CC-BY-4.0 Helsinki-NLP base; Mitsua's en-ja card says cc-by-sa-4.0 (ElanMT, Slice 184); layout "convert" means the pack's ONNX files are built here from model.safetensors (the enc column holds its sha256, the dec column is "-"); TigreGotico's cards say apache-2.0; Helsinki-NLP/opus-mt-de-en is Apache-2.0 while en-de is CC-BY-4.0, checked on the Hub; the licence is matched case-insensitively). translation.json copies the decoding ids from config.json.
      - name: Build the translation (Opus-MT) pack zips
        run: |
          set -euo pipefail
          mkdir -p tr-src
          fetch() {
            local repo="$1" rev="$2" path="$3" sha="$4" dest="$5"
            curl -fsSL --retry 3 -o "$dest" "https://huggingface.co/$repo/resolve/$rev/$path"
            echo "$sha  $dest" | sha256sum -c -
          }
          # Mitsua's ElanMT has no ONNX build: export it here exactly as the Xenova files are made (encoder plus a
          # merged decoder with key/value cache, dynamic int8). The Hub inputs are pinned by sha256 and the tools by
          # version; the converted files differ byte to byte between runs, so only the size check guards the output.
          # The decoder branches are quantised before they are merged, because the quantiser skips merged subgraphs.
          convert_marian() {
            local repo="$1" rev="$2" safetensors_sha="$3" cfg_file="$4" dest="$5"
            local work="$RUNNER_TEMP/convert-$(basename "$dest")"
            mkdir -p "$work/model" "$work/onnx"
            fetch "$repo" "$rev" model.safetensors "$safetensors_sha" "$work/model/model.safetensors"
            cp "$cfg_file" "$work/model/config.json"
            python3 -m venv "$work/venv"
            "$work/venv/bin/pip" install --quiet --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple               torch==2.8.0 "optimum[onnxruntime]==1.27.0" transformers==4.53.3 onnx==1.18.0 onnxruntime==1.22.0               numpy==2.5.4 huggingface-hub==0.36.2 sentencepiece==0.2.0 safetensors==0.8.0 tokenizers==0.21.4
            "$work/venv/bin/optimum-cli" export onnx --model "$work/model" --task text2text-generation-with-past --opset 17 "$work/onnx"
            cat > "$work/quantize.py" <<'QUANTIZE_PY'
          import sys
          from onnxruntime.quantization import QuantType, quantize_dynamic
          from optimum.onnx import merge_decoders
          onnx_dir = sys.argv[1]
          for name in ("encoder_model", "decoder_model", "decoder_with_past_model"):
              quantize_dynamic(model_input=f"{onnx_dir}/{name}.onnx", model_output=f"{onnx_dir}/{name}_q.onnx", weight_type=QuantType.QUInt8)
          merge_decoders(f"{onnx_dir}/decoder_model_q.onnx", f"{onnx_dir}/decoder_with_past_model_q.onnx", save_path=f"{onnx_dir}/decoder_merged_q.onnx", strict=False)
          QUANTIZE_PY
            "$work/venv/bin/python" -I "$work/quantize.py" "$work/onnx"
            cp "$work/onnx/encoder_model_q.onnx" "$dest/encoder.onnx"
            cp "$work/onnx/decoder_merged_q.onnx" "$dest/decoder.onnx"
          }
          # Guards the converted pair (Slice 184): sane int8 sizes, then a greedy translation of one sentence that must
          # contain Japanese. Needs source.spm, vocab.json and the config beside the ONNX files; removes the convert dir.
          check_converted() {
            local dest="$1" cfg="$2" work="$RUNNER_TEMP/convert-$(basename "$1")"
            local enc_mb=$(( $(stat -c %s "$dest/encoder.onnx") / 1048576 )) dec_mb=$(( $(stat -c %s "$dest/decoder.onnx") / 1048576 ))
            { [ "$enc_mb" -ge 25 ] && [ "$enc_mb" -le 50 ] && [ "$dec_mb" -ge 40 ] && [ "$dec_mb" -le 80 ]; } \
              || { echo "::error::converted $dest sizes out of range: encoder ${enc_mb} MB (25-50), decoder ${dec_mb} MB (40-80)"; exit 1; }
            cat > "$work/smoke.py" <<'SMOKE_PY'
          import json, re, sys
          import numpy as np, onnxruntime as ort, sentencepiece as spm
          dest, cfg_path = sys.argv[1], sys.argv[2]
          cfg = json.load(open(cfg_path))
          vocab = json.load(open(f"{dest}/vocab.json"))
          inverse = {i: p for p, i in vocab.items()}
          sp = spm.SentencePieceProcessor(model_file=f"{dest}/source.spm")
          ids = [vocab.get(p, vocab["<unk>"]) for p in sp.encode("Where is the nearest train station?", out_type=str)] + [cfg["eos_token_id"]]
          enc = ort.InferenceSession(f"{dest}/encoder.onnx")
          dec = ort.InferenceSession(f"{dest}/decoder.onnx")
          mask = np.ones((1, len(ids)), dtype=np.int64)
          hidden = enc.run(None, {"input_ids": np.array([ids], dtype=np.int64), "attention_mask": mask})[0]
          heads, head_dim = cfg["decoder_attention_heads"], cfg["d_model"] // cfg["decoder_attention_heads"]
          out = [cfg["decoder_start_token_id"]]
          for _ in range(40):
              feed = {"input_ids": np.array([out], dtype=np.int64), "encoder_attention_mask": mask, "encoder_hidden_states": hidden,
                      "use_cache_branch": np.array([False])}
              for i in dec.get_inputs():
                  if i.name.startswith("past_key_values"):
                      feed[i.name] = np.zeros((1, heads, 0, head_dim), dtype=np.float32)
              logits = dec.run(["logits"], feed)[0][0, -1].copy()
              logits[cfg["pad_token_id"]] = -np.inf
              nxt = int(logits.argmax())
              if nxt == cfg["eos_token_id"]:
                  break
              out.append(nxt)
          text = "".join(inverse.get(i, "") for i in out[1:]).replace("▁", " ")
          print("smoke output:", text)
          sys.exit(0 if re.search(r"[぀-ヿ一-鿿]", text) else 1)
          SMOKE_PY
            "$work/venv/bin/python" -I "$work/smoke.py" "$dest" "$cfg" \
              || { echo "::error::converted $dest produced no Japanese for the smoke sentence"; exit 1; }
            rm -rf "$work"
          }
          build_translation() {
            local pair="$1" repo="$2" rev="$3" enc="$4" dec="$5" spm="$6" vocab="$7" cfg="$8" token="$9" layout="${10}" license="${11}"
            local id="translation-$pair" source="${pair%-*}" target="${pair#*-}"
            local dest="out/$id" owner="${repo%%/*}" dir="" enc_file=onnx/encoder_model_quantized.onnx dec_file=onnx/decoder_model_merged_quantized.onnx
            # The Norwegian pair has no Xenova conversion: TigreGotico's export of the multi-language
            # Helsinki-NLP gmq models keeps everything under int8/ with unsuffixed file names. Its "int8"
            # merged decoder is really fp32 (no quantized ops, ~337 MB), so the zip is ~390 MB (Slice 106).
            if [ "$layout" != "-" ] && [ "$layout" != convert ]; then
              dir="$layout"; enc_file="${dir}encoder_model.onnx"; dec_file="${dir}decoder_model_merged.onnx"
            fi
            # A convert row has no decoder hash (the dec column is "-"); every other row needs a real sha.
            if [ "$layout" = convert ] && [ "$dec" != "-" ]; then echo "::error::$id is a convert row but has a decoder sha"; exit 1; fi
            if [ "$layout" != convert ] && ! [[ "$dec" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::$id needs a 64-hex decoder sha"; exit 1; fi
            mkdir -p "$dest"
            fetch "$repo" "$rev" "${dir}config.json" "$cfg" "tr-src/$pair-config.json"
            if [ "$layout" = convert ]; then
              convert_marian "$repo" "$rev" "$enc" "tr-src/$pair-config.json" "$dest"
            else
              fetch "$repo" "$rev" "$enc_file" "$enc" "$dest/encoder.onnx"
              fetch "$repo" "$rev" "$dec_file" "$dec" "$dest/decoder.onnx"
            fi
            fetch "$repo" "$rev" "${dir}source.spm" "$spm" "$dest/source.spm"
            fetch "$repo" "$rev" "${dir}vocab.json" "$vocab" "$dest/vocab.json"
            if [ "$layout" = convert ]; then check_converted "$dest" "tr-src/$pair-config.json"; fi
            if [ "$token" = "-" ]; then token=""; fi
            printf '%s' "$license" > "tr-src/$pair.license"
            jq -e '(.max_length // .max_position_embeddings) != null' "tr-src/$pair-config.json" > /dev/null \
              || { echo "::error::$id config.json has neither max_length nor max_position_embeddings"; exit 1; }
            jq --arg source "$source" --arg target "$target" --arg token "$token" \
              '{source: $source, target: $target, targetToken: (if $token == "" then null else $token end),
                decoderStartTokenId: .decoder_start_token_id, eosTokenId: .eos_token_id,
                padTokenId: .pad_token_id, maxLength: (.max_length // .max_position_embeddings)}' "tr-src/$pair-config.json" > "$dest/translation.json"
            case "${license,,}" in
              cc-by-4.0) license_url="https://creativecommons.org/licenses/by/4.0/" ;;
              apache-2.0) license_url="https://www.apache.org/licenses/LICENSE-2.0" ;;
              mit) license_url="https://opensource.org/license/mit" ;;
              cc-by-sa-4.0) license_url="https://creativecommons.org/licenses/by-sa/4.0/" ;;
              *) echo "::error::$id has an unknown licence $license"; exit 1 ;;
            esac
            if [ "${license,,}" = "cc-by-sa-4.0" ]; then
              # ElanMT (Slice 184): not an Opus-MT model, and ShareAlike applies to the model files, so the text says so.
              cat > "$dest/LICENSE" <<LICENSE_TEXT
          ElanMT translation model $source to $target (Marian, ONNX)
            Credit: Mitsua Inc. / ElanMT (https://huggingface.co/$repo),
            licensed under $license ($license_url).
            Changes: converted to ONNX and int8-quantised by this project's packs workflow.
            ShareAlike: the model files in this pack, and any adaptation of them, stay under $license.
            This licence covers the model only; the app that downloads it keeps its own licence.
            Pinned source files: https://huggingface.co/$repo/tree/$rev
          LICENSE_TEXT
            else
              cat > "$dest/LICENSE" <<LICENSE_TEXT
          Opus-MT translation model $source to $target (Marian, ONNX)
            Model weights and SentencePiece data: Copyright the Helsinki-NLP / OPUS-MT authors
            (upstream licence $license, $license_url).
            Licence declared by the converted model card: $license. Changes: converted to ONNX
            ($owner, https://huggingface.co/$repo); the encoder and merged decoder files are as
            published there (int8 for the Xenova repos; for TigreGotico the encoder is int8 and
            the merged decoder is effectively fp32).
            Upstream: https://github.com/Helsinki-NLP/Opus-MT
            Pinned files: https://huggingface.co/$repo/tree/$rev
          LICENSE_TEXT
            fi
            printf 'Model: https://huggingface.co/%s (revision %s)\n' "$repo" "$rev" > "$dest/SOURCE"
            if [ "$(stat -c %s "$dest/encoder.onnx")" -lt 1048576 ] || [ "$(stat -c %s "$dest/decoder.onnx")" -lt 1048576 ]; then
              echo "::error::$id model files are not real models"; exit 1
            fi
            files=$(cd "$dest" && find . -type f ! -path ./pack.json -printf '%P\n' | sort | jq -R . | jq -s .)
            jq -n --arg id "$id" --arg language "$pair" --arg version "$TRANSLATION_VERSION" --argjson files "$files" \
              '{id: $id, kind: "translation", language: $language, version: $version, engine: "onnxruntime", files: $files}' \
              > "$dest/pack.json"
            (cd out && zip -r -X "$id-$TRANSLATION_VERSION.zip" "$id")
            rm -rf "$dest"
          }
