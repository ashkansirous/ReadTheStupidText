          if [ "$(wc -l <<<"$table")" -ne "$(wc -w <<<"$TRANSLATION_PAIRS")" ]; then
            echo "::error::the translation table and TRANSLATION_PAIRS list different pairs"; exit 1
          fi
          for pair in $TRANSLATION_PAIRS; do
            row=$(grep -E "^$pair " <<<"$table") || { echo "::error::no table row for $pair"; exit 1; }
            read -r _ repo rev enc dec spm vocab cfg token <<<"$row"
            build_translation "$pair" "$repo" "$rev" "$enc" "$dec" "$spm" "$vocab" "$cfg" "$token"
          done
          ls -l out

      - name: Write packs.json
        run: |
          set -euo pipefail
          entry() {
            local id="$1" language="$2" version="$3" license="$4" kind="${5:-voice}"
            local zip="out/$id-$version.zip"
            local size sha url
            size=$(stat -c %s "$zip")
            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            url="https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$zip")"
            jq -n --arg id "$id" --arg language "$language" --arg kind "$kind" --arg version "$version" \
                  --argjson size "$size" --arg sha "$sha" --arg license "$license" --arg url "$url" \
              '{id: $id, language: $language, kind: $kind, version: $version, sizeBytes: $size, sha256: $sha, license: $license, url: $url}'
          }
          {
            entry "$SUPERTONIC_ID" "$SUPERTONIC_LANGUAGES" "$SUPERTONIC_VERSION" "$SUPERTONIC_LICENSE"
            entry "$PERSIAN_ID" fa "$PERSIAN_VERSION" "$PERSIAN_LICENSE"
            entry "$CHINESE_ID" zh "$CHINESE_VERSION" "$CHINESE_LICENSE"
            entry ocr-latin "en,fr,es,pt" "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-cyrillic ru "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-arabic "ar,fa" "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-cjk "zh,ja" "$OCR_VERSION" "$OCR_LICENSE" ocr
            for pair in $TRANSLATION_PAIRS; do
              entry "translation-$pair" "$pair" "$TRANSLATION_VERSION" "$TRANSLATION_LICENSE" translation
            done
          } | jq -s . > out/packs.json
          cat out/packs.json

      # Not latest: releases/latest must keep pointing at the app release.
      - name: Publish the packs release
        run: |
          set -euo pipefail
          translation_zips=()
          for pair in $TRANSLATION_PAIRS; do translation_zips+=("out/translation-$pair-$TRANSLATION_VERSION.zip"); done
          gh release create "$TAG" \
            "out/$SUPERTONIC_ID-$SUPERTONIC_VERSION.zip" \
            "out/$PERSIAN_ID-$PERSIAN_VERSION.zip" \
            "out/$CHINESE_ID-$CHINESE_VERSION.zip" \
            "out/ocr-latin-$OCR_VERSION.zip" \
            "out/ocr-cyrillic-$OCR_VERSION.zip" \
            "out/ocr-arabic-$OCR_VERSION.zip" \
            "out/ocr-cjk-$OCR_VERSION.zip" \
            "${translation_zips[@]}" \
            out/packs.json \
            --repo "${{ github.repository }}" \
            --title "Language packs $TAG" \
            --notes "Voice, OCR and translation language packs and their packs.json catalog (not an app release). See docs/voice-packs.md." \
            --latest=false
