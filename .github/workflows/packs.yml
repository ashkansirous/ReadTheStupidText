          TABLE
          )
          # TRANSLATION_PAIRS (env) is the one list: the table must have exactly one row per pair in it.
          if [ "$(wc -l <<<"$table")" -ne "$(wc -w <<<"$TRANSLATION_PAIRS")" ]; then
            echo "::error::the translation table and TRANSLATION_PAIRS list different pairs"; exit 1
          fi
          while read -r line; do
            if [ "$(wc -w <<<"$line")" -ne 11 ]; then
              echo "::error::translation table row does not have 11 columns: ${line%% *}"; exit 1
            fi
          done <<<"$table"
          for pair in $TRANSLATION_PAIRS; do
            row=$(grep -E "^$pair " <<<"$table") || { echo "::error::no table row for $pair"; exit 1; }
            read -r _ repo rev enc dec spm vocab cfg token layout license <<<"$row"
            build_translation "$pair" "$repo" "$rev" "$enc" "$dec" "$spm" "$vocab" "$cfg" "$token" "$layout" "$license"
          done
          ls -l out

      # A pack whose upstream source changed but whose content must not (so users keep their install) is carried over
      # from an earlier packs release instead of being rebuilt: its zip (and sample, when it has one) are downloaded
      # from that release, checked against the digest GitHub recorded for the asset and against the sha256 and
      # version in that release's packs.json, and its catalog entry is kept (only the url moves to this release).
      # Today only Kokoro has an input for it (kokoro_carry_over_from); add another pack by calling carry_over.
      - name: Carry over unchanged packs from an earlier release
        run: |
          set -euo pipefail
          mkdir -p out carried
          carry_over() {
            local id="$1" version="$2" from="$3" sample="$4"
            local zip="$id-$version.zip" assets name want
            if ! [[ "$from" =~ ^packs-[0-9]+$ ]]; then echo "::error::carry-over source '$from' must look like packs-<number>"; exit 1; fi
            assets=$(gh release view "$from" --repo "${{ github.repository }}" --json assets)
            names=("$zip")
            if [ "$sample" = sample ]; then names+=("$id-$version-sample.wav"); fi
            for name in "${names[@]}"; do
              want=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest // empty' <<<"$assets")
              if [ -z "$want" ]; then echo "::error::$from has no asset $name with a recorded digest"; exit 1; fi
              gh release download "$from" --repo "${{ github.repository }}" --pattern "$name" --dir out --clobber
              echo "${want#sha256:}  out/$name" | sha256sum -c -
            done
            gh release download "$from" --repo "${{ github.repository }}" --pattern packs.json --dir carried --clobber
            jq -e --arg id "$id" --arg version "$version" --arg sha "$(sha256sum "out/$zip" | cut -d' ' -f1)"                   --argjson size "$(stat -c %s "out/$zip")"               '[.[] | select(.id == $id)] | length == 1 and .[0].version == $version and .[0].sha256 == $sha and .[0].sizeBytes == $size'               carried/packs.json > /dev/null               || { echo "::error::$from packs.json does not describe $zip (id, version, sha256, size)"; exit 1; }
            jq --arg id "$id" --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$zip"               '.[] | select(.id == $id) | .url = $url' carried/packs.json > "carried/$id.json"
            echo "Carried $zip over from $from"
          }
          if [ -n "$KOKORO_CARRY_OVER_FROM" ]; then
            carry_over "$KOKORO_ID" "$KOKORO_VERSION" "$KOKORO_CARRY_OVER_FROM" sample
          fi
          ls -l out

      - name: Write packs.json
        run: |
          set -euo pipefail
          entry() {
            local id="$1" language="$2" version="$3" license="$4" kind="${5:-voice}"
            local zip="out/$id-$version.zip"
            if [ -f "carried/$id.json" ]; then cat "carried/$id.json"; return; fi
            local size sha url
            size=$(stat -c %s "$zip")
            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            url="https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$zip")"
            jq -n --arg id "$id" --arg language "$language" --arg kind "$kind" --arg version "$version" \
                  --argjson size "$size" --arg sha "$sha" --arg license "$license" --arg url "$url" \
              '{id: $id, language: $language, kind: $kind, version: $version, sizeBytes: $size, sha256: $sha, license: $license, url: $url}'
          }
          {
            entry "$SUPERTONIC_ID" "$SUPERTONIC_LANGUAGES" "$SUPERTONIC_VERSION" "$SUPERTONIC_LICENSE"
            entry "$PERSIAN_ID" fa "$PERSIAN_VERSION" "$PERSIAN_LICENSE"
            entry "$NORWEGIAN_ID" nb "$NORWEGIAN_VERSION" "$NORWEGIAN_LICENSE"
            entry "$CHINESE_ID" zh "$CHINESE_VERSION" "$CHINESE_LICENSE"
            entry "$KOKORO_ID" "$KOKORO_LANGUAGES" "$KOKORO_VERSION" "$KOKORO_LICENSE" storyteller
            entry ocr-latin "en,fr,es,pt" "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-cyrillic ru "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-arabic "ar,fa" "$OCR_VERSION" "$OCR_LICENSE" ocr
            entry ocr-cjk "zh,ja" "$OCR_VERSION" "$OCR_LICENSE" ocr
            for pair in $TRANSLATION_PAIRS; do
              entry "translation-$pair" "$pair" "$TRANSLATION_VERSION" "$(cat "tr-src/$pair.license")" translation
            done
          } | jq -s . > out/packs.json
          cat out/packs.json

      # Not latest: releases/latest must keep pointing at the app release.
      - name: Publish the packs release
        run: |
          set -euo pipefail
          translation_zips=()
          for pair in $TRANSLATION_PAIRS; do translation_zips+=("out/translation-$pair-$TRANSLATION_VERSION.zip"); done
          gh release create "$TAG" \
            "out/$SUPERTONIC_ID-$SUPERTONIC_VERSION.zip" \
            "out/$PERSIAN_ID-$PERSIAN_VERSION.zip" \
            "out/$NORWEGIAN_ID-$NORWEGIAN_VERSION.zip" \
            "out/$CHINESE_ID-$CHINESE_VERSION.zip" \
            "out/$KOKORO_ID-$KOKORO_VERSION.zip" \
            "out/$KOKORO_ID-$KOKORO_VERSION-sample.wav" \
            "out/ocr-latin-$OCR_VERSION.zip" \
            "out/ocr-cyrillic-$OCR_VERSION.zip" \
            "out/ocr-arabic-$OCR_VERSION.zip" \
            "out/ocr-cjk-$OCR_VERSION.zip" \
            "${translation_zips[@]}" \
            out/packs.json \
            --repo "${{ github.repository }}" \
            --title "Language packs $TAG" \
            --notes "Voice, OCR and translation language packs and their packs.json catalog (not an app release). See docs/voice-packs.md." \
            --latest=false
