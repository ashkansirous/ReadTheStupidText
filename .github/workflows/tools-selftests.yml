name: tools-selftests

# Slice 212: the device-test tooling's own self-tests (no device, no Maestro). A separate workflow on purpose:
# editing tests.yml would ship every app (it is a core path in ship-targets.mjs), and this file is in no build group.
# Pull requests only: release.yml is the only workflow that runs on push to main. No upload-artifact.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - '.maestro/**'
      - '.github/workflows/tools-selftests.yml'
      - 'PSScriptAnalyzerSettings.psd1'
      # Slice 272: the Dino audio alignment check below. The `scope` job keeps the Windows self-tests off these paths.
      - 'src/DinoReader.Core/**'
      - 'src/ReadTheStupidText.Application/**'
      - 'src/DinoReader.App/StoryVoicing.cs'
      - 'content/dino/**'

permissions:
  contents: read

concurrency:
  group: tools-selftests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Slice 272: which of the two checks below the change needs, so a Core or content change does not start the Windows self-tests and a tools change does not fetch LFS manifests.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tooling: ${{ steps.scope.outputs.tooling }}
      audio: ${{ steps.scope.outputs.audio }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide which checks apply
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          if echo "$changed" | grep -qE '^(tools/|\.maestro/|\.github/workflows/tools-selftests\.yml$|PSScriptAnalyzerSettings\.psd1$)'; then echo "tooling=true" >> "$GITHUB_OUTPUT"; else echo "tooling=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -qE '^(src/DinoReader\.Core/|src/ReadTheStupidText\.Application/|src/DinoReader\.App/StoryVoicing\.cs$|tools/DinoReader\.BookBuilder/|content/dino/|\.github/workflows/tools-selftests\.yml$)'; then echo "audio=true" >> "$GITHUB_OUTPUT"; else echo "audio=false" >> "$GITHUB_OUTPUT"; fi

  # Slice 272: every Dino pre-made audio manifest must hash the sentences the app reads now, position by position (Slice 255 changed the count and eight Farsi packs silently stopped fitting).
  # Only the manifest.json files are fetched from Git LFS (about 240 small files), never a clip.
  audio-alignment:
    needs: scope
    if: needs.scope.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # Slice 353: one SDK pin for every job

      - name: Fetch the audio manifests from Git LFS
        run: git lfs pull --include "content/dino/*/audio/*/manifest.json" --exclude ""

      - name: Check that every audio manifest lines up with the sentences the app reads
        run: dotnet run --project tools/DinoReader.BookBuilder --configuration Release -- check-audio

  # Slice 215: one job, two shells (pwsh = PowerShell 7, powershell = Windows PowerShell 5.1), instead of two copies of the same steps.
  selftests:
    needs: scope
    if: needs.scope.outputs.tooling == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Flow lint self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-lint-flows.ps1

      - name: Lint the Maestro flows (${{ matrix.shell }})
        run: ./tools/emulator/lint-flows.ps1

      - name: Emulator lease self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-lease.ps1

      - name: Device-test speed self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-speed.ps1

      - name: Emulator -NoBuild and tablet instance self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-no-build.ps1

      - name: Emulator build-key self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-build-key.ps1

      - name: Dialog guard and closure-scope self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-dialog-guard.ps1

      - name: Screenshot contact sheet self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-contact-sheet.ps1

      - name: Worktree run mark self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-worktree-mark.ps1

      - name: Desktop check dry-run self-test (${{ matrix.shell }})
        run: ./tools/desktop-vm/test-check-dryrun.ps1

      - name: Detached background start self-test (${{ matrix.shell }})
        run: ./tools/test-detached-process.ps1

      - name: Activity limit and emulator health self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-activity.ps1

      - name: test-targets self-test (${{ matrix.shell }})
        run: ./tools/test-test-targets.ps1

      - name: Phone library self-test (${{ matrix.shell }})
        run: ./tools/phone/test-phone-lib.ps1

      - name: Phone tap self-test (${{ matrix.shell }})
        run: ./tools/phone/test-tap.ps1

      - name: Phone quoting self-test (${{ matrix.shell }})
        run: ./tools/phone/test-quoting.ps1

      - name: Phone timing self-test (${{ matrix.shell }})
        run: ./tools/phone/test-timing.ps1

      - name: Phone leftovers self-test (${{ matrix.shell }})
        run: ./tools/phone/test-phone-leftovers.ps1

      # Slice 320: the run-checks runner's pure helpers (notification flags, Dino prepare/book-end) and the host stubs a flow's `# needs:` asks for (starts a real stub from the setup-node Node on a free port).
      - name: Run-checks runner self-test (${{ matrix.shell }})
        run: ./tools/phone/test-run-checks.ps1

      - name: Flow host stub self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-need-stubs.ps1

      - name: Desktop crash-evidence self-test (${{ matrix.shell }})
        run: ./tools/desktop-vm/test-crash-evidence.ps1

      - name: Desktop test memory guard self-test (${{ matrix.shell }})
        run: ./tools/desktop-vm/test-memory-guard.ps1

      - name: Layout check self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-layout-check.ps1

      - name: Log marker self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-log-marker.ps1

      - name: Switch-parameter assignment self-test (${{ matrix.shell }})
        run: ./tools/test-switch-param-assign.ps1

      # Slice 315: Maestro's tmp<digits>.apk cleanup (item 1), no duplicate function names in tools/phone (item 27), the CI-form runner (item 7).
      - name: Maestro temp APK cleanup self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-maestro-temp-apks.ps1

      - name: Phone duplicate function name self-test (${{ matrix.shell }})
        run: ./tools/phone/test-duplicate-functions.ps1

      - name: CI-form runner self-test (${{ matrix.shell }})
        run: ./tools/test-run-selftests-ci-form.ps1

      # Slice 225 item 17: PowerShell lint. PSScriptAnalyzer is installed on demand; PSScriptAnalyzerSettings.psd1 holds the baseline (rules that fire by design are off).
      # Any Error-level finding and any parse error (checked with the shell's own parser, so PowerShell 7-only syntax fails the Windows PowerShell 5.1 leg) fails the job, except the one baseline
      # entry: that rule in that one file (the VM password helper reads a local secret). Warnings are annotated, not failing.
      - name: PowerShell lint (${{ matrix.shell }})
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $baseline = @(@{ Rule = 'PSAvoidUsingConvertToSecureStringWithPlainText'; Script = 'tools/desktop-vm/_common.ps1' })
          $newErrors = 0
          foreach ($file in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $relative = ((Resolve-Path -Relative $file.FullName) -replace '^\.[\\/]', '') -replace '\\', '/'
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) {
              Write-Host "::error file=$relative,line=$($parseError.Extent.StartLineNumber)::ParseError: $($parseError.Message)"
              $newErrors++
            }
            foreach ($finding in Invoke-ScriptAnalyzer -Path $file.FullName -Settings ./PSScriptAnalyzerSettings.psd1) {
              if ($finding.Severity -eq 'ParseError') { continue }   # counted above
              if ($finding.Severity -ne 'Error') { Write-Host "::warning file=$relative,line=$($finding.Line)::$($finding.RuleName): $($finding.Message)"; continue }
              $known = @($baseline | Where-Object { $_.Rule -eq $finding.RuleName -and $_.Script -eq $relative }).Count -gt 0
              if ($known) { Write-Host "baseline error kept: $($finding.RuleName) in $relative line $($finding.Line)"; continue }
              Write-Host "::error file=$relative,line=$($finding.Line)::$($finding.RuleName): $($finding.Message)"
              $newErrors++
            }
          }
          if ($newErrors -gt 0) { Write-Host "$newErrors new PSScriptAnalyzer error(s)."; exit 1 }
          Write-Host 'PSScriptAnalyzer: no new error-level finding.'
