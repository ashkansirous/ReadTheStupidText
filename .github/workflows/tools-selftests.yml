name: tools-selftests

# Slice 212: the device-test tooling's own self-tests (no device, no Maestro). A separate workflow on purpose:
# editing tests.yml would ship every app (it is a core path in ship-targets.mjs), and this file is in no build group.
# Pull requests only: release.yml is the only workflow that runs on push to main. No upload-artifact.

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - '.maestro/**'
      - '.github/workflows/tools-selftests.yml'

permissions:
  contents: read

concurrency:
  group: tools-selftests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Slice 215: one job, two shells (pwsh = PowerShell 7, powershell = Windows PowerShell 5.1), instead of two copies of the same steps.
  selftests:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Flow lint self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-lint-flows.ps1

      - name: Lint the Maestro flows (${{ matrix.shell }})
        run: ./tools/emulator/lint-flows.ps1

      - name: Emulator lease self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-lease.ps1

      - name: Activity limit and emulator health self-test (${{ matrix.shell }})
        run: ./tools/emulator/test-activity.ps1

      - name: test-targets self-test (${{ matrix.shell }})
        run: ./tools/test-test-targets.ps1

      - name: Phone library self-test (${{ matrix.shell }})
        run: ./tools/phone/test-phone-lib.ps1

      - name: Phone tap self-test (${{ matrix.shell }})
        run: ./tools/phone/test-tap.ps1

      - name: Phone quoting self-test (${{ matrix.shell }})
        run: ./tools/phone/test-quoting.ps1

      - name: Phone timing self-test (${{ matrix.shell }})
        run: ./tools/phone/test-timing.ps1

      - name: Phone leftovers self-test (${{ matrix.shell }})
        run: ./tools/phone/test-phone-leftovers.ps1
