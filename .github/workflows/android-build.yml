name: android-build

# Builds the MAUI Android project (Batch 6) in parallel to build.yml/
# store-submit.yml, mirroring the same trust model (Decision 18/42): CI signs
# with an upload key, Google Play App Signing re-signs with its own managed
# key for actual distribution, so no release-signing secret ever leaves CI.
#
#   1. version — same GitVersion derivation as build.yml (git tags are the
#                source of truth); the Android versionCode is derived from
#                the numeric major/minor/patch so it only ever increases.
#   2. test    — same unit-test gate as build.yml; gates the build job.
#   3. build   — always produces an unsigned debug build (the actual compile
#                check — this alone catches "does the Mobile project still
#                build" regardless of secrets). The signed release .aab/.apk
#                steps only run once ANDROID_SIGNING_KEYSTORE_BASE64 exists
#                (HAS_SIGNING) — the .aab is what Play Store publishing needs,
#                the .apk is a separate signed publish of the same build for
#                anyone who wants to sideload it directly (adb install / tap
#                to install) instead of going through the Play Store; both are
#                uploaded as workflow artifacts. The Play internal-testing
#                upload only runs once PLAY_SERVICE_ACCOUNT_JSON also exists
#                (HAS_PLAY_PUBLISHING) AND on a push to main — both are no-ops
#                until then, so this workflow is safe to merge before either
#                secret is set up. Play Console also requires the very first
#                release on a track to be uploaded by hand once through the
#                UI — a one-time API limitation, not something this workflow
#                can route around.
#
# See Decision 39/42 and Slice 34 in plan.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      versionCode: ${{ steps.versioncode.outputs.code }}
    steps:
      - name: Checkout (full history + tags — GitVersion needs them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true

      # Android versionCode must be a positive, monotonically increasing
      # integer — a bare "x.y.z" string doesn't qualify. Packing
      # major*10000 + minor*100 + patch keeps it strictly increasing as long
      # as the SemVer itself only increases (true here: main only bumps
      # forward, see GitVersion.yml), without needing a separately tracked
      # counter.
      - name: Derive Android versionCode
        id: versioncode
        run: |
          CODE=$(( ${{ steps.gitversion.outputs.major }} * 10000 + ${{ steps.gitversion.outputs.minor }} * 100 + ${{ steps.gitversion.outputs.patch }} ))
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/ReadTheStupidText.Tests/ReadTheStupidText.Tests.csproj --configuration Release

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    # Repo default is read-only (`default_workflow_permissions: read`) — the
    # artifact-cleanup step below needs actions:write to DELETE old
    # artifacts via the REST API. contents:read covers checkout.
    permissions:
      contents: read
      actions: write
    env:
      # `secrets` isn't allowed inside a step `if:` condition directly — only
      # `env:` context can reference it there — so both gates are computed
      # once here as plain booleans.
      HAS_SIGNING: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_PUBLISHING: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout (with LFS — the neural voice model is LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # maui-android, not bare "android": a fresh CLI-only SDK install (this
      # runner) needs the MAUI-specific workload pieces on top of the Android
      # platform workload, which a VS-provisioned dev machine already has
      # installed alongside "android" — confirmed by the actual CI failure
      # (NETSDK1147: "workloads must be installed: maui-android") after
      # "android" alone built fine locally.
      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      # Always runs, no secrets needed — the actual compile check: does the
      # Mobile project still build (Domain/Application reuse, the
      # AndroidNativeLibrary items, the MauiAsset model bundle, all of it).
      - name: Debug build (unsigned)
        run: dotnet build src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj -f net10.0-android -c Debug

      - name: Decode upload keystore
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload.keystore"

      # AAB — the format Google Play requires for anything beyond direct
      # sideloading. env: is deliberately NOT used for AndroidSigningKeyPass/
      # AndroidSigningStorePass here: that indirection is documented as
      # unsupported once AndroidPackageFormat=aab, so the passwords are
      # passed as plain -p: MSBuild properties instead (still never echoed —
      # GitHub Actions masks any step output matching a registered secret
      # value automatically).
      - name: Release build (signed .aab)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: >
          dotnet publish src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=aab
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }}
          -p:ApplicationVersion=${{ needs.version.outputs.versionCode }}
          -p:AndroidKeyStore=True
          -p:AndroidSigningKeyStore="${{ runner.temp }}/upload.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

      - name: Upload signed .aab artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReadTheStupidText-${{ needs.version.outputs.version }}.aab
          path: src/ReadTheStupidText.Mobile/bin/Release/net10.0-android/publish/*-Signed.aab
          if-no-files-found: error
          # Each signed .aab/.apk pair here averages ~360MB — several times
          # the account's entire 500MB free Actions+Packages storage
          # allowance on its own, so *any* standing retention risks
          # recurring the 2026-09-26 quota-lock incident (224 artifacts,
          # 64.65GB, going back weeks with no cap at all) unless builds are
          # genuinely short-lived. Belt-and-suspenders alongside the
          # "Clean up old build artifacts" job below.
          retention-days: 2

      # APK — the format for manual sideloading (the .aab above only Google
      # Play can install; it can't be adb-installed or tapped-to-install on a
      # device). Same signed publish, just AndroidPackageFormat=apk instead of
      # aab, so anyone can grab this artifact and install it directly without
      # going through the Play Store.
      - name: Release build (signed .apk)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: >
          dotnet publish src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }}
          -p:ApplicationVersion=${{ needs.version.outputs.versionCode }}
          -p:AndroidKeyStore=True
          -p:AndroidSigningKeyStore="${{ runner.temp }}/upload.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

      - name: Upload signed .apk artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReadTheStupidText-${{ needs.version.outputs.version }}.apk
          path: src/ReadTheStupidText.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 2

      # main-only, mirroring build.yml's own release job — avoids
      # versionCode churn on feature branches. A no-op until
      # PLAY_SERVICE_ACCOUNT_JSON exists AND the very first release has been
      # uploaded by hand once through the Play Console UI (see the header
      # comment; a one-time API limitation, not a bug here).
      - name: Publish to Play Store (internal testing)
        if: ${{ env.HAS_SIGNING == 'true' && env.HAS_PLAY_PUBLISHING == 'true' && github.ref == 'refs/heads/main' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.sirous.readthestupidtext
          releaseFiles: src/ReadTheStupidText.Mobile/bin/Release/net10.0-android/publish/*-Signed.aab
          track: internal
          status: completed

      - name: Clean up old build artifacts
        # Keeps only the single most recent run of this workflow on main,
        # deleting the rest — 224 uncapped artifacts (64.65GB, averaging
        # ~576MB/run against a 500MB account-wide quota) went back weeks
        # with no cleanup at all, exhausting the account's Actions+Packages
        # storage and blocking every upload in every repo on the account
        # (found 2026-09-26 while debugging an unrelated repo's broken CI).
        # KEEP_RUNS=1, not a larger number: even a single run's aab+apk pair
        # already exceeds the whole 500MB free quota on its own, so keeping
        # more only guarantees recurrence — retention-days above is the
        # other half of containing that, this is defense-in-depth for
        # history beyond it. See the composite action for why this always
        # keeps this run's own artifacts regardless of a concurrent run
        # racing it.
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: ./.github/actions/cleanup-old-artifacts
        with:
          workflow-file: android-build.yml
          keep-runs: 1
