name: dinoreader

# Dino Reader's own suite (tests/Dino/DinoReader.Tests; Story Reader parser) and the book check (tools/dino/DinoReader.BookBuilder, Slice 157). Slice 128: it runs for every Dino
# target (dinoapp, dinoios, dinowin), RTST's suite (tests.yml) does not. Slice 70: split out of
# build.yml's `test-dinoreader`. Standalone: it references no ReadTheStupidText
# project, so it runs on its own cheap Linux runner. It gates build-dinoapp/-dinoios/-dinowin
# (success or skipped) but is not in the needs of release-publish: a Dino-only push tests but
# never versions or releases. Its PR paths are the union of every Dino target (a few, e.g.
# Infrastructure, cannot change what the suite covers; that redundancy is accepted).
# Slice 239, 265: nothing under content/dino/ starts it (a book's text, pictures and Git LFS audio clips run only dino-store.yml); no PR check at all for a book's folder.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Shared/Sirous.Reading.Domain/**'
      - 'src/Shared/Sirous.Reading.Application/**'
      - 'src/Shared/Sirous.Reading.Documents/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'src/Shared/SherpaOnnxVersion.props'
      - 'GitVersion.yml'
      - 'GitVersion.dino.yml'
      - '.gitattributes'
      - '.github/workflows/release-shared.yml'
      - '.github/workflows/release-dino.yml'
      - '.github/workflows/tests.yml'
      - '.github/scripts/find-release.sh'
      - '.github/scripts/ship-targets.mjs'
      - 'src/Dino/DinoReader.Core/**'
      - 'tests/Dino/DinoReader.Tests/**'
      - 'tools/dino/DinoReader.BookBuilder/**'
      - 'src/Dino/DinoReader.App/**'
      - 'src/Shared/Sirous.Reading.Mobile.Shared/**'
      - '!src/Shared/Sirous.Reading.Mobile.Shared/Platforms/**'
      - 'src/Shared/Sirous.Reading.Mobile.Shared/Platforms/Android/**'
      - 'src/Shared/Sirous.Reading.Mobile.Shared/Platforms/iOS/**'
      - 'src/Shared/Sirous.Reading.Mobile.Shared/Platforms/Windows/**'
      - 'src/Shared/Sirous.Reading.Mobile.Shared/IosSherpaPackaging.props'
      - 'src/Shared/Sirous.Reading.Infrastructure/**'
      - 'src/Shared/AndroidSherpaPackaging.props'
      - 'src/Shared/AndroidRelease.props'
      - 'src/Shared/AndroidProguard.cfg'
      - '.github/scripts/stage-android-package.sh'
      - '.github/scripts/check-android-natives.sh'
      - '.github/scripts/ios-signing.sh'
      - '.github/scripts/testflight-upload.sh'
      - '.github/scripts/check-ios-bundle.sh'
      - '.github/workflows/store-submit.yml'
      - '.github/workflows/dinoreader-android.yml'
      - '.github/workflows/dinoreader-ios.yml'
      - '.github/workflows/dinoreader-windows.yml'
      - '.github/workflows/dinoreader.yml'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dinoreader-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `BookBuilder check` compares each book's version with the merge base with origin/main

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # Slice 353: one SDK pin for every job

      - name: Run Dino Reader core tests
        run: dotnet test tests/Dino/DinoReader.Tests/DinoReader.Tests.csproj --configuration Release

      # Slice 157: a book changed without a version bump, or a committed starter is stale, fails here.
      - name: Check the Dino books
        run: dotnet run --project tools/dino/DinoReader.BookBuilder --configuration Release -- check
