name: store-submit

# Submits a released MSIX to the Microsoft Store via the msstore CLI.
#
# AUTOMATIC: release.yml calls this as a reusable workflow (workflow_call) from
# its own `store-submit` job, right after cutting a new release when Windows-specific
# paths changed (Decision 44; the `windowsstore` ship-targets output), with no manual
# step. It runs as a job *inside* release.yml's run rather than this workflow
# reacting to a `release: published` event, because release.yml creates the
# release with the default GITHUB_TOKEN, and GitHub never lets a
# GITHUB_TOKEN-triggered event start ANOTHER workflow run (its recursion
# guard) — an `on: release:` trigger here would silently never fire. See the
# comment on release.yml's `store-submit` job.
#
# `msstore publish` (see the last step) discards any still-pending draft
# submission and creates a fresh one from the newest package each time it
# runs (documented CLI behavior), so a burst of quick releases just
# collapses to the latest one reaching certification, never an old one
# racing ahead of a newer version.
#
# workflow_dispatch stays available for a manual re-run (e.g. retrying a
# failed submission) — product_id is required (STORE_PRODUCT_ID for ReadTheStupidText.App, the
# Dino app id for DinoReader.App); a tag is optional, omit it to resubmit the latest release.
#
# The app is published and live in the Store (product 9NGT1BN1H92V), so the
# Actions-based msstore flow — which does *updates* to an already-live free
# product — is usable. It needs, configured once in repo Settings -> Secrets
# and variables -> Actions (see STORE.md):
#   - Secrets:  AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#               AZURE_AD_APPLICATION_SECRET, SELLER_ID
#   - Variable: STORE_PRODUCT_ID  (already set to 9NGT1BN1H92V; release.yml passes it as
#               product_id, and the guard step compares the package against it)
# Without the secrets the "Configure Store credentials" step fails fast.
#
# This is an *individual* Partner Center account, which ships with no Microsoft
# Entra tenant — so AZURE_AD_TENANT_ID does not exist until one is created (free,
# from Partner Center -> Account settings -> Tenants). See STORE.md for the
# one-time tenant + app-registration + Manager-role walkthrough.

# Dino Reader (Slice 67) reuses this workflow: release.yml's `store-submit-dino` job passes
# package = DinoReader.App and product_id = vars.DINOREADER_STORE_APP_ID (and only runs when that
# variable is set). The same AZURE_AD_* / SELLER_ID secrets serve both listings: they are the
# developer account's, not the app's.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v1.0.0).'
        required: true
        type: string
      package:
        description: 'MSIX package name stem: <package>_<x.y.z.0>_<arch>.msix.'
        required: false
        type: string
        default: 'ReadTheStupidText.App'
      product_id:
        description: 'Store product (app) id. Required, no fallback: the caller passes its own app id.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v1.0.0). Leave blank to submit the latest release.'
        required: false
      package:
        description: 'MSIX package name stem.'
        required: false
        type: choice
        options:
          - ReadTheStupidText.App
          - DinoReader.App
        default: 'ReadTheStupidText.App'
      product_id:
        description: 'Store product id (required): STORE_PRODUCT_ID for ReadTheStupidText.App, the Dino app id for DinoReader.App.'
        required: true

env:
  PACKAGE: ${{ inputs.package || 'ReadTheStupidText.App' }}

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Checkout (release scripts)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # Slice 127: the two apps must never swap listings. STORE_PRODUCT_ID is Read The Stupid Text's.
      - name: Check the product id matches the package
        shell: bash
        env:
          PRODUCT_ID: ${{ inputs.product_id }}
          RTST_ID: ${{ vars.STORE_PRODUCT_ID }}
          DINO_ID: ${{ vars.DINOREADER_STORE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT_ID" ]; then echo "::error::product_id is empty"; exit 1; fi
          if [ -z "$RTST_ID" ]; then echo "::error::vars.STORE_PRODUCT_ID is not set, so the package/id pairing cannot be checked"; exit 1; fi
          case "$PACKAGE" in
            ReadTheStupidText.App)
              if [ "$PRODUCT_ID" != "$RTST_ID" ]; then
                echo "::error::ReadTheStupidText.App must be submitted to STORE_PRODUCT_ID ($RTST_ID), not $PRODUCT_ID"; exit 1
              fi ;;
            DinoReader.App)
              if [ -z "$DINO_ID" ]; then echo "::error::vars.DINOREADER_STORE_APP_ID is not set, so the package/id pairing cannot be checked"; exit 1; fi
              if [ "$PRODUCT_ID" != "$DINO_ID" ]; then
                echo "::error::DinoReader.App must be submitted to DINOREADER_STORE_APP_ID ($DINO_ID), not $PRODUCT_ID"; exit 1
              fi ;;
            *) echo "::error::Unknown package $PACKAGE"; exit 1 ;;
          esac

      # Without an explicit tag, pick the newest published release whose MSIX
      # were built FOR that version. Android-only releases carry the previous
      # Windows build forward (Decision 57), so "latest release" alone could
      # resubmit an old package.
      - name: Resolve the tag to submit
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            found=$(bash .github/scripts/find-release.sh "^${PACKAGE//./[.]}_{version}[.]0_.*[.]msix\$")
            tag=$(head -n 1 <<< "$found")
          fi
          if [ -z "$tag" ]; then echo "::error::Could not resolve a release tag to submit"; exit 1; fi
          echo "Submitting $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the release's MSIX packages
        id: packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          gh release download "${{ steps.tag.outputs.tag }}" --repo "${{ github.repository }}" --pattern "${env:PACKAGE}_*.msix" --dir packages
          $msix = Get-ChildItem packages -Filter *.msix
          # A submission must carry BOTH architectures. One missing asset would
          # otherwise silently ship a single-arch bundle and drop ARM64 users.
          if ($msix.Count -ne 2) {
            throw "Expected 2 .msix assets (x64 + ARM64) on release ${{ steps.tag.outputs.tag }}, found $($msix.Count): $($msix.Name -join ', ')"
          }
          # The package version is the source of the *bundle* version below. Take
          # it from the asset names (<package>_<x.y.z.0>_<arch>.msix)
          # rather than the tag, so the bundle can never disagree with what CI
          # actually stamped into the manifests.
          $versions = $msix.Name | ForEach-Object {
            if ($_ -notmatch '_(\d+\.\d+\.\d+\.\d+)_') { throw "Cannot parse a package version out of '$_'" }
            $Matches[1]
          } | Select-Object -Unique
          if ($versions.Count -ne 1) { throw "Packages disagree on version: $($versions -join ', ')" }
          Write-Host "Downloaded $($msix.Count) package(s) at version $versions : $($msix.Name -join ', ')"
          "version=$versions" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Bundle x64 + ARM64 into a single .msixbundle
        shell: pwsh
        run: |
          # Both architectures must ship in ONE submission. Single-project MSIX
          # builds emit a per-arch .msix (AppxBundle=Never), so combine them into
          # one .msixbundle here and submit that once — submitting each .msix
          # separately would open competing submissions.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK on this runner" }
          New-Item -ItemType Directory -Force out | Out-Null
          # /bv is REQUIRED: without it makeappx stamps the bundle version from the
          # current date-time (documented behaviour), which neither matches the
          # release nor increases predictably across submissions. Pin it to the
          # packages' own version so the bundle tracks GitVersion.
          & $makeappx.FullName bundle /d packages /p "out\$($env:PACKAGE).msixbundle" `
            /bv ${{ steps.packages.outputs.version }} /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store credentials
        shell: pwsh
        env:
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          # The CLI does Convert.ToInt32 on the seller id, so a non-numeric value
          # (e.g. the GUID-shaped *Publisher* ID, or a quoted/CN= copy-paste) dies
          # with a bare "input string was not in a correct format" FormatException
          # and no hint about which credential is wrong. Check it here instead.
          # Never echo the value — only its shape.
          if ($env:SELLER_ID -notmatch '^\d+$') {
            throw "SELLER_ID must be the numeric Seller ID from Partner Center -> Account settings -> Identifiers (digits only). It is currently $($env:SELLER_ID.Length) char(s) and not all digits — the GUID-shaped 'Publisher ID' is a different field and will not work."
          }
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish the update to the Store
        shell: pwsh
        run: |
          # One submission carrying both architectures via the bundle.
          #
          # -uploadTimeout/-ut is REQUIRED (not just available). The action
          # installs whatever msstore-cli is currently "latest" (no version
          # pin), so it silently moved from v0.3.9 (no -ut option at all) to
          # v0.4.x, which added -ut but has a default-value bug: PublishCommand
          # only returns its intended 100s default from -ut's CustomParser when
          # the flag is present with an empty value; when -ut is omitted
          # entirely (as it was here), System.CommandLine binds the option to
          # `default(long)` = 0, so AzureBlobManager sets
          # `blobClientOptions.Retry.NetworkTimeout = TimeSpan.Zero` and every
          # upload attempt fails instantly with "Retry failed after 6 tries...
          # exceeded the configured timeout of 0:00:00" — confirmed against the
          # v0.4.1 error with -v below. 300s is comfortably above the ~3s a
          # ~500 MB bundle actually took to upload when this last worked
          # (v0.7.7, msstore-cli v0.3.9).
          #
          # -v: on an upload failure the CLI's console output is a hardcoded
          # generic "Error while uploading the application package." with the
          # real exception only reaching the logger, which -v surfaces.
          msstore publish "out\$($env:PACKAGE).msixbundle" `
            -id "${{ inputs.product_id }}" -ut 300 -v
