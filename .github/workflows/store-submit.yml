name: store-submit

# Submits a released MSIX to the Microsoft Store via the msstore CLI.
#
# MANUAL ONLY (workflow_dispatch). The app is published and live in the Store
# (product 9NGT1BN1H92V), so the Actions-based msstore flow — which does *updates*
# to an already-live free product — is now usable. To run it you need, configured
# once in repo Settings -> Secrets and variables -> Actions (see STORE.md):
#   - Secrets:  AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#               AZURE_AD_APPLICATION_SECRET, SELLER_ID
#   - Variable: STORE_PRODUCT_ID  (already set to 9NGT1BN1H92V)
# Without the secrets the "Configure Store credentials" step fails fast.
#
# This is an *individual* Partner Center account, which ships with no Microsoft
# Entra tenant — so AZURE_AD_TENANT_ID does not exist until one is created (free,
# from Partner Center -> Account settings -> Tenants). See STORE.md for the
# one-time tenant + app-registration + Manager-role walkthrough.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to submit (e.g. v1.0.0)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - name: Download the release's MSIX packages
        id: packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern "*.msix" --dir packages
          $msix = Get-ChildItem packages -Filter *.msix
          # A submission must carry BOTH architectures. One missing asset would
          # otherwise silently ship a single-arch bundle and drop ARM64 users.
          if ($msix.Count -ne 2) {
            throw "Expected 2 .msix assets (x64 + ARM64) on release ${{ inputs.tag }}, found $($msix.Count): $($msix.Name -join ', ')"
          }
          # The package version is the source of the *bundle* version below. Take
          # it from the asset names (ReadTheStupidText.App_<x.y.z.0>_<arch>.msix)
          # rather than the tag, so the bundle can never disagree with what CI
          # actually stamped into the manifests.
          $versions = $msix.Name | ForEach-Object {
            if ($_ -notmatch '_(\d+\.\d+\.\d+\.\d+)_') { throw "Cannot parse a package version out of '$_'" }
            $Matches[1]
          } | Select-Object -Unique
          if ($versions.Count -ne 1) { throw "Packages disagree on version: $($versions -join ', ')" }
          Write-Host "Downloaded $($msix.Count) package(s) at version $versions : $($msix.Name -join ', ')"
          "version=$versions" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Bundle x64 + ARM64 into a single .msixbundle
        shell: pwsh
        run: |
          # Both architectures must ship in ONE submission. Single-project MSIX
          # builds emit a per-arch .msix (AppxBundle=Never), so combine them into
          # one .msixbundle here and submit that once — submitting each .msix
          # separately would open competing submissions.
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found in the Windows SDK on this runner" }
          New-Item -ItemType Directory -Force out | Out-Null
          # /bv is REQUIRED: without it makeappx stamps the bundle version from the
          # current date-time (documented behaviour), which neither matches the
          # release nor increases predictably across submissions. Pin it to the
          # packages' own version so the bundle tracks GitVersion.
          & $makeappx.FullName bundle /d packages /p out\ReadTheStupidText.msixbundle `
            /bv ${{ steps.packages.outputs.version }} /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx bundle failed ($LASTEXITCODE)" }

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure Store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish the update to the Store
        shell: pwsh
        run: |
          # One submission carrying both architectures via the bundle.
          # -ut raises the blob-upload timeout from the CLI's 100 s default: the
          # bundle is ~500 MB (two self-contained arches, each carrying the ~145 MB
          # voice model plus the bundled .NET runtime).
          msstore publish "out\ReadTheStupidText.msixbundle" `
            -id ${{ vars.STORE_PRODUCT_ID }} -ut 3600
