name: dinoreader-windows

# Dino Reader Windows MSIX build (x64 + ARM64), Slice 67. The twin of windows.yml for the second
# MAUI app, `src/DinoReader.App` (a WinUI head: no tray, no hotkey). Entry points:
#   * pull_request (own paths) / workflow_dispatch: compiles and packages, uploads nothing.
#   * workflow_call from release.yml: the same build, plus `upload` = true when release-draft has
#     a draft to fill, which sends each MSIX straight to the draft release as
#     DinoReader.App_<v>.0_<arch>.msix. Zero Actions artifacts (Batch 8): don't add
#     actions/upload-artifact for build outputs.
# The package is unsigned (the Store re-signs) and, in Release, .NET self-contained like Read The
# Stupid Text's (Store certification 10.2.4.1). No LFS and no voice model: voices download as packs.
# The Store submission is store-submit.yml (package DinoReader.App) via release.yml, gated on DINOREADER_STORE_APP_ID.
# Without a `version` input (PR or manual run) it asks GitVersion itself so the manifest stamp is
# exercised too.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ReadTheStupidText.Domain/**'
      - 'src/ReadTheStupidText.Application/**'
      - 'src/ReadTheStupidText.Documents/**'
      - 'global.json'
      - 'GitVersion.yml'
      - 'GitVersion.dino.yml'
      - 'Directory.Build.props'
      - 'src/SherpaOnnxVersion.props'
      - '*.slnx'
      - '.gitattributes'
      - '.github/workflows/release.yml'
      - '.github/workflows/tests.yml'
      - '.github/scripts/find-release.sh'
      - '.github/scripts/ship-targets.mjs'
      - 'src/DinoReader.App/**'
      - 'src/DinoReader.Core/**'
      - 'src/ReadTheStupidText.Mobile.Shared/**'
      - '!src/ReadTheStupidText.Mobile.Shared/Platforms/**'
      - 'src/ReadTheStupidText.Mobile.Shared/Platforms/Windows/**'
      - 'src/ReadTheStupidText.Infrastructure/**'
      - '.github/workflows/dinoreader-windows.yml'
      - '.github/workflows/store-submit.yml'
      - '!**/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'GitVersion SemVer (x.y.z) to stamp. Empty: compute it here.'
        required: false
        type: string
        default: ''
      upload:
        description: 'Upload the MSIX files to the draft release v<version>.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A called run shares the caller's concurrency context, so only PR runs get a
# group that cancels; every other run is keyed by its run id and never collides.
concurrency:
  group: dinoreader-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped when release.yml passes its version in; `build` then reads the input directly.
  version:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: Checkout (full history + tags — GitVersion needs them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true
          configFilePath: GitVersion.dino.yml

  build:
    needs: version
    # `version` is skipped when the caller supplied one; !cancelled() keeps that
    # skip from cascading, and a failed `version` still stops the build.
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write   # gh release upload (release runs only)
      actions: write    # gh cache delete of a broken SDK cache entry (Slice 240)
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      PROJECT: src/DinoReader.App/DinoReader.App.csproj
      MANIFEST: src/DinoReader.App/Platforms/Windows/Package.appxmanifest
      VERSION: ${{ inputs.version || needs.version.outputs.version }}
      SDK_VERSION: '10.0.402'
      WORKLOAD_SET: '10.0.402'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Slice 240: the SDK and its MAUI workload are installed into a job-local folder and that whole
      # folder is cached, so a hit skips the 300 MB SDK download and the ~200 s workload install.
      # The SDK is installed by setup-dotnet into a custom DOTNET_INSTALL_DIR, which has no
      # metadata\workloads\<band>\installertype\msi marker, so the CLI installs the workload as plain
      # files under that root (dotnet/sdk WorkloadInstallType). SDK_VERSION and WORKLOAD_SET must
      # match each other and both are in the cache key, so moving either misses and reinstalls.
      - name: Choose the job-local dotnet folder
        shell: bash
        run: |
          # ImageOS (win25) is in the key, ImageVersion is not: on 2026-11-01 the x64 and ARM64 jobs
          # of one run got images 20261021 and 20261030, so a per-image key missed every other run.
          # The SDK root is self-contained; the validation step below catches a root that broke.
          {
            echo "DOTNET_INSTALL_DIR=${RUNNER_TEMP}\dotnet"
            echo "DOTNET_ROOT=${RUNNER_TEMP}\dotnet"
            echo "DOTNET_DIR_KEY=dotnet-${RUNNER_OS}-${ImageOS:-noimageos}-sdk${SDK_VERSION}-wl${WORKLOAD_SET}-maui-windows-v1"
          } >> "$GITHUB_ENV"

      - name: Restore the cached .NET SDK and workloads
        id: dotnet-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\dotnet
          key: ${{ env.DOTNET_DIR_KEY }}

      # A restore is trusted only if it works: dotnet.exe exists, prints the pinned version, lists
      # maui-windows (output captured first, so no pipefail/grep -q trap) and packs\ holds a
      # Microsoft.Maui pack folder (a partial restore can keep metadata and lose the packs).
      - name: Validate the restored .NET SDK
        id: dotnet-valid
        shell: bash
        run: |
          set -uo pipefail
          valid=false
          if [ -f "${DOTNET_ROOT}/dotnet.exe" ]; then
            cd "$RUNNER_TEMP"
            ver="$("${DOTNET_ROOT}/dotnet.exe" --version 2>&1 | tr -d '\r')"
            list="$("${DOTNET_ROOT}/dotnet.exe" workload list 2>&1)"
            echo "restored sdk: ${ver}"
            # cygpath: the backslashes of a Windows DOTNET_ROOT are escape characters in a glob.
            packs="$(compgen -G "$(cygpath -u "${DOTNET_ROOT}")/packs/Microsoft.Maui*" || true)"
            [ "$ver" = "$SDK_VERSION" ] || echo "SDK version mismatch: ${ver}"
            [[ "$list" == *maui-windows* ]] || echo "maui-windows missing from: ${list}"
            [ -n "$packs" ] || echo "no Microsoft.Maui pack folder"
            if [ "$ver" = "$SDK_VERSION" ] && [[ "$list" == *maui-windows* ]] && [ -n "$packs" ]; then valid=true; fi
          else
            echo "No cached dotnet.exe."
          fi
          echo "valid=${valid}" >> "$GITHUB_OUTPUT"
          if [ "$valid" = true ]; then echo "${DOTNET_ROOT}" >> "$GITHUB_PATH"; fi

      - name: Discard an unusable restored .NET folder
        if: steps.dotnet-valid.outputs.valid != 'true'
        shell: bash
        run: rm -rf "${DOTNET_ROOT}"

      - name: Set up .NET 10
        if: steps.dotnet-valid.outputs.valid != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      # A UseMaui project needs the MAUI workload even for its Windows head.
      - name: Install the .NET MAUI Windows workload
        id: workload-install
        if: steps.dotnet-valid.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          dotnet workload install maui-windows --version "$WORKLOAD_SET"
          ver="$(dotnet --version | tr -d '\r')"
          list="$(dotnet workload list)"
          echo "$list"
          [ "$ver" = "$SDK_VERSION" ] || { echo "::error::dotnet --version is ${ver}, expected ${SDK_VERSION}"; exit 1; }
          [[ "$list" == *maui-windows* ]] || { echo "::error::maui-windows missing after install"; exit 1; }
          [ -f "${DOTNET_ROOT}/dotnet.exe" ] || { echo "::error::dotnet.exe not in ${DOTNET_ROOT}"; exit 1; }

      # Shows in the run log whether iOS/Android/wasm packs were pulled (a Windows-only set is smaller).
      # Fails before any save when the workload did not land as files under the cached root
      # (packs\ empty or no Microsoft.Maui pack), so a hollow root is never cached.
      - name: Check the installed workload packs
        if: steps.dotnet-valid.outputs.valid != 'true'
        shell: bash
        run: |
          set -uo pipefail
          packs="$(ls "${DOTNET_ROOT}/packs" 2>/dev/null || true)"
          echo "$packs"
          if [ -z "$packs" ]; then echo "::error::${DOTNET_ROOT}/packs is missing or empty; the workload was not installed as files under the cached root"; exit 1; fi
          if ! grep -qi '^Microsoft\.Maui' <<< "$packs"; then echo "::error::no Microsoft.Maui pack folder in ${DOTNET_ROOT}/packs"; exit 1; fi

      # A cache entry cannot be overwritten, so after an exact hit that failed validation the broken
      # entry is deleted first and the good root is saved under the same key. A delete failure
      # (for example the entry belongs to another ref) only warns; the save then fails harmlessly.
      - name: Delete the broken .NET SDK cache entry
        if: steps.dotnet-cache.outputs.cache-hit == 'true' && steps.dotnet-valid.outputs.valid != 'true' && steps.workload-install.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete "$DOTNET_DIR_KEY" --repo ${{ github.repository }} || echo "::warning::could not delete the broken cache entry ${DOTNET_DIR_KEY}"

      # Saved right after the install, before any build runs, so no compiler or MSBuild node can hold
      # files in the folder.
      - name: Save the .NET SDK and workloads
        if: steps.workload-install.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}\dotnet
          key: ${{ env.DOTNET_DIR_KEY }}

      # Per architecture: the runtime packs differ for x64 and ARM64. Only the projects the Dino
      # Windows build restores are hashed, so an unrelated project edit does not start a new entry.
      - name: Restore NuGet packages cache
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.platform }}-dinowin-${{ hashFiles('src/DinoReader.App/*.csproj', 'src/DinoReader.Core/*.csproj', 'src/ReadTheStupidText.Domain/*.csproj', 'src/ReadTheStupidText.Application/*.csproj', 'src/ReadTheStupidText.Documents/*.csproj', 'src/ReadTheStupidText.Infrastructure/*.csproj', 'src/ReadTheStupidText.Mobile.Shared/*.csproj', 'src/ReadTheStupidText.Mobile.Shared/*.props', 'Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.platform }}-dinowin-

      # Stamp the GitVersion-derived version into the manifest (x.y.z.0 — the Store requires
      # revision 0). Anchored to line start and the self-closing ' />' so it only touches the
      # Identity Version, never TargetDeviceFamily's MinVersion/MaxVersionTested. Working copy
      # only — never committed.
      - name: Stamp manifest version (${{ inputs.version || needs.version.outputs.version }}.0)
        shell: bash
        run: |
          sed -i -E "s#^([[:space:]]*)Version=\"[0-9.]+\"([[:space:]]*/>)#\1Version=\"${VERSION}.0\"\2#" "$MANIFEST"
          if ! grep -qF "Version=\"${VERSION}.0\" />" "$MANIFEST"; then
            echo "::error::Failed to stamp Version=\"${VERSION}.0\" into ${MANIFEST}"; exit 1
          fi
          grep -nE 'Version=' "$MANIFEST"

      # -p:IncludeAndroid=false drops the csproj's Android target, leaving the Windows head.
      # The RuntimeIdentifier comes from -p:Platform inside the csproj: a global one would also
      # flow into Mobile.Shared and list its .pdb twice in the package (APPX1101). The Windows
      # MSIX is produced by `dotnet publish`; Release is self-contained (see the csproj).
      - name: Build and package MSIX (${{ matrix.platform }})
        run: >
          dotnet publish ${{ env.PROJECT }}
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:IncludeAndroid=false
          -p:Platform=${{ matrix.platform }}
          -p:AppxPackageSigningEnabled=false

      # Saved only after a good publish and only on an exact miss (a hit would be refused anyway).
      - name: Save NuGet packages cache
        if: success() && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      # Only the app package — NOT the Microsoft.WindowsAppRuntime dependency .msix under
      # Dependencies/ (same name for every arch; the Store/Windows resolves that runtime itself).
      - name: Upload MSIX to the draft release
        if: inputs.upload == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dino-v${{ inputs.version || needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # dotnet publish writes the package to AppPackages/, not bin/; search the
          # project tree but skip obj/ and the bundled Dependencies/ runtimes.
          mapfile -t msix < <(find src/DinoReader.App \( -path '*/obj' -o -path '*/Dependencies' \) -prune -o -name 'DinoReader.App_*.msix' -print)
          if [ "${#msix[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 app .msix, found ${#msix[@]}: ${msix[*]:-none}"; exit 1
          fi
          gh release upload "$TAG" "${msix[0]}" --repo "${{ github.repository }}" --clobber
