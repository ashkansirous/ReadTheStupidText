name: release-shared

# The part of a release that Read The Stupid Text and Dino Reader do the same way (Slice 369). `release-rtst.yml` and
# `release-dino.yml` call it with their `product`; it never starts on its own (`workflow_call` only: the push and manual
# triggers, the path filters and the concurrency groups live in the two callers). It replaces the first half of the old
# `release.yml`: version -> tests -> draft release. Everything after that (the platform builds, publishing the release, the
# store and TestFlight submits) is product-specific and stays in the callers.
#
#   version        wait for older runs of the caller, GitVersion with the product's config (GitVersion.yml for rtst, tags
#                  rtst-v<x.y.z>; GitVersion.dino.yml for dino, tags dino-v<x.y.z>), the Android versionCode and
#                  `.github/scripts/ship-targets.mjs` (which prints only this product's targets, from its own newest tag).
#   shared-test    tests.yml suite `shared` (Slice 368): both products ship the engine, so any product build needs it.
#   rtst-test      tests.yml suite `rtst`, RTST builds only.
#   dinoreader     Dino's own suite (dinoreader.yml), Dino targets only.
#   release-draft  create or reuse the product's DRAFT release (no tag until the caller's publish job), skip when this version
#                  is already published, and carry forward the product's untouched platforms from its last release.
#
# A target of the other product is never set (ship-targets prints only the product asked for), so each test and build
# condition below that names a Dino or an RTST target is simply false for the other product.
# A failed job here makes the caller's `shared` job fail, so no build of that product starts: the same gate the old
# workflow had, where a failed test or a failed version skipped every build. `site-checks` is advisory and so is NOT here
# (it lives in release-rtst.yml); a failure in it could otherwise block every build.
# GitHub Actions facts (context7, 2026-11-13): `github` is the caller's context in a called workflow; workflow-level env is
# not passed down, so every value comes in as an input; a called workflow can only lower the caller job's token permissions.

on:
  workflow_call:
    inputs:
      product:
        description: 'rtst (Read The Stupid Text) or dino (Dino Reader).'
        required: true
        type: string
      workflow_file:
        description: 'The caller workflow file (release-rtst.yml or release-dino.yml): the wait step lists its older runs.'
        required: true
        type: string
      force_all:
        description: 'Build every target of this product whatever changed (a manual run only).'
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: 'The product version, major.minor.patch.'
        value: ${{ jobs.version.outputs.version }}
      version_code:
        description: 'The Android versionCode for that version.'
        value: ${{ jobs.version.outputs.version_code }}
      windows:
        value: ${{ jobs.version.outputs.windows }}
      windows_store:
        value: ${{ jobs.version.outputs.windows_store }}
      android:
        value: ${{ jobs.version.outputs.android }}
      ios:
        value: ${{ jobs.version.outputs.ios }}
      dinoapp:
        value: ${{ jobs.version.outputs.dinoapp }}
      dinoios:
        value: ${{ jobs.version.outputs.dinoios }}
      dinowin:
        value: ${{ jobs.version.outputs.dinowin }}
      site_checks:
        description: 'RTST only: true when the advisory site checks should run for this push.'
        value: ${{ jobs.version.outputs.site_checks }}
      proceed:
        description: 'true when a draft release exists for this run and the builds should upload into it.'
        value: ${{ jobs.release-draft.outputs.proceed }}
      android_signed:
        description: 'true when the product Android signing secrets are all set.'
        value: ${{ jobs.release-draft.outputs.android_signed }}
      ios_signed:
        description: 'true when the product iOS signing secrets are all set.'
        value: ${{ jobs.release-draft.outputs.ios_signed }}

permissions:
  contents: read

jobs:
  # GitVersion for the product, and the ship-targets plan, in one full clone (ship-targets diffs against the product's last
  # published tag, and GitVersion needs the tags too).
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 130   # the wait for an older run (up to 120 min) plus the version work
    permissions:
      contents: write   # push the baseline tag
      actions: read     # gh run list, for the wait on older runs of the other event type
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      version_code: ${{ steps.versioncode.outputs.code }}
      tag: ${{ steps.product.outputs.prefix }}${{ steps.gitversion.outputs.majorMinorPatch }}
      windows: ${{ steps.targets.outputs.windows }}
      windows_store: ${{ steps.targets.outputs.windowsstore }}
      android: ${{ steps.targets.outputs.android }}
      ios: ${{ steps.targets.outputs.ios }}
      dinoreader: ${{ steps.targets.outputs.dinoreader }}
      dinoapp: ${{ steps.targets.outputs.dinoapp }}
      dinoios: ${{ steps.targets.outputs.dinoios }}
      dinowin: ${{ steps.targets.outputs.dinowin }}
      site_checks: ${{ steps.site.outputs.site_checks }}
    steps:
      # workflow_dispatch can be started on any branch; only main may release.
      - name: Refuse to run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::${{ inputs.workflow_file }} only runs on main (this is ${GITHUB_REF})."
          exit 1

      # The product decides the tag prefix and the GitVersion config; anything else is a bug in the caller.
      - name: Resolve the product
        id: product
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          case "$PRODUCT" in
            rtst) echo "prefix=rtst-v" >> "$GITHUB_OUTPUT"; echo "config=GitVersion.yml" >> "$GITHUB_OUTPUT" ;;
            dino) echo "prefix=dino-v" >> "$GITHUB_OUTPUT"; echo "config=GitVersion.dino.yml" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::release-shared.yml: unknown product '${PRODUCT}' (expected rtst or dino)."; exit 1 ;;
          esac

      # Slice 221 item 4. The version only moves when a tag is published, so a dispatch run and a push run in their
      # separate groups would compute the same version and share one draft (whose "retarget, clear assets" branch
      # would wipe the other run's assets). A run therefore waits while an OLDER run (smaller run number) of the
      # OTHER event type is still active. Only older runs are waited for, so there is no cycle; runs of the same
      # type are already serialised by their group. The "tag already published" skip decides what a later run ships.
      # Slice 369: the runs listed are those of the caller workflow (`workflow_file`), so the two products never wait on each other.
      - name: Wait for older release runs of the other event type
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          MY_FIX: ${{ contains(github.event.head_commit.message, '/fix/') }}
          # A whole older run takes up to ~60 min (observed 2026-11-01), so 2x margin; one still active after that is stuck.
          WAIT_LIMIT_MINUTES: 120
          POLL_SECONDS: 60
          MAX_LIST_ERRORS: 3
        run: |
          set -uo pipefail
          # A run's concurrency group, as the caller's `concurrency` block builds it: dispatch, one per fix merge (`/fix/` anywhere in the merge commit's message), or the ordinary push group.
          # The `contains` in the `concurrency` block ignores case, so the test here ignores case too (`grep -i`): `/Fix/` is a fix merge on both sides.
          # A commit that cannot be read after 3 tries is reported as `lookup-failed`: it does not block (a lookup failure must never mean a 120-minute wait), and a warning names the run.
          group_of() {
            if [ "$2" = "workflow_dispatch" ]; then echo dispatch; return; fi
            for _ in 1 2 3; do
              if message=$(gh api "repos/${REPO}/commits/$3" --jq .commit.message 2>/dev/null); then
                if grep -qiF '/fix/' <<<"$message"; then echo "fix-$1"; else echo push; fi
                return
              fi
              sleep 2
            done
            echo lookup-failed
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then MY_GROUP=dispatch; elif [ "$MY_FIX" = "true" ]; then MY_GROUP="fix-${RUN_NUMBER}"; else MY_GROUP=push; fi
          deadline=$(( $(date +%s) + WAIT_LIMIT_MINUTES * 60 ))
          errors=0
          while true; do
            if ! runs=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_FILE" --branch "$BRANCH" --limit 50 --json number,status,event,headSha 2>&1); then
              errors=$(( errors + 1 ))
              if [ "$errors" -ge "$MAX_LIST_ERRORS" ]; then
                echo "::error::gh run list failed ${errors} times in a row, so the older release runs cannot be checked; failing instead of racing them. Re-run this workflow. Last error: $runs"
                exit 1
              fi
              echo "::warning::gh run list failed (${errors}/${MAX_LIST_ERRORS}), retrying: $runs"
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Waited ${WAIT_LIMIT_MINUTES} min and gh run list still failing; giving up. Re-run this workflow."
                exit 1
              fi
              sleep "$POLL_SECONDS"
              continue
            fi
            errors=0
            # Every older active run, with the commit it ran for. Its group is worked out from the commit's whole message, the same text the `concurrency` block tests.
            active=$(jq -r --argjson me "$RUN_NUMBER" '
              .[] | select(.number < $me and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested"))
                  | "\(.number) \(.event) \(.status) \(.headSha)"' <<<"$runs")
            blocking=""
            while read -r number run_event status sha; do
              [ -z "$number" ] && continue
              group=$(group_of "$number" "$run_event" "$sha")
              if [ "$group" = "lookup-failed" ]; then
                echo "::warning::Could not read the commit of older release run #${number} after 3 tries; treating it as not blocking."
              elif [ "$group" != "$MY_GROUP" ]; then
                blocking="${blocking:+$blocking, }#${number} (${group}, ${status})"
              fi
            done <<<"$active"
            if [ -z "$blocking" ]; then
              echo "No older release run of the other event type is active; going on."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Waited ${WAIT_LIMIT_MINUTES} min for older release runs of the other event type ($blocking); giving up. Re-running this workflow is safe (the tag-already-published skip decides what ships); do it once they finish."
              exit 1
            fi
            echo "Waiting for older release runs of the other event type: $blocking"
            sleep "$POLL_SECONDS"
          done

      - name: Checkout (full history + tags — GitVersion and ship-targets need them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # With no <prefix><x.y.z> tag GitVersion would start the product at 0.1.0, and the
      # Android versionCode and Store version would go backwards. So the first run tags the
      # newest legacy v<x.y.z> release commit as <prefix><x.y.z> (and pushes it with this job's
      # token, which does not start other workflows); it fails only if no legacy tag exists either.
      # Only this product's prefix: the other product's workflow bootstraps its own.
      - name: Bootstrap the product's baseline tag
        env:
          PREFIX: ${{ steps.product.outputs.prefix }}
        run: bash .github/scripts/bootstrap-baseline-tags.sh "$PREFIX"

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine the version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true
          configFilePath: ${{ steps.product.outputs.config }}

      # Android versionCode must be a strictly increasing integer per app. Three-digit
      # minor/patch fields (the old 10000/100 packing collided once patch hit
      # 100); every code this yields exceeds the old scheme's 10012 for 1.0.12.
      # Both products continue from the old shared version, so neither code goes backwards.
      - name: Derive the Android versionCode
        id: versioncode
        env:
          MAJOR: ${{ steps.gitversion.outputs.major }}
          MINOR: ${{ steps.gitversion.outputs.minor }}
          PATCH: ${{ steps.gitversion.outputs.patch }}
        run: echo "code=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Which of this product's targets this run builds, from the files changed since the product's last
      # published tag and whether its major moved.
      - name: Decide what ships
        id: targets
        env:
          PRODUCT: ${{ inputs.product }}
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          FORCE_ALL: ${{ inputs.force_all && 'true' || 'false' }}
        run: node .github/scripts/ship-targets.mjs

      # Slice 239: whether release-rtst.yml's advisory `site-checks` runs (a push that only changes content/dino/** skips it).
      # A step here, not a job of its own (one less runner and clone). RTST only; continue-on-error so a failure here can
      # never fail the version job (an unset output simply skips the advisory site checks).
      - name: Decide whether the site checks run
        id: site
        if: inputs.product == 'rtst'
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/site-checks-needed.mjs

  # The shared engine's tests (Slice 368, tests/Shared.Tests): both products ship the same Domain/Application/Infrastructure/Mobile.Shared
  # code, so ANY product output that builds needs them. Each product's run executes them, so a push that starts both products
  # (a core change) runs the shared suite twice, once per run (accepted in Slice 369: the two runs are independent). Every build lists the caller's `shared` job,
  # and this job failing or being skipped never lets a build through (the draft below needs `success`).
  shared-test:
    needs: version
    if: >-
      needs.version.outputs.windows == 'true' || needs.version.outputs.android == 'true' || needs.version.outputs.ios == 'true'
      || needs.version.outputs.dinoapp == 'true' || needs.version.outputs.dinoios == 'true' || needs.version.outputs.dinowin == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      suite: shared

  # RTST's own pure-logic tests and phone-script self-tests (Slice 128; tests/ReadTheStupidText.Tests). Gate every Windows/Android/iOS
  # build and so every RTST release.
  rtst-test:
    needs: version
    if: needs.version.outputs.windows == 'true' || needs.version.outputs.android == 'true' || needs.version.outputs.ios == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      suite: rtst

  # Dino Reader's suite (Slice 128: every Dino target runs it). A Dino-only push whose only target is `dinoreader` tests but never releases.
  dinoreader:
    needs: version
    if: needs.version.outputs.dinoreader == 'true' || needs.version.outputs.dinoapp == 'true' || needs.version.outputs.dinoios == 'true' || needs.version.outputs.dinowin == 'true'
    uses: ./.github/workflows/dinoreader.yml

  # Creates (or, on a re-run / after a failed run, reuses and empties) a DRAFT <prefix><x.y.z> release at this merge commit.
  # Drafts create no tag, so nothing is visible or tagged until the caller's publish job. Skips the whole release
  # (proceed unset) if this version is already published: GitVersion holds the version steady until the next tag, so
  # consecutive pushes can resolve to the same one. Skipped outright when none of the product's platforms was selected
  # (docs, the other product only) or its tests are not all green.
  release-draft:
    needs: [version, shared-test, rtst-test, dinoreader]
    # !cancelled() plus explicit results: a bare `needs` would skip this job whenever a suite it does not need is skipped.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && needs.version.result == 'success'
      && ((inputs.product == 'rtst' && (needs.version.outputs.windows == 'true' || needs.version.outputs.android == 'true' || needs.version.outputs.ios == 'true'))
        || (inputs.product == 'dino' && (needs.version.outputs.dinoapp == 'true' || needs.version.outputs.dinoios == 'true' || needs.version.outputs.dinowin == 'true')))
      && needs.shared-test.result == 'success'
      && (inputs.product == 'dino' || needs.rtst-test.result == 'success')
      && (inputs.product == 'rtst' || needs.dinoreader.result == 'success' || needs.dinoreader.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      proceed: ${{ steps.draft.outputs.proceed }}
      # Whether the product's Android signing secrets are all set (RTST: the keystore; Dino Reader: its four signing
      # secrets plus the Play service account, so a half-configured repo never publishes a Dino-only GitHub release, Slice 58).
      android_signed: ${{ steps.signing.outputs.android_signed }}
      # Whether the product's iOS signing secrets are all set (all six, so a half-configured repo stays unsigned instead of
      # failing; Dino Reader has its own provisioning profile, Slice 67). Computed here from job-level env because `secrets`
      # can't appear in an `if:`.
      ios_signed: ${{ steps.signing.outputs.ios_signed }}
    env:
      HAS_RTST_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_P12_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_DINO_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_P12_PASSWORD != '' && secrets.DINOREADER_IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_RTST_ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
      HAS_DINO_ANDROID_SIGNING: ${{ secrets.DINOREADER_ANDROID_SIGNING_KEYSTORE_BASE64 != '' && secrets.DINOREADER_ANDROID_SIGNING_KEY_ALIAS != '' && secrets.DINOREADER_ANDROID_SIGNING_KEY_PASSWORD != '' && secrets.DINOREADER_ANDROID_SIGNING_STORE_PASSWORD != '' && secrets.DINOREADER_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PRODUCT: ${{ inputs.product }}
      TAG: ${{ needs.version.outputs.tag }}
      # The product's own three platform flags under one name each: RTST windows / android / ios, Dino Reader dinowin / dinoapp / dinoios.
      WIN: ${{ inputs.product == 'dino' && needs.version.outputs.dinowin || needs.version.outputs.windows }}
      ANDROID: ${{ inputs.product == 'dino' && needs.version.outputs.dinoapp || needs.version.outputs.android }}
      IOS: ${{ inputs.product == 'dino' && needs.version.outputs.dinoios || needs.version.outputs.ios }}
    steps:
      - name: Check the signing secrets
        id: signing
        run: |
          if [ "$PRODUCT" = "dino" ]; then
            echo "android_signed=${HAS_DINO_ANDROID_SIGNING}" >> "$GITHUB_OUTPUT"
            echo "ios_signed=${HAS_DINO_IOS_SIGNING}" >> "$GITHUB_OUTPUT"
          else
            echo "android_signed=${HAS_RTST_ANDROID_SIGNING}" >> "$GITHUB_OUTPUT"
            echo "ios_signed=${HAS_RTST_IOS_SIGNING}" >> "$GITHUB_OUTPUT"
          fi

      # An unsigned iOS build can't be shipped, and neither can an unsigned Dino Reader Android one, so a change that only
      # touches those while their signing secrets are missing releases nothing: no draft, no tag, and proceed stays unset so
      # every later release step is skipped. RTST's Android always ships (its release carries the unsigned .apk too).
      - name: Check that something shippable changed
        id: shippable
        env:
          ANDROID_SIGNED: ${{ steps.signing.outputs.android_signed }}
          IOS_SIGNED: ${{ steps.signing.outputs.ios_signed }}
        run: |
          android_ok=true
          if [ "$PRODUCT" = "dino" ]; then android_ok="$ANDROID_SIGNED"; fi
          if [ "$WIN" = "true" ] \
            || { [ "$ANDROID" = "true" ] && [ "$android_ok" = "true" ]; } \
            || { [ "$IOS" = "true" ] && [ "$IOS_SIGNED" = "true" ]; }; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only unsigned targets changed and their signing secrets are not set, so there is nothing to release."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse the draft release
        id: draft
        if: steps.shippable.outputs.ship == 'true'
        run: |
          set -euo pipefail
          state=$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq "map(select(.tagName == \"$TAG\")) | if length == 0 then \"missing\" else (.[0].isDraft | tostring) end")
          case "$state" in
            false)
              echo "::notice::Release $TAG is already published — version did not bump; skipping the release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            true)
              echo "Reusing draft $TAG: retargeting to ${GITHUB_SHA} and clearing stale assets."
              gh release edit "$TAG" --repo "$REPO" --target "$GITHUB_SHA"
              gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes; done ;;
            missing)
              gh release create "$TAG" --repo "$REPO" --draft --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes ;;
          esac
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (release scripts)
        if: steps.draft.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # A release carries every platform's latest build of its own product (Decision 57, Decision 137): a platform that
      # won't upload fresh assets this run (untouched, or Android without the signing secret) gets them copied from the
      # newest published release of the same product that has them (Releases API only — no Actions storage), so the newest
      # release never lacks the MSIX or the APK. The other product's files are never carried here. The first rtst-v / dino-v
      # release falls back to the old shared v<x.y.z> releases.
      - name: Carry forward assets of platforms not rebuilt
        if: steps.draft.outputs.proceed == 'true'
        env:
          ANDROID_SIGNED: ${{ steps.signing.outputs.android_signed }}
          IOS_SIGNED: ${{ steps.signing.outputs.ios_signed }}
        run: |
          set -euo pipefail
          if [ "$PRODUCT" = "dino" ]; then asset_prefix='DinoReader'; FIND_TAG_REGEX='^(dino-)?v[0-9]'; else asset_prefix='ReadTheStupidText'; FIND_TAG_REGEX='^(rtst-)?v[0-9]'; fi
          carry_forward() {
            local found source
            found=$(bash .github/scripts/find-release.sh "$1" "$FIND_TAG_REGEX")
            if [ -z "$found" ]; then echo "No earlier release has assets matching $1 — nothing to carry."; return 0; fi
            source=$(head -n 1 <<< "$found")
            mkdir -p carry && rm -f carry/*
            tail -n +2 <<< "$found" |
              while read -r name; do gh release download "$source" --repo "$REPO" --pattern "$name" --dir carry; done
            echo "Carrying forward from $source:"; ls carry
            gh release upload "$TAG" carry/* --repo "$REPO" --clobber
          }
          if [ "$WIN" != "true" ]; then carry_forward "^${asset_prefix}\.App_.*\.msix\$"; fi
          if [ "$ANDROID" != "true" ] || [ "$ANDROID_SIGNED" != "true" ]; then carry_forward "^${asset_prefix}-.*\.(aab|apk)\$"; fi
          if [ "$IOS" != "true" ] || [ "$IOS_SIGNED" != "true" ]; then carry_forward "^${asset_prefix}-.*\.ipa\$"; fi
