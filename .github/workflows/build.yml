name: build

# One workflow builds, releases and submits BOTH platforms (Batch 8, Decisions
# 52-58 in plan.md). Two hard rules shape it:
#
#   * ZERO Actions artifacts. The account's Actions+Packages storage quota is
#     500 MB, shared by every repo and billed as monthly GB-hours; one run's
#     MSIX x64 + ARM64 + AAB + APK is ~1 GB. GitHub Release assets don't count
#     toward that quota, so on main every build output goes straight to a
#     draft Release, and PRs upload nothing. Don't add actions/upload-artifact
#     for build outputs.
#   * Only build what changed. `changes` path-filters the diff: core code
#     (Domain/Application/Documents/tests/pipeline) builds both platforms,
#     App/Infrastructure only Windows, Mobile (+ the shared voice model) only
#     Android. A docs-only change builds nothing and cuts no release.
#     workflow_dispatch forces both.
#
# Flow on a push to main:
#   changes -> version -> test -> release-draft (create/reuse draft v<x.y.z>,
#   carry forward the untouched platform's assets from its last release)
#   -> build-windows (matrix) / build-android upload into the draft
#   -> release-publish (only if every affected build succeeded; the tag is
#   created here, so a failed run leaves no v* tag)
#   -> store-submit (Windows changed) / play-submit (Android changed).
#
# GitVersion derives the SemVer from git tags (Decision 17): main defaults to a
# patch bump; "+semver: minor|major|none" in a commit overrides it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: a new push cancels the old run. main: never cancel an in-progress run
# (two runs would race on the same draft Release). GitHub keeps only ONE
# pending run per group and drops older pending ones, which is safe only
# because `changes` diffs against the last release tag, so the surviving run
# still sees the dropped run's changes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout (push events diff with git)
      pull-requests: read   # paths-filter lists PR files via the API
    outputs:
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.windows == 'true' }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' || steps.filter.outputs.android == 'true' }}
    steps:
      - name: Checkout (with tags)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On main, diff against the last PUBLISHED release tag, not the previous
      # push: a platform change whose run failed, or whose pending run was
      # superseded in the concurrency queue, must still be built next time.
      - name: Find the last release tag
        id: base
        if: github.event_name == 'push'
        run: |
          tag=$(git for-each-ref --count=1 --sort=-v:refname --merged HEAD --format='%(refname:short)' 'refs/tags/v*')
          echo "Diffing against: ${tag:-<none — default branch>}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # PRs diff against the PR base (via the API; `base` is ignored there).
      - name: Classify changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.tag }}
          filters: |
            core:
              - 'src/ReadTheStupidText.Domain/**'
              - 'src/ReadTheStupidText.Application/**'
              - 'src/ReadTheStupidText.Documents/**'
              - 'tests/**'
              - 'global.json'
              - 'GitVersion.yml'
              - '*.slnx'
              - '.gitattributes'
              - '.github/workflows/build.yml'
              - '.github/scripts/find-release.sh'
            windows:
              - 'src/ReadTheStupidText.App/**'
              - 'src/ReadTheStupidText.Infrastructure/**'
              - '.github/workflows/store-submit.yml'
            android:
              - 'src/ReadTheStupidText.Mobile/**'
              - '.github/scripts/stage-android-package.sh'
              # The Mobile csproj bundles the Windows project's voice model.
              - 'src/ReadTheStupidText.App/VoiceModel/**'

  version:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      versionCode: ${{ steps.versioncode.outputs.code }}
    steps:
      - name: Checkout (full history + tags — GitVersion needs them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true

      # Android versionCode must be a strictly increasing integer. Three-digit
      # minor/patch fields (the old 10000/100 packing collided once patch hit
      # 100); every code this yields exceeds the old scheme's 10012 for 1.0.12.
      - name: Derive Android versionCode
        id: versioncode
        run: |
          CODE=$(( ${{ steps.gitversion.outputs.major }} * 1000000 + ${{ steps.gitversion.outputs.minor }} * 1000 + ${{ steps.gitversion.outputs.patch }} ))
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

  # Pure-logic unit tests (net10.0-windows: they reference Infrastructure).
  # Gates every build and so every release. No LFS — tests don't load the model.
  test:
    needs: changes
    if: needs.changes.outputs.windows == 'true' || needs.changes.outputs.android == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/ReadTheStupidText.Tests/ReadTheStupidText.Tests.csproj --configuration Release

  # main only. Creates (or, on a re-run / after a failed run, reuses and
  # empties) a DRAFT v<x.y.z> release at this merge commit. Drafts create no
  # tag, so nothing is visible or tagged until release-publish. Skips the whole
  # release (proceed=false) if this version is already published — GitVersion
  # holds the version steady until the next tag, so consecutive pushes can
  # resolve to the same one.
  release-draft:
    needs: [changes, version, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      proceed: ${{ steps.draft.outputs.proceed }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Create or reuse the draft release
        id: draft
        run: |
          set -euo pipefail
          state=$(gh release list --repo "$REPO" --limit 100 --json tagName,isDraft \
            --jq "map(select(.tagName == \"$TAG\")) | if length == 0 then \"missing\" else (.[0].isDraft | tostring) end")
          case "$state" in
            false)
              echo "::notice::Release $TAG is already published — version did not bump; skipping the release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            true)
              echo "Reusing draft $TAG: retargeting to ${GITHUB_SHA} and clearing stale assets."
              gh release edit "$TAG" --repo "$REPO" --target "$GITHUB_SHA"
              gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes; done ;;
            missing)
              gh release create "$TAG" --repo "$REPO" --draft --target "$GITHUB_SHA" \
                --title "$TAG" --generate-notes ;;
          esac
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout (release scripts)
        if: steps.draft.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      # A release always carries every platform's latest build (Decision 57):
      # a platform that won't upload fresh assets this run (untouched, or
      # Android without the signing secret) gets them copied from the newest
      # published release that has them (Releases API only — no Actions
      # storage), so releases/latest never lacks the MSIX or the APK.
      - name: Carry forward assets of platforms not rebuilt
        if: steps.draft.outputs.proceed == 'true'
        env:
          WINDOWS: ${{ needs.changes.outputs.windows }}
          ANDROID: ${{ needs.changes.outputs.android }}
          HAS_SIGNING: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          carry_forward() {
            local found source
            found=$(bash .github/scripts/find-release.sh "$1")
            if [ -z "$found" ]; then echo "No earlier release has assets matching $1 — nothing to carry."; return 0; fi
            source=$(head -n 1 <<< "$found")
            mkdir -p carry && rm -f carry/*
            tail -n +2 <<< "$found" |
              while read -r name; do gh release download "$source" --repo "$REPO" --pattern "$name" --dir carry; done
            echo "Carrying forward from $source:"; ls carry
            gh release upload "$TAG" carry/* --repo "$REPO" --clobber
          }
          if [ "$WINDOWS" != "true" ]; then carry_forward '^ReadTheStupidText\.App_.*\.msix$'; fi
          if [ "$ANDROID" != "true" ] || [ "$HAS_SIGNING" != "true" ]; then carry_forward '\.(aab|apk)$'; fi

  build-windows:
    needs: [changes, version, test, release-draft]
    # !cancelled() + explicit results: release-draft is skipped on PRs, and a
    # bare `needs` would cascade that skip into this job.
    if: >-
      !cancelled()
      && needs.changes.outputs.windows == 'true'
      && needs.version.result == 'success'
      && needs.test.result == 'success'
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: write   # gh release upload (main only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout (with LFS — the neural voice model is LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Stamp the GitVersion-derived version into the manifest (x.y.z.0 — the
      # Store requires revision 0). Anchored to line start and the self-closing
      # ' />' so it only touches the Identity Version, never TargetDeviceFamily's
      # MinVersion/MaxVersionTested. Working copy only — never committed.
      - name: Stamp manifest version (${{ needs.version.outputs.version }}.0)
        shell: bash
        env:
          MANIFEST: src/ReadTheStupidText.App/Package.appxmanifest
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s#^([[:space:]]*)Version=\"[0-9.]+\"([[:space:]]*/>)#\1Version=\"${VERSION}.0\"\2#" "$MANIFEST"
          if ! grep -qF "Version=\"${VERSION}.0\" />" "$MANIFEST"; then
            echo "::error::Failed to stamp Version=\"${VERSION}.0\" into ${MANIFEST}"; exit 1
          fi
          grep -nE 'Version=' "$MANIFEST"

      # RuntimeIdentifier is explicit because setup-msbuild puts the 32-bit
      # MSBuild.exe on PATH (reports x86) → NETSDK1032 against Platform=x64.
      - name: Build and package MSIX (${{ matrix.platform }})
        run: >
          msbuild src/ReadTheStupidText.App/ReadTheStupidText.App.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\AppPackages\
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false

      # Only the app package — NOT the Microsoft.WindowsAppRuntime dependency
      # .msix under Dependencies/ (same name for every arch; the Store/Windows
      # resolves that runtime itself).
      - name: Upload MSIX to the draft release
        if: needs.release-draft.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t msix < <(find AppPackages -name 'ReadTheStupidText.App_*.msix')
          if [ "${#msix[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 app .msix, found ${#msix[@]}: ${msix[*]:-none}"; exit 1
          fi
          gh release upload "$TAG" "${msix[0]}" --repo "${{ github.repository }}" --clobber

  # CI signs with an upload key; Google Play App Signing re-signs for
  # distribution, so no release-signing secret leaves CI (Decisions 18/42).
  # The unsigned Debug build is the compile check and always runs; the signed
  # .aab/.apk build only on main when cutting a release and once
  # ANDROID_SIGNING_KEYSTORE_BASE64 exists.
  build-android:
    needs: [changes, version, test, release-draft]
    if: >-
      !cancelled()
      && needs.changes.outputs.android == 'true'
      && needs.version.result == 'success'
      && needs.test.result == 'success'
      && (needs.release-draft.result == 'success' || needs.release-draft.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release upload (main only)
    env:
      # `secrets` can't appear in a step `if:` directly — only via `env:`.
      # Signed builds only when cutting a release: on PRs the output would be
      # discarded (nothing uploads) and the secrets needlessly exposed.
      SIGN_RELEASE: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && needs.release-draft.outputs.proceed == 'true' }}
      PUBLISH_DIR: src/ReadTheStupidText.Mobile/bin/Release/net10.0-android/publish
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout (with LFS — the neural voice model is LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # maui-android, not bare "android": a CLI-only SDK install needs the
      # MAUI workload pieces too (NETSDK1147 otherwise).
      - name: Install the .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Debug build (unsigned)
        run: dotnet build src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj -f net10.0-android -c Debug

      - name: Decode upload keystore
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/upload.keystore"

      # AAB is what Google Play needs. Passwords go as plain -p: properties:
      # the env: indirection is unsupported once AndroidPackageFormat=aab
      # (Actions still masks the secret values in logs).
      - name: Release build (signed .aab)
        if: ${{ env.SIGN_RELEASE == 'true' }}
        run: >
          dotnet publish src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=aab
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }}
          -p:ApplicationVersion=${{ needs.version.outputs.versionCode }}
          -p:AndroidKeyStore=True
          -p:AndroidSigningKeyStore="${{ runner.temp }}/upload.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

      - name: Stage signed .aab
        if: ${{ env.SIGN_RELEASE == 'true' }}
        run: bash .github/scripts/stage-android-package.sh aab

      # APK is the sideload format (adb install / tap to install) — same signed
      # publish, different package format.
      - name: Release build (signed .apk)
        if: ${{ env.SIGN_RELEASE == 'true' }}
        run: >
          dotnet publish src/ReadTheStupidText.Mobile/ReadTheStupidText.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }}
          -p:ApplicationVersion=${{ needs.version.outputs.versionCode }}
          -p:AndroidKeyStore=True
          -p:AndroidSigningKeyStore="${{ runner.temp }}/upload.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}

      - name: Stage signed .apk
        if: ${{ env.SIGN_RELEASE == 'true' }}
        run: bash .github/scripts/stage-android-package.sh apk

      - name: Upload .aab + .apk to the draft release
        if: ${{ env.SIGN_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${VERSION}" dist/* --repo "${{ github.repository }}" --clobber

  # Publishes the draft (creating the v<x.y.z> tag at the merge commit) only
  # when every platform this change touched built successfully.
  release-publish:
    needs: [changes, version, release-draft, build-windows, build-android]
    if: >-
      !cancelled()
      && needs.release-draft.outputs.proceed == 'true'
      && (needs.changes.outputs.windows != 'true' || needs.build-windows.result == 'success')
      && (needs.changes.outputs.android != 'true' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Publish v${{ needs.version.outputs.version }}
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          WINDOWS: ${{ needs.changes.outputs.windows }}
        run: |
          set -euo pipefail
          # A re-run of an old failed run must not publish its stale draft over
          # a newer release (it would become "latest" and hit the Store with a
          # lower version) — discard it instead.
          newest=$(gh release list --repo "$REPO" --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' |
            sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::warning::v${newest} is already published, newer than v${VERSION} — deleting this stale draft instead of publishing it."
            gh release delete "v${VERSION}" --repo "$REPO" --yes
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=$(gh release view "v${VERSION}" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets on v${VERSION}:"; echo "$names"
          if [ "$WINDOWS" = "true" ]; then
            built=$(grep -cE "^ReadTheStupidText[.]App_${VERSION//./[.]}[.]0_.*[.]msix$" <<< "$names" || true)
            if [ "$built" -ne 2 ]; then
              echo "::error::Expected 2 freshly built MSIX (x64 + ARM64) for ${VERSION}, found ${built}"; exit 1
            fi
          fi
          gh release edit "v${VERSION}" --repo "$REPO" --draft=false --latest
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Microsoft Store submission (Decision 44) — only when Windows was rebuilt.
  # A job in this run, not an `on: release` trigger: a GITHUB_TOKEN-created
  # release never starts another workflow run (GitHub's recursion guard).
  store-submit:
    needs: [changes, version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/store-submit.yml
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit

  # Google Play internal-testing upload — only when Android was rebuilt. A
  # no-op until both the signing and PLAY_SERVICE_ACCOUNT_JSON secrets exist;
  # Play Console also needs the very first release on a track uploaded by hand
  # once (an API limitation).
  play-submit:
    needs: [changes, version, release-publish]
    if: >-
      !cancelled()
      && needs.release-publish.outputs.released == 'true'
      && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Download the .aab from the release
        if: ${{ env.CAN_PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release download "v${VERSION}" --repo "${{ github.repository }}" --pattern "ReadTheStupidText-${VERSION}.aab" --dir play

      - name: Publish to Play Store (internal testing)
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.sirous.readthestupidtext
          releaseFiles: play/*.aab
          track: internal
          status: completed
