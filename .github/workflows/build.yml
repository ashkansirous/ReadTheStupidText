name: build

# One workflow runs the whole release pipeline in a single run — no PAT, no
# commit-back to main, no second workflow to trigger:
#
#   1. version  — GitVersion derives the SemVer from git history (git tags are
#                 the source of truth). main defaults to a Patch bump; override
#                 per commit with "+semver: minor" / "+semver: major" (see
#                 GitVersion.yml).
#   2. build    — packages the WinUI 3 single-project MSIX per architecture with
#                 that version stamped into the manifest at build time. Unsigned
#                 (the Microsoft Store re-signs on submission). Single-project
#                 MSIX can't emit a bundle, so each arch is built separately.
#   3. release  — only on a push to main: creates the v<x.y.z> tag at the merge
#                 commit and a GitHub Release with the MSIX assets. Because it's
#                 the same run, a plain GITHUB_TOKEN is enough (no cross-workflow
#                 trigger needed). PRs build + upload artifacts only.
#
# See Decision 17 / Slice 14 in plan.md and STORE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the release job creates the tag + GitHub Release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
      semver: ${{ steps.gitversion.outputs.semVer }}
    steps:
      - name: Checkout (full history + tags — GitVersion needs them)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0
        with:
          useConfigFile: true

  # Unit tests for the pure logic (PlaybackRate, SpeechTextChunker, settings
  # migration, voice table, activity log). Gates the build/release jobs so a
  # broken release never ships. No LFS needed — the tests don't load the model.
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet test tests/ReadTheStupidText.Tests/ReadTheStupidText.Tests.csproj --configuration Release

  build:
    needs: [version, test]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout (with LFS — the neural voice model is LFS-tracked)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Stamp the GitVersion-derived version into the manifest (x.y.z.0 — the
      # Store requires revision 0). The match is anchored to the start of the
      # line and the self-closing ' />' so it only touches the Identity Version,
      # never TargetDeviceFamily's MinVersion/MaxVersionTested. Working copy only
      # — never committed; git tags remain the source of truth.
      - name: Stamp manifest version (${{ needs.version.outputs.version }}.0)
        shell: bash
        env:
          MANIFEST: src/ReadTheStupidText.App/Package.appxmanifest
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i -E "s#^([[:space:]]*)Version=\"[0-9.]+\"([[:space:]]*/>)#\1Version=\"${VERSION}.0\"\2#" "$MANIFEST"
          if ! grep -qF "Version=\"${VERSION}.0\" />" "$MANIFEST"; then
            echo "::error::Failed to stamp Version=\"${VERSION}.0\" into ${MANIFEST}"; exit 1
          fi
          grep -nE 'Version=' "$MANIFEST"

      # RuntimeIdentifier is passed explicitly because the csproj otherwise infers
      # it from RuntimeInformation.ProcessArchitecture, and setup-msbuild puts the
      # 32-bit MSBuild.exe on PATH (reports x86) → NETSDK1032 against Platform=x64.
      - name: Build and package MSIX (${{ matrix.platform }})
        run: >
          msbuild src/ReadTheStupidText.App/ReadTheStupidText.App.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}
          /p:RuntimeIdentifier=${{ matrix.rid }}
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\AppPackages\
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=false

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadTheStupidText-msix-${{ matrix.platform }}
          path: ${{ github.workspace }}\AppPackages\**\*.msix
          if-no-files-found: error
          # On a push to main this artifact only exists to hand the built
          # MSIX from this job to `release` below, which republishes it as a
          # permanent GitHub Release asset within the same run — so it never
          # needs to outlive that handoff there. On a PR it's the only copy
          # (no release job runs), but a short life is still enough for a
          # reviewer to grab it. Each arch's MSIX is ~380MB — several times
          # the account's entire 500MB free Actions+Packages storage
          # allowance by itself, so keeping these around at all is what let
          # 224 uncapped artifacts (64.65GB) go back weeks and exhaust
          # storage for the whole account, blocking every repo's uploads
          # (found 2026-09-26). See "Clean up old build artifacts" below for
          # the same invariant applied to older runs' history.
          retention-days: 1

  # On a push to main, cut the release: tag v<x.y.z> at the merge commit and
  # publish the built MSIX packages as GitHub Release assets (stable, README-
  # linkable URLs and the hosted source for Store submission). Same run, so the
  # GITHUB_TOKEN-created tag needs no downstream trigger.
  release:
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.create_release.outputs.released }}
    steps:
      - name: Download built MSIX packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create v${{ needs.version.outputs.version }} tag + GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Idempotent: if this version was already released (a re-run, a race
          # between two quick main pushes, or a commit that didn't bump the
          # version), skip instead of failing the build. GitVersion holds the
          # version steady until the next tag, so consecutive pushes can resolve
          # to the same v<x.y.z>; the next change that bumps gets its own release.
          # `released` gates the store-submit job below — a skip here must not
          # trigger a Store submission for a release that wasn't actually cut.
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Release v${VERSION} already exists — version did not bump; skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the app package per arch — NOT the framework dependency packages
          # under Dependencies/ (every arch ships a same-named
          # Microsoft.WindowsAppRuntime.2.msix, which would collide as duplicate
          # release asset names). The Store/Windows resolves that runtime dependency.
          msix_files=$(find artifacts -name 'ReadTheStupidText.App_*.msix')
          echo "Publishing v${VERSION}:"; echo "$msix_files"
          # --target pins the tag to this merge commit; gh creates the tag itself.
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes \
            $msix_files
          echo "released=true" >> "$GITHUB_OUTPUT"

  # Submits the just-cut release to the Microsoft Store, automatically, on
  # every push to main (Decision 44). This runs as a job in THIS run rather
  # than store-submit.yml reacting to a `release: published` event, because
  # the release above is created with the default GITHUB_TOKEN — GitHub
  # never lets a GITHUB_TOKEN-triggered event (e.g. the release it just
  # created) start ANOTHER workflow run, by design (recursion guard), so a
  # separate `on: release:` trigger would silently never fire. Calling the
  # reusable workflow as a job here sidesteps that: it's part of this same
  # push-triggered run, not a new one.
  store-submit:
    needs: [version, release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true'
    uses: ./.github/workflows/store-submit.yml
    with:
      tag: v${{ needs.version.outputs.version }}
    secrets: inherit

  # Separate job, not a step tacked onto `build`: `build` is a per-arch
  # matrix, so a step there would run this twice (and delete-race itself)
  # per push. `always()` + no dependency on release/store-submit succeeding
  # so cleanup still runs even if a later job in this same run fails.
  cleanup-artifacts:
    needs: [build]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A job's own `permissions:` block replaces every scope, not just the
    # ones listed — it does NOT fall back to the workflow-level
    # `contents: write` above (that's for `release`'s tag/Release creation).
    # Omitting contents:read here left `actions/checkout@v4` below with
    # contents:none, failing the checkout and skipping every step after it
    # — including the cleanup step itself — on every run, found in review.
    permissions:
      contents: read
      actions: write
    steps:
      # A local composite action (./.github/actions/...) needs the repo on
      # disk first — this job otherwise has no checkout at all, unlike
      # `build`/`release` above which get one implicitly from their other
      # steps.
      - uses: actions/checkout@v4

      - name: Clean up old build artifacts
        # Keeps only the single most recent run of this workflow on main,
        # deleting the rest — 224 uncapped artifacts (64.65GB, averaging
        # ~576MB/run against a 500MB account-wide quota) went back weeks
        # with no cleanup at all, exhausting the account's Actions+Packages
        # storage and blocking every upload in every repo on the account
        # (found 2026-09-26 while debugging an unrelated repo's broken CI).
        # KEEP_RUNS=1, not a larger number: even a single run's two MSIX
        # files already exceed the whole 500MB free quota on their own, so
        # keeping more only guarantees recurrence. The upload step's own
        # retention-days: 1 is the other half of containing that (these
        # artifacts are superseded by a permanent GitHub Release within the
        # same run on main anyway); this step is defense-in-depth for
        # history beyond it, and the only cleanup a PR build's artifacts get
        # (this job is main-scoped; retention-days handles PR branches on
        # its own). See the composite action for why this always keeps this
        # run's own artifacts regardless of a concurrent run racing it.
        continue-on-error: true
        uses: ./.github/actions/cleanup-old-artifacts
        with:
          workflow-file: build.yml
          keep-runs: 1
