# Slice 72: R8 keep rules shared by both apps (imported from AndroidRelease.props).
# MAUI Essentials (MediaPicker, FilePicker) reaches these through JNI static-field and
# method lookups by name, e.g. ActivityResultContracts$PickVisualMedia$ImageOnly.INSTANCE;
# R8 renames or drops them otherwise (NoSuchFieldError at runtime).
-keep class androidx.activity.result.contract.** { *; }
-keep class androidx.activity.result.** { *; }
# ML Kit text recognition: the binding reads TextRecognizerOptions.DEFAULT_OPTIONS by name
# (JNI GetStaticFieldID); R8 renamed it (NoSuchFieldError -> "Couldn't read that file" on every Photos import).
-keep class com.google.mlkit.vision.text.latin.TextRecognizerOptions { *; }
# General safety net: .NET bindings read public static fields by name over JNI, so keep them
# (names intact) for every library namespace we bind. Methods and instance members stay obfuscated.
-keepclassmembers class androidx.** { public static <fields>; }
-keepclassmembers class com.google.** { public static <fields>; }
-keepclassmembers class com.k2fsa.** { public static <fields>; }
-keepclassmembers class android.** { public static <fields>; }
-keepclassmembers class kotlin.** { public static <fields>; }
-keepclassmembers class kotlinx.** { public static <fields>; }
-keepclassmembers class crc64** { public static <fields>; }
