<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>All the books - Dino Book Reader</title>
  <meta name="description" content="Every book in the Dino Book Reader story store, which are free and which are paid, and the price. Books are chosen and read in the app." />
  <link rel="icon" type="image/png" href="/dino/icon.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F3EFE6; --ink: #2b2540; --soft: #5a5470; --muted: #8a8399;
      --card: #FFF6E6; --line: #d9d2c4; --brand: #5B57E8; --brand-ink: #ffffff; --free: #1f7a4d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1a2b; --ink: #f1edff; --soft: #c2bcd8; --muted: #9a94b2;
        --card: #28243a; --line: #3a3450; --brand: #8a86f2; --brand-ink: #1d1a2b; --free: #6fd6a2;
      }
    }
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); overflow-x: clip;
      /* No webfont is loaded (no third-party request on a kids' site): the rounded system fallback applies. */
      font-family: "Fredoka", "Andika", "Segoe UI Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    a { color: var(--brand); }
    a:focus-visible, .btn:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: 999px; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; padding-bottom: 16px; flex-wrap: wrap; }
    .brandmark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.2rem; color: var(--ink); text-decoration: none; }
    .brandmark img { width: 40px; height: 40px; border-radius: 10px; }
    .tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .tools a { color: var(--ink); text-decoration: none; font-weight: 600; }
    .tools a:hover { text-decoration: underline; }
    .tools label { color: var(--soft); font-weight: 500; }
    select {
      font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: .3rem .9rem;
    }
    h1 { font-size: 2.2rem; line-height: 1.15; margin: 8px 0 12px; }
    .lede { font-size: 1.1rem; color: var(--soft); margin: 0 0 24px; max-width: 46rem; }
    .btn {
      display: inline-block; padding: .5rem 1.2rem; border-radius: 999px; border: 0; cursor: pointer; font: inherit; font-weight: 600;
      background: var(--brand); color: var(--brand-ink); text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.alt { background: transparent; color: var(--ink); border: 2px solid var(--line); padding: calc(.5rem - 2px) calc(1.2rem - 2px); }
    .status { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 0 0 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status[hidden] { display: none; }
    .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
    .books { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .book { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .cover { aspect-ratio: 1 / 1; background: var(--line); }
    .cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .info h2 { font-size: 1.1rem; line-height: 1.3; margin: 0; }
    .credit { margin: 0; color: var(--soft); font-size: .9rem; }
    .facts { margin: 0; padding: 0; list-style: none; color: var(--soft); font-size: .9rem; }
    .price { margin-top: auto; padding-top: 8px; font-weight: 700; color: var(--brand); }
    .price.free { color: var(--free); }
    .get { margin: 28px 0 8px; }
    .get h2 { font-size: 1.3rem; margin: 0 0 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    footer { border-top: 1px solid var(--line); margin-top: 32px; padding: 24px 0 40px; font-size: .9rem; color: var(--soft); }
    footer p { margin: 0 0 6px; }
    @media (min-width: 760px) { h1 { font-size: 3rem; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brandmark" href="./"><img src="/dino/icon.png" width="40" height="40" alt="" /><span>Dino Book Reader</span></a>
      <div class="tools">
        <a id="home" href="./">Home</a>
        <label for="lang" id="langLabel">Language</label>
        <select id="lang"></select>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1 id="title">All the books</h1>
      <p class="lede" id="lede"></p>

      <div class="status" id="loading" role="status" hidden>
        <span class="spin" aria-hidden="true"></span><span id="loadingText"></span>
        <button type="button" class="btn alt" id="cancel"></button>
      </div>
      <div class="status" id="failed" role="alert" hidden>
        <span id="failedText"></span>
        <button type="button" class="btn" id="retry"></button>
      </div>
      <p id="empty" class="lede" hidden></p>

      <ul class="books" id="books"></ul>

      <section class="get" aria-labelledby="getTitle">
        <h2 id="getTitle"></h2>
        <div class="actions">
          <a class="btn" href="https://apps.microsoft.com/detail/9N9VHRLCZXN5">Windows - Microsoft Store</a>
          <a class="btn alt" href="./#platforms">Android - Google Play</a>
          <a class="btn alt" href="https://testflight.apple.com/join/WnF7M53D">iPhone, iPad - TestFlight</a>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <p>&copy; 2026 Ashkan Sirous &middot; <a href="privacy">Privacy Policy</a></p>
    </div>
  </footer>

    var controller = new AbortController(), timeout = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
    state.controller = controller; state.cancelled = false;
    showFailed(false);
    state.slowTimer = setTimeout(function () { showLoading(true); }, SLOW_MS);
    return Promise.all([getJson("/api/stories", controller.signal), loadConfig(controller.signal)]).then(function (both) {
      state.stories = Array.isArray(both[0].stories) ? both[0].stories : [];
      state.config = both[1]; state.loaded = true;
      paintBooks();
    }).catch(function (e) {
      if (state.controller !== controller) return; // superseded by a newer load: it owns the page now
      if (!state.cancelled) console.error("books: the list failed to load", e);
      paintFailedText();
      showFailed(true);
    }).then(function () { clearTimeout(timeout); if (state.controller === controller) endLoad(); });
  }

  function chooseLanguage(code) {
    state.code = code;
    var url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url.pathname + url.search);
    paintStatic(); paintBooks();
  }

  function start() {
    fillLanguageChooser();
    state.code = pickLanguage(new URLSearchParams(location.search).get("lang"), navigator.languages || [navigator.language]);
    paintStatic();
    $("lang").addEventListener("change", function () { chooseLanguage(this.value); });
    $("cancel").addEventListener("click", function () { state.cancelled = true; if (state.controller) state.controller.abort(); });
    $("retry").addEventListener("click", load);
    load();
  }

  start();
})();
</script>
</body>
</html>
